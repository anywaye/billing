# gate.yml — how billing is gated, declared rather than guessed.
#
# WHY THIS FILE EXISTS. The cafaye standard for declaring a gate lives in
# `cafaye/core`: `schemas/gate.schema.json` is the format, `harness/gate_check.py`
# is the checker, and `docs/gate.md` is the reasoning. billing is adopting it, not
# inventing it. Seven of thirteen services declared a gate before this commit
# and billing was not one of them, which meant a developer here could run
# `bin/prime`, see green, and learn nothing about whether the gate could detect
# anything. A checker replaced by a function that unconditionally exits 0 would
# have left this repository green. So the claim below is that `bin/prime` really
# ran 763 tests, and it is written down in a form a machine can check.
#
# WHAT THE CHECKER PROVES ABOUT THIS FILE, AND WHAT IT DOES NOT. It proves the
# command resolves, `bin/prime` exists and is executable, `mise run prime`
# resolves to that same file, the CI workflow really invokes it, and — the part
# that matters — that running the gate makes every line in `proof` below appear,
# at or above the floor stated. It does NOT prove the tests touched the database
# they claim to, and it does NOT prove an external requirement is satisfied: a
# requirement is the operator's to satisfy, before gating. Both limits are
# recorded in `harness/gate_findings.json`'s `notEnforced`, and both are quoted
# where they matter below rather than left for a reader to go and find.
#
# MEASURED, NOT GUESSED. Every number and every pattern here came from running
# this repository's gate on billing at `bd6ac84`, on a saturated 8-core host
# (load average 83-107, ruby 4.0.1 via mise 2026.8.4, rails 8.1.4, PostgreSQL
# 18.4 on macOS arm64). Re-run after the host restarted under a lighter load
# (31-64) and every number below came back identical — 93 files, 763 runs, 2100
# assertions, 0 skips — which is the second data point a floor wants. What it
# printed, in full, is:
#
#   == ruby 4.0.1 (pinned by .ruby-version)
#   == bundle install
#   Bundle complete! 15 Gemfile dependencies, 106 gems now installed.
#   == rails db:prepare
#   Created database 'worker_billing_10_gate_development'
#   Created database 'worker_billing_10_gate_test'
#   == rubocop
#   Inspecting 93 files
#   93 files inspected, no offenses detected
#   == rails test
#   Running 763 tests in parallel using 8 processes
#   Finished in 82.955614s, 9.1977 runs/s, 25.3147 assertions/s.
#   763 runs, 2100 assertions, 0 failures, 0 errors, 0 skips
#   == prime ok (rails Rails 8.1.4)
#
# 163 seconds wall clock, warm. The database name is this worktree's own,
# derived from the checkout's directory by `config/database.yml`, so it is
# spelled differently in every worktree and is deliberately not matched by any
# pattern below.
#
# WHAT THE DEVELOPER'S COMMAND IS, AND WHAT CI'S IS. They are the same command,
# and that is a measured claim rather than a reading of the job's name.
# `.github/workflows/ci.yml`'s `gate` job has a step whose body is literally
#   bin/prime 2>&1 | tee "$log" || status=$?
# so `invokes` below names `bin/prime` verbatim and there is no CI-only variant
# to drift. What CI adds AROUND that same command is the part worth recording,
# because it is the part a developer running `bin/prime` alone does not get:
#
#   * `CORE_PATH` set on the job, from a checkout of `cafaye/core`. Without it
#     the contract tier SKIPS. See the `suite` proof — this is not a detail.
#   * `CI=true`, which `config/environments/test.rb` reads to turn eager loading
#     on, plus a step that fails if `eager_load` is false or if `eager_load!`
#     loaded fewer files than `app/**/*.rb` contains.
#   * `DATABASE_URL` naming a per-run database, so two overlapping runs cannot
#     land on one.
#   * per-tier runs with their own counts: the contract tier (26 runs), the
#     webhook tier (138 runs), the money-path coverage gate (5 runs).
#   * a guard that fails the build on a single skipped test, and a
#     `git diff --exit-code` for the whole tracked tree.
#
# So the honest statement is: **`bin/prime` is the gate, and CI runs the same
# gate with three environment variables set and four assertions bolted on that
# are not part of the script.** Those four are named in REPORT-billing-10-gate
# with the variable each one needs, because "CI runs more than the local gate" is
# a fact a declaration should state rather than a gap it should imply away.
# ------------------------------------------------------------------------------
# RED-PROVED. A gate that has never been observed red is not a gate, so this
# declaration was broken on purpose five times, `gate_check.py --prove` was run
# after each, and every run exited 1 naming the finding it expected. They are
# reproducible — `script/gate_declaration_self_test.sh` runs all five against the
# checker and asserts the finding id, so a red proof nobody can re-run is a
# claim rather than evidence. All five were reverted; the tree is clean apart
# from this file, the toolchain check in `bin/prime`, that script, the changelog
# entry and the report.
#
#   1. replace `bin/prime`'s body with `exit 0`  ->  `gate.proof-missing` on all
#      six proofs at once. THE CASE THIS FORMAT EXISTS FOR: a command that exits
#      zero without having run anything. It is red by six independent findings
#      rather than by the exit code, so it cannot be talked green by editing one
#      of them away.
#   2. `rm test/integration/health_test.rb`  ->  `gate.floor` on BOTH floors at
#      once, and both numbers were read out of the report rather than predicted:
#        FAIL gate.floor: proof 'lint'  reported 108  and the floor is 109
#        FAIL gate.floor: proof 'suite' reported 945 and the floor is 950
#      RE-MEASURED IN THE MERGE. These were 92/93 and 758/763 when the packet
#      wrote this file, and they were correct then. They stopped being correct
#      silently, because floors never block a merge — see the `suite` floor's
#      own comment, which records the resulting false green at length.
#      THE ONE THAT TAUGHT THIS FILE SOMETHING, and it is guard's near-miss
#      turned around. guard's `pass` floor carried a margin of five and stayed
#      GREEN through the deletion of a five-test file; only its `files` floor
#      caught it. This file is the same 5-test file (5 tests, referenced by
#      nothing, touches no money — so the 100%-coverage gate cannot be what made
#      it red, which is what makes this case show what it was written to show).
#      With no margin on either floor here, 945 is 5 under 950 and 108 is 1 under
#      109, and it is caught twice over. Both of those are only true because the
#      floors were RAISED IN THE MERGE — at 763/93 this exact deletion left 945
#      and 108, moved nothing, and the checker said green. Two floors is the measured reason, not a
#      stylistic one: a single floor leaves a file deletion that moves the run
#      count by less than its margin, and a margin of zero is not a reason to
#      run one floor when two are available.
#   3. raise `proof[].minimum` on `suite` by one  ->  `gate.floor`.
#      Proves the floor is a live number and not decoration. The self-test
#      READS the current floor out of this file rather than naming it, after
#      hardcoding it here proved that a stale copy of the number reports the
#      case green while testing nothing.
#   4. `rm bin/prime`  ->  `gate.command-missing` AND `gate.entrypoint-missing`.
#      The static half catches it; no suite run needed.
#   5. a `ruby` first on PATH that answers 3.4.2 instead of 4.0.1  ->  the
#      checker reports `gate.nonzero: the gate exited 127` plus all six
#      `gate.proof-missing`, and `bin/prime`'s own first line names both numbers.
#      Before the check this declaration accompanies, the same PATH produced
#      `Could not find 'bundler' (4.0.18) (Gem::GemNotFoundException)` and exit
#      1 — red, but a red that names a gem four steps away from the toolchain
#      that is wrong. So case 5 asserts the MESSAGE, not just the exit code, and
#      it would have passed against the old `bin/prime` on the exit code alone.
#
# Note what is NOT in that list: no breakage weakened an assertion, added a
# sleep, or raised a retry count. Every one of the five is a deletion, a
# substitution, a number, or a PATH — the only honest ways to make a gate go red
# without changing what the suite verifies.
# ------------------------------------------------------------------------------
version: 1
name: billing

gate:
  # An argv, not a shell string. This fleet's one recorded false green was
  # `… | tail -45; echo "PRIME EXIT=$?"` under zsh, where `$?` was `tail`'s and
  # `tail` is always 0. An argv has no pipeline in it to lose an exit code.
  # (This file is written by an agent that reproduced that mistake while
  # measuring it: `core/harness/bin/gate-check … | tail -20; echo "EXIT=$?"`
  # printed `EXIT=0` over a checker that had just reported a failure. The
  # measurements below all used a log file and the command's own status.)
  command: [bin/prime]
  # The fleet's spelling, and it already resolves to the entrypoint below:
  # `mise.toml` says `[tasks.prime] run = "./bin/prime"`. No rename needed, which
  # is the one step of the adoption that was already correct.
  miseTask: prime
  # The file behind the command, checked on disk, with the executable bit.
  entrypoint: bin/prime
  # 1800, and the number is not a guess: it is the `timeout-minutes: 30` on
  # this repository's own `gate` job in `.github/workflows/ci.yml`. A warm gate
  # measured 163s on a host whose load average was 83-107, so the budget is
  # roughly eleven times a warm run and the cold path is `bundle install`
  # compiling 106 gems including the `pg` native extension. Declaring the same
  # deadline the job declares means a hang is reported at the same moment in both
  # places; a timeout tighter than that would be a timeout that fires on
  # somebody's first clone and reports a red that is not the suite's answer.
  timeoutSeconds: 1800
  proof:
    # ---------------------------------------------------------------------
    # The toolchain, and the newest thing in this file.
    #
    # `bin/prime` used to print `ruby --version`'s first line and move on, so
    # `require ruby` was satisfied by macOS's system Ruby 2.6.10 and the run
    # died four lines later on `Could not find 'bundler' (4.0.18)`. The pin is
    # now read from `.ruby-version` and compared, and the banner is the pin
    # rather than the version string — so this line is an ASSERTION, not a log
    # line, and it is the line that disappears if the comparison is deleted.
    #
    # Version-agnostic on purpose. `^== ruby 4\.0\.1` would be a tripwire that
    # fires on a legitimate Ruby bump and gets deleted with the bump; this
    # pattern survives one and still fails if the check is removed, because the
    # phrase `(pinned by .ruby-version)` only exists if the check ran. Anchored
    # at both ends: the checker reads the LAST match, so a loose pattern here
    # could pick up a different line and report the wrong number.
    - id: toolchain
      match: '^== ruby [0-9]+\.[0-9]+\.[0-9]+ \(pinned by \.ruby-version\)$'
    # ---------------------------------------------------------------------
    # The install. `bundle install`, never `bundle update` — a prime that moves
    # the lockfile can make two worktrees disagree about the same commit, and in
    # a service that moves money the disagreement is two builds with different
    # `pg` versions, one of which was tested. Deleting this line is a
    # `gate.proof-missing` rather than a gate that quietly depends on whatever
    # gems the machine happened to have.
    - id: bundle
      match: '^== bundle install$'
    # ---------------------------------------------------------------------
    # The database step, and the shape of identity's 1430-green-tests-against-
    # an-empty-schema defect turned inside out.
    #
    # `bin/prime` runs `rails db:prepare` before the suite, under
    # `set -euo pipefail` with no error handling to forget, so this banner
    # appearing at all means the step was reached and returned 0 — which means
    # the schema was loaded from this repository's own `db/schema.rb`. If
    # `db:prepare` fails the script aborts and none of the later proofs can
    # appear, so this proof is a floor under a chain rather than a link in it.
    #
    # What it does NOT prove: that the suite used that schema. A proof is a
    # line of output, and only a test that asserts it can say that — which is
    # what `test/contract/` and the 100%-coverage gate on the money paths are
    # for. What it does catch is the reverse defect: a gate that stopped
    # preparing its own database, which is green on a machine that happens to
    # have one and red on a clean one, and nobody finds out which machine they
    # are on until CI.
    #
    # No connection string is matched here, and that is a decision rather than
    # an oversight. `DATABASE_URL` may carry a password, and a pattern
    # containing one is a credential written into a file that ends up in every
    # CI log which reports on it. The banner is the claim; the URL stays out.
    - id: database
      match: '^== rails db:prepare$'
    # ---------------------------------------------------------------------
    # The linter, counted. `bin/prime` PROBES for rubocop and, if it is absent
    # from the bundle, writes one line to stderr and CONTINUES to the suite — a
    # green gate over a repository that stopped linting, with the only evidence
    # on a stream a summary tends to scroll past. Declaring the count turns
    # that into a `gate.proof-missing`, which is a FAILURE, and it is the
    # cheapest proof in this file for a real failure mode.
    - id: lint
      match: '^([0-9]+) files inspected, no offenses detected$'
      # 93, and 93 is the measured count, with no margin. The schema's own
      # guidance is "set it to the number the thing has today: it is then a
      # decrease-detector, which is the only kind of floor worth having."
      #
      # This is also the STRUCTURAL detector, and it is the second of two
      # independent numeric floors on purpose. `suite` counts runs; this counts
      # files; a deletion moves them differently, and a file added to an
      # existing test file moves only this one. guard measured the near-miss
      # that motivates it: a `pass` floor set with a margin of five stayed GREEN
      # through the deletion of a five-test file, and only guard's `files` floor
      # caught it. There is no margin on either floor in this file, so that
      # class of miss is structurally impossible here — but a single floor would
      # still leave a file deletion that happened to move the run count by less
      # than the margin, and a margin of zero is not a reason to run one floor
      # when two are available.
      #
      # 109 of the repository's tracked `.rb` files; rubocop excludes one.
      # Verified stable between this worktree and a plain directory copy, which
      # matters because a count that moved with the checkout would be a coin
      # flip. **That paragraph is now history**: the floor below is 127,
      # measured, and this one was eleven below the truth before this commit.
      #
      # RAISED 93 -> 109 IN THE MERGE, which is what the comment above this one
      # said had to happen: *"Goes to 97 when billing-09-race merges — four new
      # test files, no new app file... Measure the merge result rather than
      # trusting that arithmetic."* The arithmetic was wrong in a way worth
      # recording. billing-12 and billing-13 both landed since, and the measured
      # count on the merged tree is **109**, not 97.
      #
      # **This is how the floor failed, and it is the reason it is a floor and
      # not a comment.** At 93 the declaration's own self-test could not detect
      # the deletion it was written to detect: `rm test/integration/health_test.rb`
      # left 108 files against a floor of 93 and the checker reported green. The
      # packet's breakage #2 said that case would be *"caught twice over"*, and on
      # the branch it was — against a tree where 93 was the truth. Once other
      # packets merged, the same deletion moved a number 16 above the floor and
      # the case went **green on a declaration that was silently 16 too low**.
      # A floor is a claim about the present; every other packet that lands here
      # invalidates it silently, because nothing goes red to say so.
      #
      # CI's `BASELINE_RUNS` was already 950 when this gate.yml still said 763 —
      # the two halves of one ratchet, one maintained and one not, which is the
      # same shape as D14 and D15: a declaration that records what the gate is
      # worth, and nothing that keeps it worth it after a merge.
      #
      # RAISED 109 -> 127 IN billing-21, and this one had drifted by **eleven**
      # before that: rubocop reported 120 inspected on the tree as it stood, so
      # the floor was eleven below the truth and had been through at least one
      # merge. The file's own argument above is the argument for fixing it here —
      # a floor too low is not a safe floor, it is a check that has stopped
      # checking, and it is invisible because floors never block a merge.
      #
      # 120 -> 127 is billing-21's seven new `.rb` files: four in `app/`
      # (`identity.rb`, `identity/token_verifier.rb`, `principal.rb`,
      # `authenticates_principal.rb`), two in `test/authentication/`, and
      # `test/support/identity_helpers.rb`. Measured by running
      # `bundle exec rubocop --parallel` on the stashed tree and on this one.
      #
      # 127 -> 136 is the checkout packet's nine new `.rb` files, and 136 -> 142
      # is the receipts packet's six: `app/models/charge.rb`,
      # `app/services/webhooks/charges/recorder.rb`,
      # `app/controllers/v1/charges_controller.rb`, and the three specs. Same
      # measurement, same command.
      #
      # 142 -> 150 is the fake-client packet, and it is the one that proves the
      # floor had already gone stale again — the same shape as the two the
      # paragraph above records, and the same lesson: **every packet that lands
      # invalidates a floor silently.** Between the receipts packet and this
      # one, four more packets landed (outbox publisher, tenancy, event
      # payloads, the core-location fix) and the measured count was **153**
      # while the floor sat at 142 — inferred and then measured: this packet's
      # net is -3 files (five deleted — the pay initializer and four pay
      # migrations — and two added: `fake_client.rb` and the drop migration),
      # and the measurement on this tree is 150. So the floor is raised to 150,
      # closing a silently-carried 11-file gap. Measured with
      # `bundle exec rubocop --parallel` on this tree, no margin, same rule.
      #
      # 150 -> 152 is the checkout door: two new `.rb` files (the controller and
      # its request spec), measured the same way. 152 -> 153 is the upcoming
      # invoice's request spec.
      minimum: 158
    # ---------------------------------------------------------------------
    # The suite. THE load-bearing proof, and the only line that cannot appear
    # unless the suite ran to the end and every assertion in it passed.
    #
    # `0 failures, 0 errors, 0 skips` is all pinned, and the `0 skips` is the
    # most important character sequence in this repository. It is not tidiness;
    # it is a finding this declaration was written against. Measured here, same
    # commit, same command, twice:
    #
    #   core readable    763 runs, 2100 assertions, 0 failures, 0 errors,  0 skips
    #   core unreadable  763 runs, 1757 assertions, 0 failures, 0 errors, 20 skips
    #
    # **Same run count. Same exit code. 343 assertions of contract checking not
    # done.** `test/contract/outbox_envelope_contract_test.rb` skips every test in
    # the file when it cannot read core's schemas, and
    # `test/integration/subscription_delivery_test.rb` skips when it cannot read
    # core's catalog; both print a `skip` message rather than failing, which is
    # correct for a developer with a standalone checkout and exactly wrong for a
    # green badge. On this machine the two tiers ran only because
    # `Rails.root.join("..", "core")` happens to resolve — `core` is a sibling
    # directory of this worktree. On any checkout where it does not, `bin/prime`
    # prints `prime ok` over a suite that verified nothing about the frozen v0.2
    # event schema this service is pinned to.
    #
    # Pinning `0 skips` makes that a `gate.proof-missing`, which is a failure.
    # It means the declared gate is red on a machine without a core checkout,
    # and that is the intended reading rather than a harsh one: AGENTS.md already
    # says "a `19 skipped` in the contract tier is a missing core checkout, not a
    # pass", CI's `gate` job already fails the build on a single skipped test,
    # and the `filesystem` requirement below carries the remedy. The alternative
    # — a declaration that is quietly satisfied by 20 skips — is a false green
    # over the tier that exists to catch a change in core.
    #
    # WHAT WAS NOT CHANGED, and it is the limit of this packet: `bin/prime`
    # itself still exits 0 over a skipped contract tier. Turning that into a
    # nonzero would change what the repository's gate accepts, which is a
    # decision above this packet. The declaration converts it from silent to
    # named for anything run through the gate checker; it does not convert it
    # for a developer who runs `bin/prime` by hand. REPORT-billing-10-gate
    # names this as the open item.
    - id: suite
      match: '^([0-9]+) runs, [0-9]+ assertions, 0 failures, 0 errors, 0 skips$'
      # 763, the measured number, with no margin — same rule and same reasoning
      # as `lint` above, and the reason is guard's near-miss again. A margin
      # here is a hole of exactly that size in a repository whose first tests to
      # be lost would be the money arithmetic and the webhook signatures.
      #
      # No margin also means no work is owed to move it: billing already holds
      # suite size by EQUALITY in CI (`BASELINE_RUNS`, compared with `!=`
      # and not `-ge`, in the `gate` job), so adding a test turns CI red until
      # that number is raised in the same commit. This floor is a lower bound and
      # the ratchet is owned there; a soft margin would only have added a second,
      # weaker place for the number to rot.
      #
      # RAISED 763 -> 950 IN THE MERGE. The comment this replaces said to raise
      # it to 851 when billing-09-race landed, and to *"measure the merge result
      # rather than trusting that arithmetic."* Measured: **950 runs / 2724
      # assertions / 0 failures / 0 errors / 0 skips**, which is exactly what CI's
      # `BASELINE_RUNS` already said after billing-13. The packet's estimate was
      # 99 runs short because two more packets landed between its measurement and
      # this merge.
      #
      # **What the stale floor actually did, measured rather than argued.** With
      # the floor at 763 on a tree running 950, the declaration's own self-test
      # case #2 — `rm test/integration/health_test.rb` — reported **exit 0**. The
      # packet had designed that exact deletion to be caught by *both* numeric
      # floors, at 758/763 and 92/93. It was caught zero times, because the
      # deletion moved the run count to 945, which is 182 above the floor.
      #
      # RAISED 950 -> 998, IN THE OBSERVABILITY PACKET, measured. 998 runs /
      # 2842 assertions / 0 failures / 0 errors / 0 skips, and the whole of that
      # difference is the 48 tests and 118 assertions in `test/observability/` —
      # the same two numbers `BASELINE_RUNS`/`BASELINE_ASSERTIONS` in CI moved to
      # in this commit, counted the same way and in the same run. One floor, not
      # two: a declaration and a workflow holding different numbers for the same
      # suite is two answers to one question.
      #
      # This is the fifth instance in this file of the shape D13, D15 and D16
      # describe, and the most quotable one: **the floor was not too strict, it
      # was too loose, and nothing said so.** A floor never blocks a merge, so
      # this one rotted silently through two landings while the declaration read
      # as if it were current — the packet had written the merge obligation into
      # a comment, and the comment is prose, and prose is not compared against
      # anything. The self-test caught it, which is the entire argument for
      # shipping the self-test with the declaration.
      #
      # RAISED 998 -> 1077 IN billing-21, measured, in the same commit as CI's
      # `BASELINE_RUNS` and itemised in `ci.yml` where the two numbers live.
      # **This delta is not all new tests**: +66 in `test/authentication/`, and
      # **-3** in `test/requests/v1/customers_test.rb`, because the tests
      # asserting an account's listing could hold several rows cannot exist when
      # it holds at most one. A floor that only ever rises would have accepted a
      # suite that quietly lost the assertions saying `/v1` was open — and that
      # is the direction this packet moved, so a decrease here is the honest
      # reading rather than a suspicious one.
      #
      # 1077 -> 1134 was a floor raised by a packet whose measurement is not
      # this one's to narrate; what matters is what this one measured: the
      # floor's parent packet recorded **1175 runs / 3747 assertions** as CI's
      # number (`ci.yml`'s `BASELINE_RUNS`), so the truth had been 1175 while
      # this floor said 1134 — a silently-carried 41-run gap, the fourth
      # instance in this file of a floor nobody re-measured. The fake-client
      # packet measures **1176 runs / 3756 assertions / 0 failures / 0 errors /
      # 0 skips**: the 16 checkout specs were retargeted against
      # `Processor::FakeClient` rather than `pay`'s `FakeProcessor`, one
      # request-level spec was added (the trial guard, proved at the request
      # rather than at the answer — see the packet's report), and +4 assertions
      # came with it. So the floor moves 1134 -> 1176 and closes the gap.
      # The gap existed because a floor never blocks a merge — the reason the
      # floor and `BASELINE_RUNS` are raised in the same commit.
      #
      # 1176 -> 1188 is the checkout door's twelve request specs, measured
      # **1188 runs / 3807 assertions / 0 failures / 0 errors / 0 skips**.
      #
      # 1188 -> 1198 is the upcoming invoice: ten request specs for the route and
      # four for the fourth client method, plus the fake's price book. Measured
      # **1198 runs / 3853 assertions**.
      #
      # 1198 -> 1209 is the charges index (4) and the portal (7): the index
      # supersedes the comment the receipts packet left on `show`, and the portal
      # carries the two open-redirect refusals, the unknown-customer 422 and the
      # 503. Measured **1209 runs / 3900 assertions**.
      #
      # 1209 -> 1219 is P5: the chart-and-publish assertions (8) and the
      # first-charge drill (2). Measured **1219 runs / 3968 assertions**.
      #
      # 1219 -> 1227 is the live-Stripe packet: cassettes and replay for the
      # five client requests (5) and both live invoice shapes (3). Measured
      # **1227 runs / 4001 assertions** with `STRIPE_API_KEY` unset.
      # 1227 -> **1259 runs / 4191 assertions**, measured with `CI=true bundle
      # exec rails test` on the merged tree, and the raise is also a repair: this
      # floor and CI's `BASELINE_RUNS` had both gone stale by 32 runs (the
      # Postgres-boundary packet's isolation suite, the app-role packet's two
      # tests, and ten runs a packet before them), which is the "every packet
      # that lands invalidates a floor silently" shape the paragraph above
      # records — measured on master before the raise:
      #
      #   $ CI=true bundle exec rails test
      #   1257 runs, 4177 assertions, 0 failures, 0 errors, 0 skips
      minimum: 1259
    # ---------------------------------------------------------------------
    # The gate reached its own last line. With the five above it, the step
    # markers bracket the run: the toolchain was pinned, the bundle resolved, a
    # database was prepared, the linter ran, the suite ran to completion, and the
    # gate finished. It is what distinguishes "the suite printed its summary"
    # from "the gate completed", and it is the last line `bin/prime` can reach.
    - id: ok
      match: '^== prime ok \(rails [A-Za-z]+ [0-9]+\.[0-9]+\.[0-9]+\)$'
    #
    # NOT ASSERTED HERE, BECAUSE THE FORMAT CANNOT EXPRESS IT, and this is the
    # honest limit of the file. Three things are checked here that are not
    # checked by anything below:
    #
    #   * THE EAGER-LOAD TIER. `config/environments/test.rb` sets
    #     `config.eager_load = ENV["CI"].present?`. GitHub Actions always exports
    #     `CI`, so the suite eager-loads the whole application in CI and not
    #     locally — "the application loads" is checked in CI by an implicit
    #     convention, and a convention nobody asserts is a convention that stops
    #     happening. `bin/prime` does not set `CI`, so a developer's run does not
    #     exercise it. CI asserts it explicitly (eager_load true, and
    #     `eager_load!` having loaded all 38 `app/**/*.rb`). Variable: `CI`.
    #   * THE TIER COUNTS. CI runs the contract tier (26), the webhook tier (138)
    #     and the money-path coverage gate (5) separately and asserts each. The
    #     whole-suite count above is the sum of them, so a relocation between
    #     directories is invisible here by design. Those are separate commands,
    #     not steps of `bin/prime`.
    #   * THE TREE DID NOT MOVE. CI runs `git diff --exit-code` over the whole
    #     tracked tree after the gate, so a prime that wrote `db/schema.rb` is
    #     caught. Nothing in this declaration can see that.
    #
    # All three are named rather than assumed covered, because the alternative
    # is a declaration that implies CI and the local gate verify the same set.
    # They are not, and the difference is the finding.

external:
  # FALSE, and each of the four entries below was DEMONSTRATED on this machine
  # rather than reasoned about — quoted, not predicted, because a requirement
  # you cannot describe the failure of is worse than no requirement. The
  # demonstrated symptom is reproduced in `unmet`.
  selfContained: false
  requirements:
    - kind: toolchain
      # The pin in three files: `mise.toml`'s `[tools]`, `.ruby-version`, and
      # the Dockerfile's `ARG RUBY_VERSION`. AGENTS.md says those three must
      # agree in one commit, and the `pins` CI job is that sentence as a build
      # failure. This is the third reader, and the one that runs before a gem is
      # touched.
      name: >-
        ruby 4.0.1 and bundler 4.0.18, pinned in mise.toml, .ruby-version and
        the Dockerfile. Without them bin/prime exits 127 before running a test.
      satisfy:
        # A bare name, so this is a claim about THIS MACHINE; the checker
        # deliberately does not run it, reports `gate.requirement-unproven` as a
        # WARNING, and leaves the exit code alone. That severity is correct —
        # the alternative is a checker that is red on a laptop and green on CI.
        command: [mise, install]
        # Demonstrated, quoted from the run this file was written from: with
        # macOS's /usr/bin/ruby first on PATH, `bin/prime` exits 127 and the
        # first line names both numbers.
        unmet: >-
          bin/prime: .ruby-version pins ruby 4.0.1; the ruby on PATH answers
          '2.6.10' (exit 127)
    - kind: database
      # PostgreSQL, and THREE servers rather than one — which is the reason the
      # tag is named as "the image docker-compose.yml pins" and not written out
      # here. Measured on this host: `bin/prime` connected to a Homebrew
      # PostgreSQL 18.4 over the local socket, while Docker ran the compose
      # image on 5432 as well, and CI runs the tag `ci.yml` pins. So a
      # developer, a compose stack and a CI runner can each be answering on a
      # different major at the same time, and a tag copied into a comment here
      # is a third copy to go stale the moment one of the other two moves —
      # which is why this names the file instead of the string.
      #
      # Nothing in the suite depends on the major, and that is a property of the
      # code rather than of the pin: every ordered read is `order(created_at:,
      # id:)` — a timestamptz and a uuid — and no spec sorts a text column, so
      # the alpine build's `C` default collation (the one thing the smaller
      # image really changes) cannot reach a result. A suite green on 18.4 has
      # still not been shown green on the image, and that gap is recorded in
      # REPORT-billing-10-gate rather than papered over.
      #
      # The two credential paths differ, and both were read from the files
      # rather than assumed: `docker-compose.yml` sets
      # `POSTGRES_HOST_AUTH_METHOD=trust`, so the local server needs no password
      # at all, while CI's service container takes a `POSTGRES_USER` /
      # `POSTGRES_PASSWORD` pair that is a throwaway credential for a container
      # that lives for the length of one job.
      #
      # The database NAME is per checkout, derived from the checkout's directory
      # by `config/database.yml`, and CI overrides it with a per-run
      # `DATABASE_URL`. So "a database" is not one fixed fact and the `unmet`
      # below deliberately quotes an error rather than a URL.
      name: >-
        a PostgreSQL server for this checkout's own test database: docker
        compose up -d (the image docker-compose.yml pins) locally, or
        DATABASE_URL in CI. The two paths differ; see the comment above.
      satisfy:
        # Repository-relative, so the checker verifies the file is here: a
        # requirement satisfied by a command that does not exist is a pointer to
        # a page that does not exist, which is the thing this field replaced.
        #
        # `bin/rails db:prepare` and NOT `bin/prime --fast`, which is the shape
        # cafaye-rb uses for the same field. That was measured rather than
        # copied: on this commit `bin/prime --fast` runs `bundle install` and
        # then EXITS 0 WITHOUT TOUCHING THE DATABASE, while its own `--help`
        # text says "bundle and the database only" and `mise.toml` describes
        # `[tasks.setup]` as "Dependencies and database only". `db:prepare` is
        # the smallest argv in this repository that actually makes the database
        # exist, so it is the one declared here. The help-text mismatch is
        # reported in REPORT-billing-10-gate and is not this packet's to fix.
        command: [bin/rails, db:prepare]
        # Demonstrated, with DATABASE_URL pointed at a port nothing is listening
        # on (59997). Quoted from the run; no URL of a real database appears.
        unmet: >-
          ActiveRecord::DatabaseConnectionError: There is an issue connecting
          with your hostname: 127.0.0.1 / PG::ConnectionBad: connection to
          server at "127.0.0.1", port 59997 failed: Connection refused (exit 1)
    - kind: filesystem
      # THE ONE THAT MAKES THIS GATE PROVE ANYTHING, and the one nothing in
      # `bin/prime` can notice on its own. `test/contract/` and
      # `test/integration/subscription_delivery_test.rb` read core's real
      # schemas and catalog rather than restating them, and SKIP when they
      # cannot. Measured, same commit, same command, twice:
      #
      #     core readable    763 runs, 2100 assertions, 0 failures, 0 errors,  0 skips
      #     core unreadable  763 runs, 1757 assertions, 0 failures, 0 errors, 20 skips
      #
      # Same run count, same exit code, 343 assertions of contract checking not
      # done. That is the `suite` proof's reason for pinning `0 skips`; this
      # entry is the remedy with a name on it.
      #
      # The default is `Rails.root.join("..", "core")`, which is what a developer
      # with the cafaye repositories side by side gets. A standalone checkout —
      # and a CI runner with one `actions/checkout` and no sibling — has no such
      # directory, which is why CI sets `CORE_PATH` on the job and checks core
      # out to `$RUNNER_TEMP/core` rather than beside the worktree.
      name: >-
        a cafaye/core checkout at ../core beside this worktree, or CORE_PATH
        pointing at one. Without it the contract tier skips 20 tests and the
        gate is green having checked nothing.
      satisfy:
        # A bare `git` and a bare `clone` argument, so the checker treats this as
        # a claim about this machine and does not verify a path. cafaye/core is
        # public, so no credential is involved; the URL is a public https remote
        # and carries nothing secret. `../core` is a clone destination, not a
        # path this declaration asserts the existence of.
        command: [git, clone, https://github.com/cafaye/core.git, ../core]
        # Demonstrated, quoted from the run above. The `skip` count is the whole
        # symptom: 20 skips is 4 from the delivery test and 16 from the envelope
        # contract, and the summary line's exit status is 0.
        unmet: >-
          763 runs, 1757 assertions, 0 failures, 0 errors, 20 skips — and
          bin/prime still prints "prime ok" and exits 0
    - kind: network
      # ONCE, ON A COLD CHECKOUT ONLY, and that qualifier is a measurement
      # rather than a hedge. A warm gate measured 163s with 106 gems already
      # installed and never opened a socket; `bundle install` resolves entirely
      # from the local gem home. Saying "network" flatly would over-claim a
      # dependency this gate does not always have, which is the same error as
      # under-claiming one.
      name: >-
        rubygems.org, once, on a cold checkout — the 106 gems in Gemfile.lock,
        including the `pg` and `image_processing` native extensions. A warm
        gate needs no network.
      satisfy:
        # A bare name, for the same reason as the toolchain above, and the
        # honest spelling is the command `bin/prime` itself runs, so satisfying
        # this requirement and running the gate are the same act on a cold
        # checkout.
        command: [bundle, install]
        # DEMONSTRATED, and this is the one requirement whose failure was
        # reproduced rather than quoted: a throwaway Gemfile requiring a gem not
        # in this bundle, with the proxy pointed at a closed port, exits 7 with
        # the lines below. Bundler's own code for an unreachable index.
        unmet: >-
          Could not reach host index.rubygems.org. Check your network connection
          and try again. / Could not find gem '<name>' in rubygems repository
          https://rubygems.org/ (exit 7)
  # NOT required, and named here so nobody goes looking for them:
  #
  #   * no credential, of any kind. The suite is hermetic: the webhook signing
  #     secret is generated per run from the constant
  #     `StripeWebhookHelpers::WEBHOOK_SECRET` in `test/test_helper.rb` — a
  #     credential for nothing, checked in on purpose so the digest is computed
  #     over real bytes rather than a stub — and `Processor::StripeClient`
  #     refuses to build a request without `STRIPE_API_KEY`, which the suite
  #     never sets. Verified by search, not by reading the comment: there is no
  #     `Net::HTTP`, `Faraday`, `open-uri`, `HTTParty`, `RestClient` or
  #     `TCPSocket` anywhere under `app/`, `test/` or `lib/`, and the specs
  #     drive `FakeStripeAPI`, an in-process stand-in. CI's `gate` job asserts
  #     `STRIPE_API_KEY` and `STRIPE_WEBHOOK_SECRET` are absent from its own
  #     environment, and the `pins` job fails the build if the workflow ever
  #     gains a `secrets.` reference, a Stripe key, a `whsec_`, a master key or
  #     a PEM header. Nothing in the proofs above could print a token, a key or
  #     a JWT, which is a property worth having: the `database` proof matches a
  #     banner precisely so that a `DATABASE_URL` with a password in it is not
  #     something this file can echo.
  #   * no service other than PostgreSQL, no browser, no fixed port, and no
  #     filesystem path outside the repository. `tmp/` is written inside the tree
  #     and gitignored.

ci:
  # The workflow, and the argv it runs. Read TEXTUALLY against the workflow's
  # `run:` bodies, so a workflow that stops calling the gate becomes
  # `gate.ci-disagrees` rather than a quiet divergence — which is the check whose
  # entire job is noticing that.
  workflow: .github/workflows/ci.yml
  # `bin/prime`, verbatim and unmodified, and verified by reading the workflow
  # rather than the job's name: the `gate` job's step body is
  #   bin/prime 2>&1 | tee "$log" || status=$?
  # There is no CI-only variant of the gate to drift from, which is this
  # repository's own stated rule — "a shared workflow that retyped its four
  # steps would be a second gate, and a second gate is a second thing to be
  # wrong."
  #
  # WHAT THIS BLOCK DELIBERATELY DOES NOT CLAIM, because `check_ci` reads one
  # workflow's `run:` bodies and nothing else. The `ruby (kit)` job calls kit's
  # reusable workflow, which runs install, lint, test and a `rake coverage` this
  # repository does not have; two of its four steps are expected red and are
  # absorbed by `continue-on-error: true` on the job, with the reason written out
  # in the workflow and the condition for retiring it recorded there. The
  # `security` job runs brakeman and bundler-audit, and the `pins` job runs no
  # toolchain at all. None of those three is part of `bin/prime`, and none of
  # them is visible to this block. The residue is the finding, and it is written
  # out in REPORT-billing-10-gate.
  invokes: [bin/prime]
