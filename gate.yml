version: 1
name: billing

gate:
  command: [bin/prime]
  miseTask: prime
  entrypoint: bin/prime
  timeoutSeconds: 1800
  proof:
    - id: toolchain
      match: '^== ruby [0-9]+\.[0-9]+\.[0-9]+ \(pinned by \.ruby-version\)$'
    - id: bundle
      match: '^== bundle install$'
    - id: database
      match: '^== rails db:prepare$'
    - id: lint
      match: '^([0-9]+) files inspected, no offenses detected$'
      minimum: 158
    - id: suite
      match: '^([0-9]+) runs, [0-9]+ assertions, 0 failures, 0 errors, 0 skips$'
      minimum: 1259
    - id: ok
      match: '^== prime ok \(rails [A-Za-z]+ [0-9]+\.[0-9]+\.[0-9]+\)$'

external:
  selfContained: false
  requirements:
    - kind: toolchain
      name: >-
        ruby 4.0.1 and bundler 4.0.18, pinned in mise.toml, .ruby-version and
        the Dockerfile. Without them bin/prime exits 127 before running a test.
      satisfy:
        command: [mise, install]
        unmet: >-
          bin/prime: .ruby-version pins ruby 4.0.1; the ruby on PATH answers
          '2.6.10' (exit 127)
    - kind: database
      name: >-
        a PostgreSQL server for this checkout's own test database: docker
        compose up -d (the image docker-compose.yml pins) locally, or
        DATABASE_URL in CI. The two paths differ; see the comment above.
      satisfy:
        command: [bin/rails, db:prepare]
        unmet: >-
          ActiveRecord::DatabaseConnectionError: There is an issue connecting
          with your hostname: 127.0.0.1 / PG::ConnectionBad: connection to
          server at "127.0.0.1", port 59997 failed: Connection refused (exit 1)
    - kind: filesystem
      name: >-
        a anywaye/core checkout at ../core beside this worktree, or CORE_PATH
        pointing at one. Without it the contract tier skips 20 tests and the
        gate is green having checked nothing.
      satisfy:
        command: [git, clone, https://github.com/anywaye/core.git, ../core]
        unmet: >-
          763 runs, 1757 assertions, 0 failures, 0 errors, 20 skips — and
          bin/prime still prints "prime ok" and exits 0
    - kind: network
      name: >-
        rubygems.org, once, on a cold checkout — the 106 gems in Gemfile.lock,
        including the `pg` and `image_processing` native extensions. A warm
        gate needs no network.
      satisfy:
        command: [bundle, install]
        unmet: >-
          Could not reach host index.rubygems.org. Check your network connection
          and try again. / Could not find gem '<name>' in rubygems repository
          https://rubygems.org/ (exit 7)

ci:
  workflow: ci/pipeline.sh
  invokes: [bin/prime]
