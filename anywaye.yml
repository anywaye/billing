# anywaye.yml — the anywaye project manifest for billing.
#
# Conforms to core's frozen schema
# (anywaye/core: schemas/anywaye.manifest.schema.json). Specs are manager-owned:
# a worker records the shape it is being built against and marks what it cannot
# decide. See AGENTS.md.
#
# > `exposes` names the eight events this build publishes, in the three-segment
# > form core v0.2 made mandatory (D1). Three come from the models and five from
# > the Stripe webhook mapping.
# >
# > The subscription events are *written by the lifecycle, from the state the
# > delivery produced*, not mapped from the processor's event type. That is not a
# > detail: an `updated` delivery that turns out to be a cancellation publishes a
# > cancellation, and a `deleted` delivery that arrived before its `created` — which
# > Stripe's lack of ordering guarantees is entirely possible — publishes a
# > cancellation for a row it created, and refuses the creation that follows. The
# > mapping is therefore derived from `(did the row exist, what was it, what is it
# > now)`, and the whole grid of legal and illegal transitions is one table in
# > `Subscriptions::StateMachine`.
# >
# > Two cross-repo obligations follow, and neither can be discharged from this
# > worktree because core is read-only here:
# >
# > * `billing.plan.updated` does not have a catalog row in core's
# >   `docs/event-naming.md`, and `billing.subscription.updated` **is** in core's
# >   catalog but under the name a plan change might suggest it should not have.
# >   core's catalog row for `billing.subscription.updated` reads "Plan, quantity,
# >   or interval changes" and the row for `billing.subscription.canceled` reads
# >   "Cancellation takes effect, not when requested" — which is precisely the rule
# >   this build implements, so the vocabulary core already fixes is the vocabulary
# >   used here. `billing.subscription.changed` is **not** in core's action
# >   vocabulary and **not** in its catalog, so declaring it here would be a
# >   contract drift the manager has not agreed to and a consumer would have
# >   nothing to validate against. The one-line change, if the manager disagrees,
# >   is `Subscriptions::Lifecycle::UPDATED_EVENT`.
# > * core-03 (**D10**) rewrote
# >   `schemas/events/billing/subscription/started.schema.json`, and with it the
# >   id-format debt this file used to carry. That schema no longer declares a
# >   `pattern` for `subscription_id` and no longer names `plan_id` or
# >   `account_id` at all, so `PENDING_ID_PATTERNS` in the contract spec is empty:
# >   a field core does not constrain cannot have an unclosed gap against it. The
# >   same packet shipped a payload schema for all eight of this service's types,
# >   so `NO_PAYLOAD_SCHEMA_YET` is empty too, and billing owes core no payload
# >   schema at all.
# > * **The same rewrite opened a larger gap, and it is a spec question rather
# >   than a bug in a payload.** core's D10 gives the reason it was rewritten as
# >   "billing has no subscriptions table and cannot invent ids it does not
# >   have". That was true of billing-03b, which is what core-03 read. billing-04
# >   added the table and moved the three subscription events onto billing's own
# >   ids: `subscription_id` is `Subscription#id`, with `plan_id`, `account_id`,
# >   `currency`, `started_at` and `processor_subscription_id` beside it and no
# >   `kind`. core's `started`, `updated` and `canceled` schemas instead describe
# >   the processor-normalised payload billing-03b emitted, and are closed with
# >   `additionalProperties: false`, so a payload that satisfies them drops the
# >   ids a consumer needs. core's own D10 anticipates exactly this — "when
# >   billing grows a subscriptions table, the shape moves again … that is a
# >   second breaking change" — and that change is core's to make, because core
# >   is read-only from a service worktree. The difference is therefore recorded
# >   in `PENDING_PAYLOAD_ALIGNMENT` and asserted in both directions rather than
# >   paid for by editing a published payload: emitting one nobody has agreed to,
# >   and dropping fields a consumer needs, are both the spec changing without a
# >   decision. See the DECISION NEEDED below.
# > * `billing.plan.created` and `billing.plan.updated` are closed with
# >   `additionalProperties: false` and do not name `entitlements`, which
# >   billing-04 added to `Plan#as_json`. core's plan schema is missing a field
# >   this publisher sends; recorded, not worked around, because removing it from
# >   the payload is a contract change this worktree does not get to make, and the
# >   plan payload is the shape an HTTP response uses, so it cannot be quietly
# >   narrowed here either.
# > * **core-w46 (`b8ae8fb`) closed the recipient-fact gap from the core side.**
# >   billing-event-payloads-01 added `email` to the two payment types and `email`
# >   plus `plan_name` to the three subscription types, and both were recorded
# >   here the day they were added. core has since declared them the way billing
# >   already sends them, so those entries are **not** in
# >   `PENDING_PAYLOAD_ALIGNMENT` any more and the two payment events match
# >   core's schemas exactly. Nothing was removed from a payload: the fields are
# >   still on the wire and `email` is still resolved by one indexed lookup, which
# >   is the PII position this service took deliberately. The table is asserted
# >   as a set in both directions, so a gap closing from the core side is the
# >   mechanism working, and it is the reason this bullet exists — an entry left
# >   sitting beside a closed one describes a disagreement that no longer exists.
# > * **The first checkout's delivery order re-opened one field on 2026-10-16**,
# >   measured on the local whole stack. `invoice.paid` arrives before
# >   `customer.subscription.created`, and the charge recorder resolved the
# >   customer by the processor's id alone — which a customer created through
# >   `/v1` does not have until a subscription event names one. The invoice's
# >   metadata carries the anywaye link, so the two payment events now emit
# >   `anywaye_customer_id`: the field a consumer needs (the same argument the
# >   subscription payloads already won), and the field without which a real
# >   payment recorded no receipt. core's payment schemas are closed and do not
# >   declare it, so the divergence is back in `PENDING_PAYLOAD_ALIGNMENT` —
# >   recorded rather than worked around, and the declaration is core's to make.
# >
# > Four decisions are recorded here. Two change what this service *is*, and two
# > are questions core owns that this worktree cannot answer.
# >
# > **DECISION NEEDED (billing-05, on the subscription payload).** core's D10
# > described billing-03b. billing-04 answered the question D10 asked — the
# > subscriptions table landed — and the answer moves the payload. core now owes a
# > second breaking change: either the processor's ids sit alongside billing's, or
# > they are replaced, and which of those is a consumer's problem rather than
# > billing's to settle from a read-only reference. Until it is made, the three
# > subscription events are **published in a shape core's schema rejects**, and
# > `test/contract/` says so out loud rather than absorbing it. The action item is
# > one decision in `core/DECISIONS.md` and one file rewrite; what it needs from
# > billing is a payload change or nothing at all.
# >
# > **DECISION NEEDED (billing-event-payloads-01, on the recipient fact).** The
# > five money events now carry the customer's billing email, and the three
# > subscription events carry the plan's name beside its id. **core has since
# > declared both** (`b8ae8fb`, core-w46, "billing's money events: declare the
# > recipient and the plan name"), the way billing already sends them: `email`
# > OPTIONAL and NEVER NULL, because it is merged only when `customers.email` is
# > present, and `plan_name` REQUIRED and non-empty, because it is written
# > unconditionally from a `null: false` column. So this gap is **closed from the
# > core side** and the two entries that recorded it are gone from
# > `PENDING_PAYLOAD_ALIGNMENT` — nothing was removed from the payload, and the
# > PII direction of travel is unchanged. What remains of the recorded gap is the
# > subscription shape core's D10 described, above, and `entitlements` on the two
# > plan events.
# >
# > **The two payment events matched core's schemas exactly from core-w46, and
# > re-opened one field on 2026-10-16** — see the delivery-order bullet above.
# > `billing.payment.succeeded` and `billing.payment.failed` declare `email` in
# > core and emit it, and their D11 `oneOf` pair — invoice-backed,
# > Checkout-backed — is satisfied by the two shapes the normalizers produce.
# > What the local whole-stack walk added is `anywaye_customer_id`, without which
# > a first checkout's real payment recorded no receipt. It is back in the
# > recorded table, and the table is asserted as a set in both directions, so a
# > future divergence fails by name rather than sitting beside a closed one.
# >
# > **Why the fields are here anyway, and why now.** The fleet's consumer design
# > is that a consumer acts on the envelope or refuses, and never looks up
# > (REPORT-courier-consumer-invite-01 §2.6): courier has no billing client
# > and no billing tables, so an event with no address on it is an event that is
# > dropped. Every money event was in that state. The parallel fix already
# > exists on the identity side — `identity.session.revoked` and
# > `identity.user.created` carry a top-level `email` for exactly this reason —
# > and this packet gives billing's events the same field under the same name.
# >
# > **What it needed from core was one schema update per type, and it got them.**
# > That action item is discharged: core-w46 (`b8ae8fb`) declared `email` and
# > `plan_name` on all five money events and all three subscription events. The
# > alternative this paragraph once held open — a decision that a recipient field
# > is not part of the published contract — was not taken, so the fields stay in
# > the payload builders and are now part of the contract rather than beside it.
# > Nothing further is owed by billing here.
# >
# > **DECISION NEEDED (billing-04, on the subject).** billing-03 recorded a
# > decision: the envelope's subject had to be the processor's own id, because
# > there was no subscriptions table; it recommended landing one "before the first
# > real customer" and said flipping it was one line. This is that line, and the
# > flip is now done — a subscription event's subject is billing's own
# > `Subscription#id`. A consumer can now join `started`, `updated` and `canceled`
# > on one key with no lookup table, which was the whole point. Payment events keep
# > the processor's id as their subject, because an invoice references a
# > subscription rather than being one and the join key is the processor's
# > subscription id in the payload.
# >
# > (core's D10 still reads a subscription payload's `subscription_id` as the
# > processor's id and equal to the subject. Under billing-04 both are billing's
# > own id instead — the same invariant on a different value. See the decision
# > above.)
# >
# > **DECISION NEEDED (billing-04, on the outbound direction).** billing-03b's
# > claim was that "this service receives, it does not call out to Stripe". That is
# > no longer true, and a lifecycle cannot work without it: a subscription is
# > bought through a Stripe Checkout Session, cancelled by asking Stripe to cancel,
# > and moved between plans by asking Stripe to move it. The claim now reads "this
# > service makes exactly three kinds of request to Stripe and every one of them is
# > a `Processor::StripeClient` method", which is checkable — there is no other
# > `Stripe::` call in the repository — rather than checkable only by reading. No
# > new dependency: the `stripe` gem was already here for
# > `Stripe::Webhook.construct_event`.
# >
# > `consumes` is empty. Nothing in this build reacts to an event.
# > `billing.subscription.started` and `billing.subscription.canceled` are how
# > courier hears about a signup and a cancellation, which is the whole of that
# > packet's transactional mail: billing publishes and courier delivers, and
# > nothing is sent from a request. There is no entry here for that — `consumes`
# > is what *this* service listens to, and it listens to nothing.
# >
# > `billing.subscription.past_due` is in core's catalog and is *not* published
# > here: this build reports arrears as a change to the subscription's status in
# > `billing.subscription.updated`, and whether a failed charge is one event or two
# > is a question about what a consumer does with them rather than about the
# > charge, which `billing.payment.failed` already states. A manager who wants the
# > second type needs a row agreed in core first, and the mapping is then one line
# > in `Subscriptions::Lifecycle`.
# >
# > `dependencies` is **no longer empty**, and the change is real rather than
# > bookkeeping: billing-21 made this service fetch identity's JWKS over HTTPS on
# > a five-minute cache, so identity is a service this service now depends on in
# > the way the manifest means. It is declared `required: true`, because the
# > failure mode without it is that `/v1` answers **503 to every caller** — this
# > service fails closed rather than degrading open, which is the correct
# > direction and still means the dependency is not soft. A `required: false`
# > would tell `caf` that billing is fine without identity, and it is not.
# > `billing.subscription.past_due` and the rest of the argument above are
# > unchanged.
# >
# > Three decisions are recorded here, and the first two change what this service
# > *is* while the third is a question two repositories own and neither can
# > settle alone.
# >
# > **DECISION NEEDED (billing-21, on the tenancy claim). The two repositories
# > disagree about the shape of "which account", and billing refuses the token
# > rather than guessing.** core's `docs/openapi-conventions.md` asks for
# > `account_id`, singular. **identity does not issue one on a user token** — it
# > issues `accounts`, an array of `{account_id, name, slug, role, personal}`,
# > on the `accounts` scope, and its own `internal/oidc/profiles.go` says why: "a
# > user of a anywaye product is a member of a personal account and usually of
# > several team accounts, and a token carrying one of them would be wrong for all
# > the others." Both sides are self-consistent and they are not compatible.
# >
# > **The consequence is stated rather than papered over: until this is decided,
# > a token identity actually issues to a user is REFUSED and `/v1` answers 401.**
# > The available fixes all cost something, and the one that costs least in code
# > is the one that must not be taken:
# >
# >   * `accounts[0]`, or the `personal: true` entry, or "whichever the client
# >     meant to say" — **this is the cross-tenant bug billing-12 spent a packet
# >     finding.** It produces a tenancy key nobody chose, so a user in a personal
# >     account and four team accounts has every request answered against
# >     whichever entry happened to be first. billing refuses instead.
# >   * identity adds a singular `account_id` — but which account is the right one
# >     to name is precisely the question that is open, so this cannot be done in
# >     identity either without a rule.
# >   * core rules that the tenancy claim is an array, and every service scopes by
# >     "the account this request names, verified to be one the caller holds" —
# >     which needs a per-request account selector, and this service's own design
# >     forbids the account being a parameter.
# >   * the gateway resolves the account and forwards a single `account_id`,
# >     which is what `guard` is for. **Most likely answer**, and it is a fleet
# >     decision rather than either repository's.
# >
# > `test/authentication/token_verifier_test.rb` pins the refusal in the shape
# > identity actually issues, and the refusal message names the disagreement so the
# > operator reading the log knows it is a claim mismatch rather than a malformed
# > token.
# >
# > **KNOWN GAP (billing-21, `tenancy.declaration-missing`).** core's fleet checker
# > reads a service's own account-isolation declaration out of `tenancy.yml`
# > (`schemas/tenant-isolation.schema.json`, worked example in core's
# > `docs/tenancy.md`) and reports billing as undeclared:
# >
# > ```
# > $ python3 ../core/harness/tenancy_check.py .
# > FAIL tenancy.declaration-missing: tenancy.yml is not in <repo>
# > ```
# >
# > **This packet did not write one, and the reason is worth stating rather than
# > leaving as an omission.** billing now has the *material* — 14 account-scoped
# > routes, 35 account-scoped data accesses, and negative tests asserting
# > **absence** rather than refusal — enumerated in
# > `test/contract/tenant_isolation_matrix_test.rb` and `test/tenant/`. What it does
# > not have is core's *format*, which pins each entry point to a **line number** in
# > the file that asserts it. A declaration citing line numbers is a second thing to
# > renumber on every edit, and the argument core's own checker makes — "a grep
# > reporting darkroom has no routes is worse than no grep" — applies with equal
# > force to a hand-maintained line index. Writing it deliberately, with core's
# > schema in hand, is a small packet of its own and the next thing this service
# > should do after this one.
# >
# > **DECISION NEEDED (billing-21, on the plan catalogue's writes).** `/v1` is now
# > authenticated and every customer and subscription query is scoped by the
# > token's account, so cross-tenant access is refused. **Plans are the exception
# > and it is deliberate**: a plan is the platform's catalogue — a price any
# > account can subscribe to — so the four plan routes are authenticated and not
# > account-scoped. The consequence is that **any authenticated account can
# > create, change or delete a plan**, because nothing checks a capability for it.
# > No scope check was invented: billing has no capability vocabulary in this
# > build's `consumes`, and a scope string nothing in the fleet grants is a lock
# > that locks everybody out. `Principal#scope_set` parses the token's `scope`
# > claim and nothing reads it yet. **Deciding what a catalogue write is for is a
# > manager's call** — either the catalogue is operator-only and something needs
# > to say so, or it is a write any account may make and the current behaviour is
# > already the answer.
# >
# > **DECISION NEEDED (billing-21, on the version prefix).** `openapi/v1.yaml` is
# > at **2.0.0** and the `/v1` prefix is deliberately **unchanged**, because the
# > breaking change (every operation now requires a bearer token) cannot be
# > mitigated the way core's rule describes. Core's convention is that a breaking
# > change gets a new prefix *beside* the old one so the old contract keeps being
# > served — and here "keep serving `/v1` for compatibility" is "keep the
# > vulnerability", since the old `/v1` answers every request without a token. A
# > second prefix over one open door is one open door. The major version plus this
# > note is the signal instead, and `info.version` is the field every generated
# > client reads. **The alternative is a real answer and is not being taken
# > silently**: `/v2` may be served *instead of* `/v1` — never both — the moment a
# > gateway is in front that knows which prefix a caller is entitled to, which
# > this repository cannot arrange for itself.
name: billing
description: Plans, subscriptions, prepaid credit, usage metering, webhooks in.
language: ruby
# The last released core spec is 0.2.0 and this pins to it honestly. core-03's D10
# is marked **Breaking** and is still in core's `[Unreleased]`, so there is no
# 0.3.0 to pin to yet and writing one here would be inventing a release. The day
# core tags it this becomes `^0.3.0` — and so does every other service in the
# fleet, at the same time, because `^0.2.0` means `>=0.2.0 <0.3.0`: a service
# whose CI resolves core would be resolving a *different* core from the one this
# contract test reads off disk. Raised rather than moved, because the pin is the
# manager's to cut.
core: ^0.2.0

exposes:
  api: openapi/v1.yaml
  events:
    # Three segments, prefixed with this service's own name, which is what core's
    # manifest conventions require of a long-form type. `customer.created` in
    # core's catalog is the two-segment form and is a *different* type: the
    # catalog row has to be renamed, not reused.
    #
    # The list is the union of what the models emit and what the subscription
    # lifecycle emits, and it is asserted to be the same list as
    # `OutboxEvent::TYPES` in `test/contract/`. Nothing else is here on purpose:
    # core's catalog lists more for billing (subscription.past_due,
    # payment.refunded, invoice.created, usage.recorded), and naming a type this
    # build never publishes would tell `caf` to wire a consumer for a message
    # that does not exist.
    - billing.customer.created
    - billing.payment.failed
    - billing.payment.succeeded
    - billing.plan.created
    - billing.plan.updated
    - billing.subscription.canceled
    - billing.subscription.started
    - billing.subscription.updated

# billing subscribes to no events yet. The customers and subscriptions that
# would react to identity's user and account events are later packets, and
# declaring an event this build does not handle would tell `caf` to wire a
# consumer that has nothing to do.
consumes: []

# identity, and it is not bookkeeping. billing-21 made `/v1` verify a JWT against
# identity's published JWKS, which is an outbound call to another anywaye service
# and therefore the dependency the manifest means. `required: true` because the
# failure mode without it is a 503 on every `/v1` request: this service fails
# closed rather than degrading open, which is the right direction and still does
# not make the dependency soft.
#
# Stripe is deliberately absent: it is a vendor, not a anywaye service, and belongs
# in the Gemfile rather than here (convention rule 4).
dependencies:
  - name: identity
    required: true

env:
  - name: PORT
    required: false
    secret: false
    description: "Listen port."
  - name: DATABASE_URL
    required: true
    secret: true
    dev_default: "auto"
    description: "Postgres DSN."

repository:
  url: git@github.com:anywaye/billing.git
  defaultBranch: master
  visibility: private

owner:
  team: billing
  contact: billing@anywaye.com
