apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: billing
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/anywaye/charts/billing
    chart: billing
    targetRevision: 0.2.1
    helm:
      values: |
        # Migrations run as the owner role; the runtime uses the _app role.
        # billing-owner-secrets is SOPS-managed in deploy/owner-secret.yaml
        # (see chart/README.md).
        migrationSecretName: billing-owner-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: billing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
