# The HTTP surface of billing, v1.
#
# Written against core's docs/openapi-conventions.md: `/v1` on every path,
# `application/problem+json` for every non-2xx, cursor pagination on every
# collection, `Idempotency-Key` on every retriable POST, and `X-Trace-Id` on
# every response. `test/contract` checks the event side of the same contract
# against core's envelope schema.
#
# Five things a reader should know before trusting this document:
#
# 1. **Every `/v1` operation requires a bearer token**, except the one path
#    named in note 3. `security` below is `[{bearerToken: []}]`, the scheme is an
#    RS256 JWT issued by `identity` and verified locally against its published
#    JWKS, and a request with no token is a `401`. A deployment that has not
#    configured an issuer and an audience is **locked, not open**: every `/v1`
#    request is a `503`, because a billing API whose authentication degrades open
#    when nobody configured it is the failure this scheme exists to prevent.
#    `401` is for the caller's credential and `503` is for ours — an unreachable
#    identity is not something a caller can fix by rotating a token. Every
#    customer and subscription operation is additionally scoped by the token's
#    `account_id`, so another account's uuid is a `404`: the same answer as a uuid
#    that names nothing, never a `403`.
# 2. The plans read/write asymmetry is deliberate: `GET /v1/plans/{slug}` reads
#    by the public handle, `PATCH /v1/plans/{id}` writes by uuid, because a slug
#    can be changed by the very request being made and a mutable handle is not a
#    safe thing to address a mutation by. **A plan is platform catalogue and
#    carries no account**, so these four operations are authenticated but not
#    account-scoped; see note 6.
# 3. `/v1/webhooks/stripe` is the one path that is not a cafaye client surface.
#    Its sender is a processor and it authenticates by signature over the raw
#    body, so it declares `security: []`, takes no `Idempotency-Key` (the
#    processor's own event id is the dedupe key, and it is enforced by a unique
#    index rather than by a header), and it must never grow a token check — a
#    `Bearer` here would be a second, weaker trust path to the same door.
#    Structurally it cannot: the token check is a filter on the `/v1` client base
#    controller, and this one does not inherit from it.
# 4. **The subscription endpoints do not decide a subscription's state.** Every
#    mutating one asks the payment processor to do something and returns; the
#    subscription's own status changes only when `customer.subscription.*` arrives
#    on the webhook path. So `POST /v1/subscriptions` returns a Checkout session
#    and not a subscription, and carries no `Location`, and `POST
#    /v1/subscriptions/{id}/cancel` returns a subscription that is still
#    `active`. Each operation says so, and the one place that is not true —
#    `change_plan`, which also returns the timing decision it made — explains why
#    in the operation's own description.
# 5. **This document and `config/routes.rb` are held to each other by method and
#    path.** `test/contract/http_surface_contract_test.rb` fails if an operation
#    here is not served, and fails if the router serves one that is not here — so
#    a client generated from this document cannot call an operation this service
#    does not serve, and this service does not serve an operation no client can
#    know about. Every route that is deliberately *not* a client operation is
#    named in that test with the reason it is not one, which is what makes "not
#    described here" different from "in no document at all". The two sets are
#    compared as sets rather than as counts: a rename and a pure addition are
#    different failures, and a count cannot tell them apart.
# 6. **Catalogue writes are authenticated but not capability-checked.** A plan has
#    no `account_id` — it is what an account may buy, not what an account owns —
#    so `POST /v1/plans` and `PATCH /v1/plans/{id}` change what every account is
#    offered and core's answer to that is `scopes`, not tenancy. No client in
#    this build holds a billing scope, so none is enforced here and **any
#    authenticated caller can currently write the catalogue**. Recorded in
#    `README.md` rather than papered over with a check no token could pass.
openapi: 3.1.0
info:
  title: billing
  # 2.0.0 is billing-21, and it is a **major** bump under a `/v1` prefix, which
  # core's sync rule says should not happen — so the reasoning is here.
  #
  # Every `/v1` operation now requires a bearer token and every customer and
  # subscription operation is scoped by the token's `account_id`. That is breaking
  # for every client of this document: an unauthenticated call that used to answer
  # 200 now answers 401, a request naming another account's uuid that used to
  # answer 200 now answers 404, and `POST /v1/customers` no longer takes
  # `owner_type`/`owner_id` from the body.
  #
  # **The prefix stays `/v1` anyway, because the alternative is worse than a rule.**
  # Core's rule exists so a breaking change lands *beside* the old prefix and the
  # old one keeps answering — which is exactly what cannot be done here: the old
  # `/v1` answers every request without a token, so "keep serving `/v1` for
  # compatibility" is "keep the vulnerability", and a second prefix over one open
  # door is one open door. The major bump in `info.version` plus the migration note
  # in `README.md` and `CHANGELOG.md` is the signal instead, and `info.version` is
  # read by every client generator, so a client that ignores it ignored a published
  # major version of the whole document. **This is a judgement call and it is
  # recorded as one** rather than made silently.
  #
  # 1.3.0 added a response, not an operation. `PATCH /v1/customers/{id}` can now
  # answer 409, because `processor_customer_id` became unique and that is the one
  # field on a customer a client can move; `POST /v1/customers` and both plan
  # writes could already answer 409 and now say *which* collision they are
  # reporting. No operation was added, removed or changed, and no response body
  # shape moved, so this is a minor bump and the `/v1` prefix is untouched —
  # core's checklist asks for `info.version` to be raised if anything else in the
  # document moved, and the `/409` rows are that.
  #
  # 1.2.0 moved no operation. What moved is this document's account of itself:
  # `info.description` said it "describes the v0 surface" while the version said
  # otherwise, and the header above now states the rule that holds the document to
  # the router.
  #
  # 1.1.0 was the five subscription paths under the same `/v1` prefix, plus a new
  # response field on the subscription resource (`price`) and one on the plan
  # resource (`entitlements`).
  #
  # 2.1.0 added one operation and changed no other: `GET /v1/charges/{id}`, the
  # receipt for one charge. It is account-scoped like every other row-addressed
  # operation, it is additive — no existing operation, response or body shape
  # moved — and it is the first operation whose success response is not JSON,
  # which is a fact about the response and not a break for a client that never
  # called it. A minor bump under the unchanged `/v1` prefix, per core's rule.
  #
  # 2.5.0 is the checkout door's return URLs — one added field, and the
  # reason it is not "additive": `POST /v1/subscriptions` could not succeed
  # without them. Stripe requires `success_url` on a hosted Checkout
  # Session, and the request this service sent omitted it, so the real API
  # refused every session the door tried to open. The live recording
  # (`test/services/processor/stripe_client_live_test.rb`, cassettes under
  # `test/cassettes/stripe/`) is what caught it, because the hand-written
  # double accepted the incomplete session happily. The field is REQUIRED
  # now and a request without it is a 422 naming it — a breaking change to
  # an operation that never worked, recorded here rather than hidden in a
  # patch note.
  #
  # 2.4.0 is the money history and the portal: **two additive operations**,
  # `GET /v1/charges` (the index the receipts packet recorded as deliberately
  # absent — its two reasons have moved; see the operation) and `POST
  # /v1/subscriptions/{id}/payment_method` (the processor's own portal, and the
  # one operation whose answer is someone else's URL). No existing operation,
  # response or body shape moved, so a minor bump under the unchanged prefix.
  #
  # 2.3.0 is the upcoming invoice: **one additive operation, `GET
  # /v1/subscriptions/{id}/upcoming_invoice`**, the first operation whose
  # success is a *read from the processor* rather than a mutation. No existing
  # operation, response or body shape moved, so it is a minor bump under the
  # unchanged prefix. `tax` is the one figure the response derives — a
  # difference between two of the processor's own figures, for display — and the
  # operation says so where the figure is described.
  #
  # 2.2.0 is the checkout door: **one additive operation, `POST /v1/checkouts`**,
  # over the fake processor that replaced the `pay` gem's `FakeProcessor`
  # (`Processor::FakeClient`). No existing operation, response or body shape
  # moved, and it does not duplicate the production door — `POST
  # /v1/subscriptions` still means "ask Stripe for a hosted Checkout session and
  # write nothing". The door it adds documents its own absence: it answers 404
  # unless the deployment enabled it, because a door that fabricates an
  # `active` subscription from a request body is a free-subscription door the
  # day it is reachable.
  version: 2.5.0
  description: >-
    Plans, customers, the subscription lifecycle, and one inbound
    payment-processor webhook for cafaye. This document describes every client
    operation this service serves, and a test holds it to that by method and
    path: see note 5 above.

    **Every `/v1` operation here requires a bearer token** (note 1), and every
    customer and subscription operation is scoped by the token's `account_id`, so
    another account's resource is a `404` rather than a `403`. The one exception is
    `/v1/webhooks/stripe`, whose sender is a payment processor and which
    authenticates by signature (note 3).

    Not described here, and not missed. The health probes (/healthz, /readyz,
    /up) are infrastructure. The /404, /422, /500 and /503 pages are where the app
    lands when a request fails rather than operations a client calls. The
    /rails/* routes are drawn by Rails engines. Prepaid credit, usage metering
    and invoices are absent because they are not built yet — README, "Known
    gaps".
  contact:
    name: billing
    email: billing@cafaye.com
servers:
  - url: https://billing.cafaye.com
    description: Production
  - url: http://localhost:3000
    description: Local

# Applied to every operation below, **except** the one that overrides it with
# `security: []` (the Stripe webhook, note 3).
#
# It is not `[]`, and it was not `[]` for a reason: a document declaring no
# security for an API holding payment records is a document a self-hoster reads as
# permission to serve it to anybody. core's checklist asks every new operation to
# state "required scopes + `account_id` scoping" in the security scheme, and this is
# where billing's answer lives.
security:
  - bearerToken: []

tags:
  - name: customers
    description: Billing records of the users and accounts identity knows about.
  - name: plans
    description: What can be bought, at what price, on what cadence.
  - name: subscriptions
    description: >-
      The plan lifecycle. Every mutating action asks the payment processor to do
      something and returns; the subscription's own status changes only when a
      webhook says the processor did it.
  - name: charges
    description: >-
      What a customer was charged, and the receipt for it. A charge is recorded
      when a payment succeeds and never when it fails or is pending; it is read
      by id, scoped by the token's account.
  - name: checkouts
    description: >-
      Starting a subscription. Two doors: `POST /v1/subscriptions` is the
      production door, a hosted Checkout session and no row; `POST
      /v1/checkouts` is the development door, which completes now against the
      fake processor and answers 404 where it is not enabled.
  - name: webhooks
    description: >-
      Events coming in from a payment processor. Authenticated by signature
      rather than by token, because the sender is not a cafaye client.

paths:
  /v1/customers:
    get:
      tags: [customers]
      operationId: listCustomers
      summary: List customers
      description: >-
        **This account's customers**, scoped by the token's `account_id`. Another
        account's customer is not in this listing and is not distinguishable from one
        that does not exist.

        The listing holds at most one row: `customers` is unique on
        `(owner_type, owner_id, processor)` and the owner is the token's account, so
        an account holds one customer per processor. Pagination is still declared
        because the shape is the platform's and a second processor would fill it.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: A page of customers, newest first.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
        '400':
          $ref: '#/components/responses/CursorInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/CallerIdentityUnavailable'
    post:
      tags: [customers]
      operationId: createCustomer
      summary: Create a customer
      description: >-
        Creates billing's record of the **authenticated account**. One customer per
        (owner, processor), and one customer per `processor_customer_id`: a second
        attempt at either is a 409.

        **`owner_type` and `owner_id` are no longer read from the body.** The owner is
        the token's `account_id` and `owner_type` is always `Account`, so anything the
        body sends under those two names is ignored. This is a breaking change from
        the version that took them from the body, and it is deliberate: honouring a
        body-supplied owner would let any authenticated caller mint a customer owned by
        another tenant, which is a cross-tenant write wearing a `POST`. A `User`-owned
        customer is therefore no longer creatable here — billing cannot know which
        account a user belongs to, so such a row would have no tenant to be scoped to.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '201':
          description: Created.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Location:
              description: The path of the new customer.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/CallerIdentityUnavailable'
  /v1/customers/{id}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [customers]
      operationId: getCustomer
      summary: Get a customer
      description: >-
        Reads the customer by uuid **within the token's account**. Another account's
        uuid is a `404` — byte for byte the answer a uuid naming nothing gets, which
        is what makes it safe: a `403` would tell a caller walking uuids which ids
        exist.
      parameters:
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: The customer.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/CallerIdentityUnavailable'
    patch:
      tags: [customers]
      operationId: updateCustomer
      summary: Update a customer
      description: >-
        Partial update of a customer **in the token's account**. Another account's
        uuid is a `404`, and no field of another account's row is writable from here.

        Emits no event: core's event catalog has no `billing.customer.updated` row,
        and this service does not publish a type the catalog does not list.

        `processor_customer_id` is unique across customers, so a claim on an
        identifier another customer already holds is a 409. `owner` and `processor`
        are not updatable, which leaves this as the one identifier a client can move.
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
      responses:
        '200':
          description: The updated customer.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

        '503':
          $ref: '#/components/responses/CallerIdentityUnavailable'
  /v1/plans:
    get:
      tags: [plans]
      operationId: listPlans
      summary: List plans
      description: >-
        **The whole catalogue.** A plan is what an account may buy, not what an
        account owns, so it has no `account_id` and this listing is not filtered —
        every authenticated caller reads the same rows. Note 6.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: A page of plans, newest first.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanPage'
        '400':
          $ref: '#/components/responses/CursorInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/CallerIdentityUnavailable'
    post:
      tags: [plans]
      operationId: createPlan
      summary: Create a plan
      description: >-
        One plan per `slug`, and one plan per `processor_price_id`. A second
        attempt at either is a 409, and the body names the field that collided.

        **This changes what every account is offered, so it is a capability question
        and not a tenancy one** — and no capability is enforced here. core's answer is
        `scopes`, and no client in this build holds a billing scope, so any
        authenticated caller can currently create a plan. Recorded in `README.md`
        rather than gated by a check no token could pass.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanCreate'
      responses:
        '201':
          description: Created.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Location:
              description: The path of the new plan.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/CallerIdentityUnavailable'
  /v1/plans/{slug}:
    get:
      tags: [plans]
      operationId: getPlan
      summary: Get a plan by slug
      description: >-
        Read by slug, the handle that appears in a pricing page. A uuid is a 404
        here: this operation does not look plans up by id.
      parameters:
        - name: slug
          in: path
          required: true
          description: The plan's kebab-case slug.
          schema:
            type: string
            pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: The plan.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/CallerIdentityUnavailable'
  /v1/plans/{id}:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    patch:
      tags: [plans]
      operationId: updatePlan
      summary: Update a plan
      description: >-
        Write by uuid, because the slug can be changed by this very request and
        a mutable handle is not a safe thing to address a mutation by. A slug
        is a 404 here: this operation does not look plans up by slug. Emits
        `billing.plan.updated` only when a field actually changed.

        **Like `POST /v1/plans`, this changes what every account is offered and no
        capability is enforced on it.** A plan carries no account, so there is no
        tenancy to scope the write by; core's answer is `scopes` and no client in
        this build holds a billing scope. Recorded in `README.md`. Note 6.

        `slug` and `processor_price_id` are both unique across plans, so a claim
        on either one another plan already holds is a 409 and nothing is written.
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanUpdate'
      responses:
        '200':
          description: The updated plan.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/CallerIdentityUnavailable'
  /v1/subscriptions:
    get:
      tags: [subscriptions]
      operationId: listSubscriptions
      summary: List subscriptions
      description: >-
        **This account's subscriptions**, scoped by the token's `account_id` and by
        nothing else. Another account's subscription is not in this listing, and the
        scope is read from the token and never from a query parameter.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: A page of subscriptions, newest first.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPage'
        '400':
          $ref: '#/components/responses/CursorInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/CallerIdentityUnavailable'
    post:
      tags: [subscriptions]
      operationId: createSubscriptionCheckout
      summary: Start a subscription by creating a Checkout session
      description: >-
        Creates a payment processor Checkout session for one plan and returns its
        URL. The caller sends the buyer there; the processor collects the first
        payment and creates the subscription.

        **No subscription is created by this request, and the response is not a
        subscription.** A subscription does not exist until the payment completes,
        and this service does not invent a row for one that does not — which is why
        there is no `Location` header either: there is no resource to point at. The
        row appears when `customer.subscription.created` arrives, and
        `billing.subscription.started` is published in the same transaction as that
        row.

        `customer_id` names the buyer, and it is resolved **inside the token's account** —
        a `customer_id` naming another account's row is refused as "not a record this
        service has", the same answer a uuid nobody holds gets. The session this
        creates carries `customer_reference` and the customer's saved processor id, so
        an unscoped lookup would have opened a payment against another tenant's saved
        card.

        A customer whose owner is a `User` rather than an `Account` is refused:
        which account a user belongs to is identity's fact and no event carrying it is
        in this build's `consumes`, so such a row has no tenant to be scoped to.

        Idempotent on `Idempotency-Key`: the same key with the same body replays the
        first response rather than creating a second Checkout session, and the same
        key with a different body is a 409. **The key is scoped to the caller's `sub`**
        as well as to the endpoint, so one tenant cannot replay another's stored
        response by guessing a uuid.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCheckoutRequest'
      responses:
        '201':
          description: >-
            A Checkout session was created. Deliberately carries no `Location`:
            nothing in this service's database was created, and a header pointing at
            a resource that does not exist yet would be a link to a 404.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ProcessorUnconfigured'

  /v1/subscriptions/{id}:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      tags: [subscriptions]
      operationId: getSubscription
      summary: Get a subscription
      description: >-
        Reads the subscription by uuid **within the token's account**. Another
        account's uuid is a `404` — byte for byte the answer a uuid naming nothing
        gets. `404` and never `403`: a 403 would say "this exists, you may not have
        it", which is an enumeration oracle over ids a caller can walk.
      parameters:
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: The subscription, with its plan's price in integer minor units.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/CallerIdentityUnavailable'
  /v1/subscriptions/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      tags: [subscriptions]
      operationId: cancelSubscription
      summary: Cancel a subscription
      description: >-
        Asks the payment processor to cancel, and returns. **The subscription is not
        canceled by this response** — its status changes when
        `customer.subscription.deleted` arrives and `billing.subscription.canceled` is
        published. A response claiming the cancellation had happened would be a lie
        about a state this service does not own.

        **The subscription is resolved within the token's account first**, so another
        account's uuid is a `404` and the processor is **never asked** — the scope is
        the resolution, not the request. This is the expensive direction, so it is the
        one the scoping matters most for.

        `at_period_end` is required and must be a boolean: the caller chooses, and
        this service does not inherit a processor's default on its behalf. It is
        refused as a 422 for a `past_due` subscription, which has no further period
        to serve — and refusing beats quietly cancelling immediately, which is not
        what was asked for.

        A `canceled` or `unpaid` subscription is a 409: the request collides with
        something that has already happened, or the processor has stopped collecting
        and will cancel it itself.

        No refund and no proration is requested. The credit for the unused part of a
        period is the processor's to compute, and a refund calculated here would be a
        figure this service did not keep.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: The processor was asked. The subscription is as it was.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ProcessorUnconfigured'

  /v1/subscriptions/{id}/change_plan:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      tags: [subscriptions]
      operationId: changeSubscriptionPlan
      summary: Move a subscription to another plan
      description: >-
        Asks the payment processor to move the subscription, and returns. **The local
        plan does not change by this response** — it changes when
        `customer.subscription.updated` arrives and `billing.subscription.updated` is
        published.

        **The subscription is resolved within the token's account first**, so another
        account's uuid is a `404` and the processor is never asked.

        The timing rule, which is the point of the endpoint and is decided in one
        place:

        * **A more expensive plan takes effect immediately.** The processor bills the
          difference now (`proration_behavior: always_invoice`). The customer asked
          for more service, and delivering it at the end of the period would mean
          they used it for free in between.
        * **A cheaper or equally priced plan takes effect at the end of the current
          period**, with nothing carried forward (`proration_behavior: none`). Nobody
          is refunded for a plan they are already leaving, and no credit is computed
          here.
        * **A plan on a different interval, or in a different currency, is refused.**
          Ten dollars a month against a hundred a year is not a cheaper plan, it is a
          different unit; comparing them would mean annualising, which is computing
          money nobody asked for.

        `plan_change` in the response states which rule applied. It is not state — the
        subscription's own fields have not moved — and it exists so a client can tell
        the caller that a downgrade is scheduled rather than applied.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePlanRequest'
      responses:
        '200':
          description: The processor was asked, plus what was decided.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionWithPlanChange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ProcessorUnconfigured'

  /v1/subscriptions/{id}/payment_method:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      tags: [subscriptions]
      operationId: createPaymentMethodUrl
      summary: A portal URL for the subscription's customer to update their card
      description: >-
        The processor's own self-serve portal: where a customer goes to update a
        card, add a payment method or read an invoice. This service holds no
        payment-method form of its own — a card it stored would be a card it
        holds — so the answer is the processor's URL and nothing else.

        The subscription is resolved **inside the token's account** first, so
        another account's uuid is a 404 and no portal is asked for. The
        customer the portal opens for is the row's customer, not one the body
        names.

        `return_url` is required and must be a **path on this origin**: the
        processor redirects there when the customer is done, and a URL the
        processor will redirect to is an open-redirect weapon if it can name
        any host — a phishing page served by the processor's own redirect, from
        a page the customer trusts. A relative path is all any caller needs.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodRequest'
      responses:
        '200':
          description: The portal URL, valid for one visit.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodUrl'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ProcessorUnconfigured'
  /v1/subscriptions/{id}/entitlements:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      tags: [subscriptions]
      operationId: getSubscriptionEntitlements
      summary: What this subscription grants, right now
      description: >-
        The plan's features and limits, and whether this subscription is currently
        granting them, **for a subscription in the token's account**. Another
        account's uuid is a `404`, so entitlements are never disclosed about a
        subscription the caller does not hold.

        A `canceled` subscription grants nothing: `features` is `[]` and `limits` is
        `{}`. A `past_due` or `unpaid` one still grants, because the processor's grace
        period is a product decision and not this service's to take away.
      parameters:
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: The entitlements in force.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlements'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/CallerIdentityUnavailable'
  /v1/subscriptions/{id}/upcoming_invoice:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      tags: [subscriptions]
      operationId: getUpcomingInvoice
      summary: What the next invoice will charge, before it is paid
      description: >-
        The processor's projection of the next invoice for a subscription **in
        the token's account**. Another account's uuid is a 404, byte for byte
        the answer a uuid naming nothing gets, and the processor is not asked.

        Every figure in the response is the processor's own, in integer minor
        units and an upper-case currency: the line items, the subtotal and the
        total. The single exception is `tax`, which is **derived for display**
        as `total - total_excluding_tax` — never stored, never sent to the
        processor, and never used for a decision — because a response whose
        parts did not add up when tax is present would be the worse lie.

        A `canceled` subscription is a **409** and the processor is not asked:
        the processor has stopped collecting, and a projection of a charge that
        will not happen is a figure this service may not invent. A `past_due` or
        `unpaid` one is left to the processor — those are collection states, and
        whether there is still a period to invoice is the processor's answer.

        A `unit_amount` is the processor's own `price.unit_amount`, read rather
        than derived from the line's total: with a quantity greater than one a
        derived figure would be wrong, and the processor states it outright.
      parameters:
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: The projection, in the processor's own figures.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ProcessorUnconfigured'
  /v1/checkouts:
    post:
      tags: [checkouts]
      operationId: createCheckout
      summary: Start a subscription through the fake processor, completing now
      description: >-
        **The development door.** Completes a checkout against
        `Processor::FakeClient` — a processor whose API is its parameters — so
        the subscription exists when this answers, and a caller with no Stripe
        account, no keys and no network can subscribe end to end. The 201
        carries the created subscription, which is the one difference from
        `POST /v1/subscriptions` (see below).

        **It answers 404 in a deployment it is not enabled in.** The door
        fabricates an `active` subscription from a request body, so a
        deployment where it is reachable is a deployment that gives
        subscriptions away. It exists when `BILLING_FAKE_PROCESSOR_ENABLED` is
        set (on by default in development and test) and answers the same 404 a
        uuid naming nothing gets otherwise — the door is absent, not refused,
        and a caller learns nothing about the deployment's configuration.

        `customer_id` names the buyer and is resolved **inside the token's
        account** — a `customer_id` naming another account's customer is the
        same "not a record this service has" a bogus uuid gets, and the
        processor is never asked. A `User`-owned customer is refused, because
        which account a user belongs to is identity's fact and no event
        carrying it is in this build's `consumes`.

        The subscription is written by `Subscriptions::Lifecycle` — the same
        state machine, the same `Refused` vocabulary, the same outbox event —
        from the same normalised delivery a processor webhook would carry. The
        row is `active`, or `trialing` while a trial is running, exactly as the
        processor reported it. The failure body names the reason verbatim.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: >-
            The completed checkout: the subscription it created, with its
            plan's price in integer minor units and the processor's own id for
            it as `processor_subscription_id`. Unlike the production door's
            201, this one points at a row — a row exists.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Location:
              description: The path of the new subscription.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/CallerIdentityUnavailable'
  /v1/charges:
    get:
      tags: [charges]
      operationId: listCharges
      summary: List this account's charges
      description: >-
        **This account's charges**, newest first, scoped by the token's
        `account_id` and by nothing else. Another account's charge is not in
        this listing and is not distinguishable from one that does not exist.

        The receipts packet's own note recorded why an index was absent — "a
        list of money without a date range is a page nobody chose to read and a
        list nobody can scope safely" — and both reasons have since moved.
        Every charge row is denormalised with an `account_id` and resolved
        through `Charge.for_account`, so the listing is scoped by the token;
        and a cursor page of the newest charges, each carrying its own id, is
        the history a customer looks for when they ask what they paid and
        when. A date range is the page size and the order, not a required
        parameter.

        The receipt is `GET /v1/charges/{id}` — the HTML page a person reads.
        This is the listing a program pages.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: A page of charges, newest first.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargePage'
        '400':
          $ref: '#/components/responses/CursorInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/CallerIdentityUnavailable'
  /v1/charges/{id}:
    parameters:
      - $ref: '#/components/parameters/ChargeId'
    get:
      tags: [charges]
      operationId: getCharge
      summary: Get a charge receipt
      description: >-
        The receipt for one charge, rendered as a self-contained HTML document,
        **for a charge in the token's account**. Another account's uuid is a
        `404` — byte for byte the answer a uuid naming nothing gets, which is
        what makes it safe: a `403` would tell a caller walking uuids which ids
        exist.

        This is the one operation on `/v1` whose success response is not JSON:
        a receipt is a page a person reads, not a resource a program consumes.
        Every **error** on it is still `application/problem+json`, with the same
        seven keys as everywhere else.

        The receipt's description is the processor's own text — an invoice line
        item's description — and is HTML-escaped on the way out, without
        exception, because a price named `<script>` at the processor must not
        execute in a page served from this origin.
      parameters:
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: The receipt, as a self-contained HTML document.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/CallerIdentityUnavailable'
  /v1/webhooks/stripe:
    post:
      tags: [webhooks]
      operationId: receiveStripeWebhook
      summary: Receive one Stripe event
      description: >-
        Verifies the `Stripe-Signature` header against `STRIPE_WEBHOOK_SECRET` and
        stores the event before interpreting it. `STRIPE_WEBHOOK_SECRETS`, a
        comma-separated list, may be set instead during a secret rotation; a
        signature that verifies under any configured secret is accepted.

        The response says whether the request was *received*, not whether this
        service found anything to do. Delivery is at-least-once, so the same event
        id arrives again — immediately, or a day later — and a replay is a 200 and
        a lookup rather than a second event. An event type this build has no
        mapping for, a type it deliberately ignores, and an event whose mapping
        failed are all 200 with the outcome recorded on the stored row. A 5xx
        would teach Stripe to retry a decision this service has already made, and
        would hide a parked row behind a timeout.

        An unverified body is never stored. `stripe_event_id` is UNIQUE, so a
        replay cannot produce a second row, and the row is written in the same
        transaction as the event it produces, so a stored event and the receipt
        saying it arrived cannot disagree.

        This endpoint is not token-authenticated and must never grow a token
        check: a `Bearer` here would be a second, weaker trust path to the same
        door as the `/v1` API. **`security: []` below overrides the document's**
        `bearerToken` for this operation and for no other — and it is structural
        rather than a convention: the token check is a filter on the `/v1` client
        base controller, which this one does not inherit from.
      security: []
      parameters:
        - $ref: '#/components/parameters/StripeSignature'
      requestBody:
        required: true
        description: >-
          The Stripe event, unmodified. The body is hashed exactly as it arrives,
          so it is never re-serialized before verification.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StripeEvent'
      responses:
        '200':
          description: >-
            The event was verified and is recorded. Whatever became of it —
            emitted, deliberately ignored, or parked as failed — the processor has
            nothing to retry.

            There is no response body. The processor is told only that the event
            was received; what this service did with it is a fact about billing's
            own tables, and inventing a body here would be a response shape with
            no contract behind it. What became of the event is queryable:
            `processor_webhooks.error` carries `ignored:<reason>` or
            `failed:<class>: <message>`, and a NULL `processed_at` is the only
            state a crash can leave behind.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
        '400':
          $ref: '#/components/responses/SignatureRejected'
        '503':
          $ref: '#/components/responses/SigningUnconfigured'

components:
  securitySchemes:
    # The scheme `security` above names, and the whole of what a caller has to
    # know to get past the door. core's checklist asks a new endpoint to state
    # "required scopes + `account_id` scoping" here, so this is where billing's
    # answer lives rather than as prose on each of fourteen operations.
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <jwt>`, where the JWT is an **RS256** token issued by
        `identity` and verified **locally** against its published JWKS at
        `{issuer}/.well-known/jwks.json`. Keys are cached by `kid` for five minutes
        and refreshed once per cache window on an unknown `kid`, so a burst of forged
        tokens cannot aim one request per token at `identity`.

        **RS256 only, and `alg` is a constant rather than a hint.** `alg: none`,
        HS256 signed with the published public key, and any algorithm the key set does
        not advertise are refused — on the *protected header*, before any network
        call. core's conventions also allow ES256; widening this is a one-line change
        and belongs with the moment `identity` publishes ES256 keys.

        **Required claims: `iss`, `aud`, `exp`, `sub`, `iat`, `jti` and `account_id`.**
        `account_id` is the tenancy key: every customer and subscription operation is
        scoped by it and by nothing else, and a token without one is refused rather
        than treated as "no account", because "no account" and "an account I could not
        read" must not both be answers to the same request.

        **> A token `identity` issues to a user today will be REFUSED, and this
        > section is where that is written down rather than discovered.** core's
        > conventions ask for a singular `account_id`; `identity` sends `accounts`,
        > an array of `{account_id, name, slug, role, personal}`, on the `accounts`
        > scope, because a user is in a personal account and usually several team
        > accounts, and any one of them would be wrong for the rest. billing refuses
        > the array rather than reading the first entry, the personal one, or any
        > other guess: a tenancy key nobody chose is a cross-tenant read, and it
        > would look like it works. **The disagreement is a DECISION NEEDED in
        > `cafaye.yml`**, and the likeliest resolution is the gateway resolving the
        > account and forwarding one. To an integrator: a `401` naming a tenancy
        > claim on a token that looks perfectly valid is this, and it is not a bug
        > in your token.

        The capability claim is the space-separated `scope` string RFC 9068 registers —
        not core's `scopes`, which `identity` does not issue. It is **parsed and not
        yet enforced**: no client in this build holds a billing scope, and the one
        operation that would need one (catalogue writes) is recorded in `README.md` as
        a gap rather than gated by a check no token could pass. An absent `scope`
        claim is an empty set, never everything.

        ### The two refusals, and which one is which

        | | |
        | --- | --- |
        | `401 unauthorized` | the **caller's** credential: absent, malformed, the wrong algorithm, signed by a key `identity` does not publish, expired, issued to another service, or carrying no `account_id`. **One fixed body** — which of those it was is not something a caller learns by trying. |
        | `503 unavailable` | **this service's**: no issuer or audience configured, or `identity`'s key set unreachable. A `401` here would tell a caller holding a valid token to go and rotate it. |

        **An unconfigured deployment is locked, not open.** Every `/v1` operation
        answers `503` when no issuer is configured, and that is the property this
        scheme exists to protect. The cause goes to the log with the trace id; the body
        names no environment variable, because an unauthenticated caller must not be
        able to read a deployment's configuration out of an error document.

        `/v1/webhooks/stripe` does **not** use this scheme. Its sender is a payment
        processor and it authenticates by signature over the raw body; see that
        operation's own `security: []`.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Rows per page. Defaults to 25, capped at 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque base64url cursor from a previous page's `page.next_cursor`.
        Clients must not parse it; its encoding may change without notice.
        Expires after 24 hours.
      schema:
        type: string
    Order:
      name: order
      in: query
      required: false
      description: Sort direction. Defaults to desc (newest first).
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        A uuid chosen by the client. The same key with the same body replays the
        original response and sets `Idempotency-Replayed: true`; the same key
        with a different body is a 409 `idempotency_key_reused`. A request
        without the key is processed normally.

        **The key is scoped to the caller's `sub` as well as to the endpoint**,
        which is what core's `(endpoint, principal, key)` scope means once there is
        a principal: two tenants choosing the same uuid no longer share one
        namespace, so a replay cannot return another caller's stored response. It is
        `sub` and not `account_id` because two users in one account are two callers,
        and a replay under one user's key must not answer for the other's.
      schema:
        type: string
        format: uuid
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      description: >-
        The caller's trace id, echoed on the response and repeated in the body
        of every error. Supplying one is how a call is followed.
      schema:
        type: string
    CustomerId:
      name: id
      in: path
      required: true
      description: The customer's uuid.
      schema:
        type: string
        format: uuid
    PlanId:
      name: id
      in: path
      required: true
      description: The plan's uuid.
      schema:
        type: string
        format: uuid
    SubscriptionId:
      name: id
      in: path
      required: true
      description: The subscription's uuid.
      schema:
        type: string
        format: uuid
    ChargeId:
      name: id
      in: path
      required: true
      description: The charge's uuid.
      schema:
        type: string
        format: uuid
    StripeSignature:
      name: Stripe-Signature
      in: header
      required: true
      description: >-
        Stripe's signature over the exact request bytes, in the form
        `t=<unix seconds>,v1=<hex hmac-sha256>`. The HMAC is computed over
        `<timestamp>.<raw body>` keyed with the endpoint's signing secret. More
        than one `v1` may be present, which is how a rotation is absorbed.
      schema:
        type: string
        pattern: '^t=\d+,v1=[0-9a-f]{64}(,v1=[0-9a-f]{64})*$'
      example: "t=1790740800,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd"

  headers:
    TraceId:
      description: The trace id, always present.
      required: true
      schema:
        type: string
    IdempotencyReplayed:
      description: '`true` when this response was replayed from a stored one.'
      schema:
        type: string
        enum: ['true']

  schemas:
    # The money rule at the wire: an amount crosses a boundary as integer minor
    # units plus a currency, never as a decimal and never as a float.
    Money:
      type: object
      description: An amount of money in integer minor units.
      required: [amount_minor, currency]
      additionalProperties: false
      properties:
        amount_minor:
          type: integer
          description: >-
            A whole number of minor units. A decimal here — as a number or as a
            string — is a 422: a float cannot represent 0.10 exactly, so it never
            carries an amount.
          minimum: 0
          example: 1900
        currency:
          type: string
          description: An ISO 4217 code, stored and returned upper case.
          pattern: '^[A-Z]{3}$'
          example: USD

    CustomerOwner:
      type: object
      description: >-
        A reference to an identity record. A uuid, stored without a foreign
        key: it crosses a service boundary, and billing never loads it.
      required: [type, id]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [User, Account]
        id:
          type: string
          format: uuid

    Customer:
      type: object
      required:
        [id, owner, processor, processor_customer_id, email, metadata, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        owner:
          $ref: '#/components/schemas/CustomerOwner'
        processor:
          type: string
          description: The payment processor. Only `stripe` in v0.
          enum: [stripe]
        processor_customer_id:
          type: [string, 'null']
          description: >-
            The processor-side id. Always null in v0: this build makes no Stripe
            call.
        email:
          type: [string, 'null']
          format: email
        metadata:
          type: object
          description: Caller-supplied data. Never a scalar.
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CustomerCreate:
      type: object
      description: >-
        **`owner` is not a property here, and that is the breaking change in 2.0.0.**
        The owner is the authenticated account: `owner_type` is always `Account` and
        `owner_id` is the token's `account_id`. This build ignores an `owner` (or an
        `owner_type`/`owner_id` pair) sent in the body rather than refusing it, because
        an unrecognised field is a field this version does not have and that is not an
        error on this surface.

        A `User`-owned customer is therefore not creatable through this operation.
        Which account a user belongs to is identity's fact, no event carrying it is in
        this build's `consumes`, and a row with no tenant has nobody to scope it to.
      required: [processor]
      additionalProperties: false
      properties:
        processor:
          type: string
          enum: [stripe]
        email:
          type: [string, 'null']
          format: email
        metadata:
          type: object
          additionalProperties: true

    CustomerUpdate:
      type: object
      additionalProperties: false
      description: >-
        Every field is optional, and an absent field is left alone. `owner` and
        `processor` are not updatable: they are the key the uniqueness rule is
        built on, and moving a customer is a delete and a create.

        `processor_customer_id` IS updatable, and it is unique across customers —
        the one identifier a client can move, and the reason this operation can
        answer 409. A null means "this customer has no id at the processor yet",
        which many customers may be at once, so the rule is on the value and not
        on the column.
      properties:
        email:
          type: [string, 'null']
          format: email
        processor_customer_id:
          type: [string, 'null']
          description: >-
            The processor's own id for this customer. Unique: a value another
            customer already holds is a 409 naming this field.
        metadata:
          type: object
          additionalProperties: true

    CustomerPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          description: Always an array, empty rather than absent.
          items:
            $ref: '#/components/schemas/Customer'
        page:
          $ref: '#/components/schemas/Page'

    Plan:
      type: object
      required:
        [id, name, slug, processor_product_id, processor_price_id, price, interval, trial_days, entitlements, active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        processor_product_id:
          type: [string, 'null']
        processor_price_id:
          type: [string, 'null']
        price:
          $ref: '#/components/schemas/Money'
        interval:
          type: string
          enum: [month, year, one_time]
        trial_days:
          type: integer
          minimum: 0
        entitlements:
          $ref: '#/components/schemas/PlanEntitlements'
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PlanCreate:
      type: object
      required: [name, slug, price, interval]
      additionalProperties: false
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        price:
          $ref: '#/components/schemas/Money'
        interval:
          type: string
          enum: [month, year, one_time]
        trial_days:
          type: integer
          minimum: 0
          default: 0
        active:
          type: boolean
          default: true
        processor_product_id:
          type: [string, 'null']
        processor_price_id:
          type: [string, 'null']

    PlanUpdate:
      type: object
      additionalProperties: false
      description: >-
        Every field is optional, and an absent field is left alone. `slug` and
        `processor_price_id` are both unique across plans, so a claim on either
        one another plan already holds is a 409 and nothing is written.
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        price:
          $ref: '#/components/schemas/Money'
        interval:
          type: string
          enum: [month, year, one_time]
        trial_days:
          type: integer
          minimum: 0
        active:
          type: boolean
        processor_product_id:
          type: [string, 'null']
        processor_price_id:
          type: [string, 'null']
          description: >-
            The processor's own id for this plan's price. Unique: a value another
            plan already holds is a 409 naming this field. A null means the plan
            is not on sale yet, which many plans may be at once.

    PlanEntitlements:
      type: object
      description: >-
        What buying this plan grants. An object with at most two members, so a
        reader never has to ask whether a key it does not know is one it should
        honour. `features` is a list of things switched on; `limits` is how many
        of each. A limit is a count and never an amount: there is no currency
        anywhere in this object, deliberately.
      additionalProperties: false
      properties:
        features:
          type: array
          description: Always an array, empty rather than absent.
          items:
            type: string
            minLength: 1
        limits:
          type: object
          description: Always an object, empty rather than absent.
          additionalProperties:
            type: integer
            minimum: 0

    PlanPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
        page:
          $ref: '#/components/schemas/Page'

    SubscriptionStatus:
      type: string
      description: >-
        What the payment processor says the subscription is. This service stores
        exactly what the processor reports and does not correct it: the processor is
        the party that bills, and a row that disagreed with it would grant
        entitlements nobody is paying for. A status outside this set is refused by
        the lifecycle with the delivery recorded, rather than coerced into one of
        these.
      enum: [trialing, active, past_due, canceled, unpaid]

    Subscription:
      type: object
      description: >-
        One account, on one plan, for one billing period at a time. `plan_slug` is
        derived from the plan and never stored, so it cannot go stale; the price is
        the plan's, in integer minor units, and is not stored here either — a
        subscription does not have a price, it has a plan.
      required:
        [id, account_id, plan_id, plan_slug, customer_id, processor_subscription_id, status, price,
         current_period_start, current_period_end, cancel_at_period_end, canceled_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
          description: The account being billed. identity's uuid; no foreign key.
        plan_id:
          type: string
          format: uuid
        plan_slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        customer_id:
          type: string
          format: uuid
        processor_subscription_id:
          type: string
          description: >-
            The processor's own id for this subscription. Unique here, and that index
            is how every event about a subscription is resolved.
          example: sub_1PZQaBcDeFgHiJkLmNoPqR1
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        price:
          $ref: '#/components/schemas/Money'
        current_period_start:
          type: [string, 'null']
          format: date-time
        current_period_end:
          type: [string, 'null']
          format: date-time
        cancel_at_period_end:
          type: boolean
          description: >-
            The customer asked to cancel at the end of the period. The subscription
            is still `active`: cancellation has not taken effect, and
            `billing.subscription.canceled` is published when it does.
        canceled_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SubscriptionPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          description: Always an array, empty rather than absent.
          items:
            $ref: '#/components/schemas/Subscription'
        page:
          $ref: '#/components/schemas/Page'

    SubscriptionCheckoutRequest:
      type: object
      required: [customer_id, plan_id]
      additionalProperties: false
      properties:
        customer_id:
          type: string
          format: uuid
          description: >-
            The billing customer to charge. Must belong to an `Account`: which
            account a user belongs to is identity's fact, and no event carrying it is
            in this build's `consumes`.
        plan_id:
          type: string
          format: uuid
          description: A plan that is active and has a processor price.

    CheckoutSession:
      type: object
      description: >-
        A hosted Checkout session, and the only thing this endpoint creates. The url
        is the processor's — one assembled here would be a link to nothing.
      required: [checkout_session_id, checkout_url, customer_id, plan_id]
      properties:
        checkout_session_id:
          type: string
          example: cs_test_00000000000001
        checkout_url:
          type: string
          format: uri
          example: https://checkout.stripe.test/c/pay/cs_test_00000000000001
        customer_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid

    # The development door's request. Same two fields the production door takes
    # and one more: a checkout that completes here needs to know how many seats
    # it is buying, because there is no hosted page that would have asked.
    CheckoutRequest:
      type: object
      required: [customer_id, plan_id, success_url]
      additionalProperties: false
      properties:
        customer_id:
          type: string
          format: uuid
          description: >-
            The billing customer to charge. Resolved inside the token's account:
            another account's customer is the same answer a bogus uuid gets.
        plan_id:
          type: string
          format: uuid
          description: A plan that is active and has a processor price.
        success_url:
          type: string
          format: uri
          description: >-
            Where the processor sends the buyer after paying. REQUIRED —
            Stripe refuses a hosted session without it — and it is the
            caller's URL because the page a buyer lands on is the app's, not
            one this service may invent. Must be an absolute http(s) URL; a
            relative path is a 422 naming this field.
        cancel_url:
          type: string
          format: uri
          description: >-
            Where the processor sends the buyer who backs out. Optional; the
            success URL is sent when the caller names no other, which is a
            page the buyer can use rather than whatever a dashboard default
            happens to be.
        quantity:
          type: integer
          minimum: 1
          description: >-
            Seats, when the plan is priced per unit. 1 by default. The
            multiplication happens at the processor and the amount charged is
            the processor's to compute.

    CancelRequest:
      type: object
      required: [at_period_end]
      additionalProperties: false
      properties:
        at_period_end:
          type: boolean
          description: >-
            True keeps the subscription until the end of the period it was paid for;
            false ends it now. Required, because the caller chooses and this service
            does not inherit a processor's default on its behalf.

    ChangePlanRequest:
      type: object
      required: [plan_id]
      additionalProperties: false
      properties:
        plan_id:
          type: string
          format: uuid
          description: >-
            The plan to move to. Must be active, have a processor price, and be
            quoted in the same currency and on the same interval as the current plan.

    PlanChangeDecision:
      type: object
      description: >-
        What a plan change request decided. Not state: the subscription's own fields
        have not moved, and they will not until the processor's webhook says so.
      required: [plan_id, effective, proration]
      properties:
        plan_id:
          type: string
          format: uuid
        effective:
          type: string
          enum: [immediately, period_end]
          description: >-
            `immediately` when the new plan costs more for the same interval, and the
            processor bills the difference now. `period_end` when it costs the same or
            less, and nothing is carried forward.
        proration:
          type: string
          enum: [always_invoice, none]
          description: >-
            The behaviour sent to the processor. The *amount* is the processor's to
            compute, and no figure is calculated in this service.

    SubscriptionWithPlanChange:
      allOf:
        - $ref: '#/components/schemas/Subscription'
        - type: object
          required: [plan_change]
          properties:
            plan_change:
              $ref: '#/components/schemas/PlanChangeDecision'

    Entitlements:
      type: object
      description: >-
        What the plan grants, and whether this subscription is granting it. A
        canceled subscription grants nothing.
      required: [subscription_id, plan_id, plan_slug, status, granted, features, limits]
      properties:
        subscription_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        plan_slug:
          type: string
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        granted:
          type: boolean
          description: False for a canceled subscription; true for every other status.
        features:
          type: array
          description: Always an array, empty rather than absent.
          items:
            type: string
        limits:
          type: object
          description: Always an object, empty rather than absent.
          additionalProperties:
            type: integer
            minimum: 0

    InvoicePreview:
      type: object
      description: >-
        What the next invoice will charge. The processor's own figures, except
        the one derived `tax` the operation describes.
      required: [subscription_id, period_end, currency, line_items, subtotal, tax, total]
      properties:
        subscription_id:
          type: string
          format: uuid
        period_end:
          type: string
          format: date-time
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLineItem'
        subtotal:
          type: integer
          description: Minor units, the processor's own.
        tax:
          type: integer
          description: >-
            Derived for display: `total - total_excluding_tax`, both of them the
            processor's own figures. Never stored and never sent back.
        total:
          type: integer
          description: Minor units, the processor's own.

    InvoiceLineItem:
      type: object
      required: [description, period, quantity, unit_amount, amount, currency]
      properties:
        description:
          type: string
        period:
          type: object
          required: [start, end]
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        quantity:
          type: integer
          minimum: 0
        unit_amount:
          type: integer
          description: >-
            The processor's own `price.unit_amount`, read rather than derived
            from the line total.
        amount:
          type: integer
          description: This line's total in minor units, the processor's own.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'

    Charge:
      type: object
      required:
        [id, account_id, customer_id, processor_charge_id, amount, currency, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
          description: The account the charge is billed to, denormalised at recording time.
        customer_id:
          type: string
          format: uuid
        subscription_id:
          type: [string, 'null']
          format: uuid
        processor_charge_id:
          type: string
          description: The processor's own id for this charge, UNIQUE here.
        amount:
          type: integer
          description: Integer minor units. The receipt formats it; the API transmits it.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        description:
          type: [string, 'null']
          description: The processor's own line-item text, stored verbatim.
        paid_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ChargePage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Charge'
        page:
          $ref: '#/components/schemas/Page'

    PaymentMethodRequest:
      type: object
      required: [return_url]
      additionalProperties: false
      properties:
        return_url:
          type: string
          description: >-
            A path on this origin, where the processor returns the customer.
            A relative path is all any caller needs, and an absolute URL to
            another host is a 422: a URL the processor will redirect to is an
            open-redirect weapon.
          pattern: '^/[^/]'

    PaymentMethodUrl:
      type: object
      required: [payment_method_url]
      properties:
        payment_method_url:
          type: string
          format: uri
          description: The processor's own portal URL. Not stored, and valid for one visit.

    Page:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: [string, 'null']
          description: Null on the last page.
        has_more:
          type: boolean

    # A processor event. Only `id` and `type` are read for routing;
    # `data.object` is the processor-specific payload and its shape is the
    # processor's, not cafaye's. The stored copy is the verified body verbatim,
    # because a normalized hash would be the wrong thing to replay: it is the
    # *processor's* bytes that the mapping is a claim about.
    StripeEvent:
      type: object
      required: [id, object, type, data]
      properties:
        id:
          type: string
          description: >-
            The processor's id for the event, UNIQUE in this service's
            `processor_webhooks` table. This is the whole of replay protection.
        object:
          type: string
          const: event
        type:
          type: string
          description: The processor's event type, e.g. `customer.subscription.updated`.
        created:
          type: integer
          description: >-
            Epoch seconds at which the event was created. This becomes the emitted
            event's `time` — when the state change happened, not when this service
            received it — which is what lets a consumer detect out-of-order
            delivery.
        livemode:
          type: boolean
        data:
          type: object
          properties:
            object:
              type: object
              description: The processor object the event is about. Untyped on purpose.

    # Which Stripe types this build acts on, and what each becomes. Documentation
    # of the mapping rather than a request or response shape: it is here so a
    # reader of the contract does not have to read the code to learn which events
    # are handled. Deliberately-ignored types are listed with the reason, so "we
    # chose to skip this" is visible without querying the table.
    #
    # `checkout.session.completed` appears twice on purpose: a session in payment
    # mode is the only record of that charge and becomes
    # `billing.payment.succeeded`, while a session in subscription mode restates
    # what `customer.subscription.created` says moments later and is ignored, so a
    # signup is not counted twice.
    #
    # The three subscription types do not map one-to-one onto the three cafaye ones,
    # and that is deliberate rather than an omission: the event is chosen from what
    # the delivery *did to the row*. A `customer.subscription.updated` that reports
    # `canceled` publishes `billing.subscription.canceled`; a
    # `customer.subscription.deleted` that arrives before the creation it belongs to
    # finds no row, creates a canceled one, and publishes
    # `billing.subscription.canceled` — and then the `created` that follows is
    # refused, because `canceled` is terminal. An update that changes nothing
    # publishes nothing, and is recorded on the delivery row as
    # `ignored:no_change_to_record` rather than as a failure.
    StripeEventMapping:
      type: object
      properties:
        handled:
          type: object
          additionalProperties:
            type: string
          example:
            customer.subscription.created: billing.subscription.started
            customer.subscription.updated: billing.subscription.updated
            customer.subscription.deleted: billing.subscription.canceled
            invoice.paid: billing.payment.succeeded
            invoice.payment_failed: billing.payment.failed
            checkout.session.completed (payment mode): billing.payment.succeeded
        ignored:
          type: object
          additionalProperties:
            type: string
          example:
            ping: connectivity_check
            checkout.session.completed (subscription mode): subscription_mode_is_restated_by_the_subscription_lifecycle
            any other type: unhandled_event_type

    # core's error envelope. `errors` appears only on a 422.
    Problem:
      type: object
      required: [type, title, status, detail, instance, code, trace_id]
      properties:
        type:
          type: string
          description: 'Stable URI: `https://docs.cafaye.com/errors/<code>`.'
          format: uri
        title:
          type: string
          description: A fixed summary for the code. May be reworded without a version bump.
        status:
          type: integer
        detail:
          type: string
          description: Specific to this occurrence. Not parsed by clients.
        instance:
          type: string
          description: The path the caller asked for.
        code:
          type: string
          description: The last segment of `type`, in snake_case.
        trace_id:
          type: string
          description: Matches the `X-Trace-Id` response header. Support starts here.
        errors:
          type: array
          description: Present only on a 422.
          items:
            type: object
            required: [field, code]
            additionalProperties: false
            properties:
              field:
                type: string
              code:
                type: string

  responses:
    # --- the two authentication refusals, on every `/v1` operation --------------
    #
    # Declared once and referenced by all fourteen client operations, for the same
    # reason the security scheme is: fourteen copies of a sentence about
    # authentication is thirteen chances for one of them to drift, and a document
    # saying `/v1/customers` needs a token and `/v1/plans` does not is worse than one
    # saying neither.
    Unauthorized:
      description: >-
        No bearer token, or one this service refused: malformed, not RS256, signed by
        a key `identity` does not publish, expired, issued to another audience, or
        carrying no `account_id`.

        **The body is one fixed sentence and names none of those.** Which of them it
        was is not something a caller learns by trying, and `detail` is the one
        free-text field that could say so. The specific reason goes to the log with
        the trace id the caller is handed.

        This is never a statement about a resource: another account's resource is a
        `404`, not a `401`, so a caller walking uuids learns nothing about which exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.cafaye.com/errors/unauthorized
            title: Unauthorized
            status: 401
            detail: This request needs a bearer token issued by this platform's identity service.
            instance: /v1/customers
            code: unauthorized
            trace_id: 0af7651916cd43dd8448eb211c80319c
    CallerIdentityUnavailable:
      description: >-
        **This service cannot verify anybody right now**: no issuer or audience is
        configured, or `identity`'s published key set cannot be reached.

        Deliberately not a `401`. A `401` would tell a caller holding a perfectly
        valid token to go and rotate it, which is the wrong instruction and sends an
        operator to the wrong system — the same reasoning the webhook uses for a
        missing signing secret.

        **An unconfigured deployment is locked, not open.** This is the answer to every
        `/v1` request in a service that has not been told how to verify a token, and
        it is the property the whole scheme exists to hold. The cause goes to the log
        with the trace id; the body names no environment variable, because an
        unauthenticated caller must not be able to read a deployment's configuration
        out of an error document.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.cafaye.com/errors/unavailable
            title: Service unavailable
            status: 503
            detail: This service cannot verify a caller right now.
            instance: /v1/customers
            code: unavailable
            trace_id: 0af7651916cd43dd8448eb211c80319c
    BadRequest:
      description: The body could not be read as JSON.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CursorInvalid:
      description: >-
        The cursor could not be read, or is older than 24 hours. A 400 rather
        than a 422 because a cursor is opaque and a client could not have known.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No record matches that identifier.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: >-
        The request collides with something that already exists: a duplicate
        customer, a duplicate slug, or an `Idempotency-Key` reused for a
        different body. Carries no `errors` array.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: One or more fields are wrong. `detail` names them.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProcessorUnconfigured:
      description: >-
        **Either** no API key is configured for the payment processor, **or** this
        service cannot verify the caller (see `CallerIdentityUnavailable`). Both are
        `503` because both are *this service's* misconfiguration and never the
        caller's, and one status per operation means this row has to name both.

        Deliberately not a 4xx in either case: telling a client its request was wrong
        when the service cannot reach Stripe at all — or cannot tell whether the token
        was good — sends an operator looking in the wrong place. The cause is logged
        with the trace id; the body does not carry the processor's own message, which
        is the processor's to decide who sees it, nor any environment variable name.

        An operation with no processor call of its own — every `GET`, every customer
        and plan write — answers `503` only for the second cause, and references
        `CallerIdentityUnavailable` instead.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.cafaye.com/errors/unavailable
            title: Service unavailable
            status: 503
            detail: The payment processor is not configured.
            instance: /v1/subscriptions/0198f1c2-7a41-7c3b-9d55-2f0b6a1e4c88/cancel
            code: unavailable
            trace_id: 0af7651916cd43dd8448eb211c80319c
    SignatureRejected:
      description: >-
        The signature did not verify, the signature header was missing, or the
        body was not an event. Nothing is stored. 400 rather than 422 because the
        sender could not have known its signing secret was wrong, and rather than
        5xx because a retry would fail identically.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.cafaye.com/errors/bad_request
            title: Bad request
            status: 400
            detail: The Stripe-Signature header did not verify against the request body.
            instance: /v1/webhooks/stripe
            code: bad_request
            trace_id: 0af7651916cd43dd8448eb211c80319c
    SigningUnconfigured:
      description: >-
        No signing secret is configured, so no signature can be checked. This is
        this service's misconfiguration and never the sender's fault; the body
        deliberately does not say the signature was invalid, because that would
        send an operator looking in the wrong place. The cause is logged.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.cafaye.com/errors/unavailable
            title: Service unavailable
            status: 503
            detail: Webhook signature verification is not configured.
            instance: /v1/webhooks/stripe
            code: unavailable
            trace_id: 0af7651916cd43dd8448eb211c80319c
