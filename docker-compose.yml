services:
  postgres:
    environment:
      KIT_POSTGRES_DATABASES: ${KIT_POSTGRES_DATABASES:-billing}

      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - "postgres"
      - "-c"
      - "fsync=off"
      - "-c"
      - "max_connections=${KIT_POSTGRES_MAX_CONNECTIONS:-200}"

  billing-migrate:
    build:
      context: .
    image: anywaye/billing:dev
    command: ["./bin/rails", "db:prepare"]
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://billing:${KIT_POSTGRES_PASSWORD:-anywaye}@postgres:5432/billing
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - platform

  billing:
    build:
      context: .
    image: anywaye/billing:dev
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      PORT: "3000"
      BINDING: "0.0.0.0"
      DATABASE_URL: postgresql://billing_app:${KIT_POSTGRES_PASSWORD:-anywaye}@postgres:5432/billing

      BILLING_OTEL_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_VERSION: "0.0.0-dev"

      DEPLOYMENT_ENVIRONMENT: development



    depends_on:
      postgres:
        condition: service_healthy
      billing-migrate:
        condition: service_completed_successfully
    networks:
      - platform
    restart: unless-stopped
