# billing's own compose file — an OVERRIDE, not a copy.
#
#   bin/dev            # fetch the pinned kit stack, merge it with this file, up
#   bin/dev down       # stop, keep the data
#   bin/dev nuke       # stop, and throw the volumes away
#   bin/dev stack      # print the two files and the merged result, and start nothing
#
#   docker compose --project-directory . \
#     -f <kit>/templates/compose/docker-compose.yml \
#     -f ./docker-compose.yml up -d --wait
#
# This file replaces the 60-line postgres service that used to live here, and that
# is the point of adopting kit's stack rather than copying it.
#
# WHY THERE IS NO `db:` CONTAINER HERE ANY MORE, and it is the first thing a
# reader will look for. kit's stack already ships a postgres:17-alpine, and a
# second copy is two postgres majors to upgrade and a port collision for the second
# developer on the machine. billing's own database and its role are named in ONE
# environment key on kit's `postgres` service, which is an ENVIRONMENT override —
# the one kind compose merges per key, so kit's own `POSTGRES_*` defaults survive
# for anything not named here and the cluster keeps an identity of its own.
#
# WHAT THIS FILE MAY NOT DO, and the collector is the reason
#
#   It may not touch `otel-collector`. Not its image, not its command, and above
#   all not the `volumes:` entry that mounts `otel-collector.yml`. That file
#   carries the redaction allowlist, which kit DERIVES from core's schemas; a
#   service that owned it would be shipping a telemetry boundary nobody derived,
#   and a webhook body or a customer's email would leave the process inside it.
#   kit's `tests/fleet_check.py` fails this repository over any of the three, and
#   the moment `kit.ref` exists below, that failure has no discretion left in it.
#
#   It may not publish a port on a service kit already ships. `ports:` is a LIST,
#   and a second compose file's list is APPENDED rather than substituted — so
#   billing writing `ports: ["5432:5432"]` under `postgres` would leave postgres
#   listening on kit's port AND on 5432. Move a published port with its VARIABLE
#   (`KIT_POSTGRES_PORT=…` in `.env`) or not at all. This is why the host-side
#   suite reaches its database the way it always did and `bin/dev` reaches
#   billing's over the compose network by service name.
#
# WHY THERE IS NO `depends_on: otel-collector`, and it is load-bearing
#
#   Nothing but the collector may be in a readiness path. A service that waits for
#   the collector serves no traffic while the collector is down, which is strictly
#   worse than serving traffic with no traces — and it teaches people to switch
#   telemetry off, which is the opposite of what this file is for. kit's gate fails
#   on a `depends_on` naming the collector, and its
#   `tests/no_telemetry_in_readiness.sh` proves the property against a real
#   collector by killing it and showing the service still serving.
#
#   The same rule is why the OTLP exporter has no retry: a collector that is not up
#   yet is the normal state of a fresh `bin/dev up`, and the service must not care.
services:
  # kit ships the postgres CLUSTER: one database and one role per service,
  # created by `initdb/10-cluster.sh` on a fresh volume, with
  # `REVOKE ALL ON DATABASE … FROM PUBLIC` applied to every database in it.
  # billing's whole of that is ONE line of environment. The three lines that used
  # to sit above it were the reason this file could not move onto kit `f6d3b74`.
  postgres:
    environment:
      # `KIT_POSTGRES_DATABASES` is the single place billing's database AND its
      # role come from — one entry here becomes one `CREATE ROLE … LOGIN
      # NOSUPERUSER NOCREATEDB` and one `CREATE DATABASE … OWNER` in the init
      # script. It is named here rather than left to kit's default because kit
      # deliberately has none: the fetched file spells it `${KIT_POSTGRES_DATABASES}`
      # with no `:-`, and `10-cluster.sh` opens with `:?` on it, so a service that
      # declares nothing is refused by a message that names the fix — "Name the
      # services, comma-separated" — rather than served a healthy cluster holding
      # some other service's database. A default in shared infrastructure that
      # names a tenant is the same defect one layer up.
      #
      # It is `${…:-billing}` and NOT a committed literal `billing`, and the `:-`
      # is the part that matters. This is the ONE key anybody has to extend to put
      # a second service on this cluster, and it is a LIST. Measured on this stack
      # with `KIT_POSTGRES_DATABASES=billing,neighbour` and nothing else changed:
      #
      #   [cluster] provisioning billing
      #   [cluster] billing: CREATE EXTENSION IF NOT EXISTS vector
      #   [cluster] provisioning neighbour
      #   [cluster] neighbour: CREATE EXTENSION IF NOT EXISTS vector
      #   [cluster] done: 2 service database(s), one role each, PUBLIC holds
      #                   CONNECT on none of them
      #
      # A literal `billing` here could only be extended by editing this file and
      # re-reviewing it, which would make "one shared cluster, nine services" a
      # description rather than something a stack could do. `.env` beats a compose
      # default — which is exactly why the committed value has to be a default and
      # not a fact, and why kit's `.env.example` ships the key EMPTY.
      KIT_POSTGRES_DATABASES: ${KIT_POSTGRES_DATABASES:-billing}

      # THE THREE KEYS THIS BLOCK DOES NOT SET. All of them were here until kit
      # `f6d3b74`, and all three describe the CLUSTER rather than the service:
      #
      #   POSTGRES_USER     the cluster's ADMINISTRATOR. The official image
      #                     creates it as a superuser, and the init script's
      #                     closing sweep grants CONNECT on every database in the
      #                     cluster to `current_user` — so a service whose
      #                     POSTGRES_USER is its own name becomes a role that can
      #                     open every other service's database. Isolation by
      #                     privilege is what makes one shared cluster safe;
      #                     isolation by superuser is the absence of it, wearing
      #                     the same green health check.
      #
      #                     And it never gets that far. Measured, this block's three
      #                     old keys restored on top of kit `f6d3b74` with
      #                     `KIT_POSTGRES_DATABASES=billing` set, so that the test
      #                     isolates them rather than tripping over the missing
      #                     declaration:
      #
      #                       $ docker logs <container>
      #                       running /docker-entrypoint-initdb.d/10-cluster.sh
      #                         [cluster] provisioning billing
      #                       ERROR:  role "billing" already exists
      #                       STATEMENT:  CREATE ROLE "billing" LOGIN NOSUPERUSER
      #                                 NOCREATEDB NOCREATEROLE NOREPLICATION
      #                                 PASSWORD 'billing';
      #                       $ docker ps -a --filter name=<container>
      #                       Exited (3)
      #
      #                     The image created that role before any init script was
      #                     sourced, so `CREATE ROLE` collides with it and
      #                     `ON_ERROR_STOP=1` turns the collision into a cluster
      #                     that will not finish initdb.
      #
      #   POSTGRES_DB       the cluster's ADMINISTRATION database — it holds
      #                     cluster administration state and no service's rows.
      #                     Created by the image before any init script is
      #                     sourced, for the same reason as the role above, so
      #                     `CREATE DATABASE billing` would find it already there.
      #                     That one is the reasoning rather than the measurement:
      #                     in the run above `CREATE ROLE` is what fails first.
      #
      #   POSTGRES_PASSWORD the credential of EVERY role `10-cluster.sh` creates,
      #                     so a per-service value is a claim about two things at
      #                     once. It is the only one of the three that does not
      #                     stop the cluster starting — what it does is make one
      #                     service's file decide a credential every other service
      #                     on the cluster authenticates with. kit already exposes
      #                     it as `KIT_POSTGRES_PASSWORD` in `.env`, which is where
      #                     an operator sets it, and `DATABASE_URL` below
      #                     interpolates that same variable instead of hard-coding
      #                     a pair.
      #
      # kit's `tests/fleet_check.py` fails this repository over any of the three.
      # Measured on kit `worker/kit-29`, where `check_override_surface` is not on
      # master yet, against this file at `master` and against this file as it
      # stands: the old shape is three findings and exit 1, this one is `PASS
      # fleet` and exit 0.
      #
      # WHAT THE REMOVAL BUYS, measured on this stack at the same ref with a
      # two-entry list. billing is not an administrator; it owns one database and
      # is refused at the door of the other:
      #
      #   select rolname, rolsuper, rolcreatedb from pg_roles
      #    where rolname in ('cafaye','billing','neighbour');
      #    rolname   | rolsuper | rolcreatedb
      #   -----------+----------+-------------
      #    billing   | f        | f
      #    cafaye    | t        | t
      #    neighbour | f        | f
      #
      #   $ psql -U billing -d billing     -tAc "select current_user, current_database()"
      #   billing|billing
      #   $ psql -U billing -d neighbour  -tAc "select current_user, current_database()"
      #   psql: error: connection to server on socket … failed: FATAL:
      #         permission denied for database "neighbour"
      #   DETAIL:  User does not have CONNECT privilege.
      #
      # and the admin role this file no longer takes over reaches all of them,
      # which is the whole of what it was giving away:
      #
      #   $ psql -U cafaye -d neighbour   -tAc "select current_database()"
      #   neighbour
      #
      # Trust auth, and it is spelled out because kit does not default it. This is a
      # local-only database, and a prompt-free connection keeps `db:prepare` from
      # ever hanging on input that nobody is there to type. It was explicit on the
      # container this service used to own and it is explicit here for the same
      # reason: an authentication default that changes because a
      # base image changed is an authentication change nobody reviewed.
      POSTGRES_HOST_AUTH_METHOD: trust
    # `fsync=off` is acceptable here and nowhere else. kit's volume is scratch space
    # on a laptop; durability costs seconds on every write in the suite and buys
    # nothing that `bin/dev nuke` does not throw away anyway.
    #
    # THIS IS A LIST, AND IT REPEATS KIT'S OWN ARGUMENTS, which is the whole
    # reason it looks redundant. Compose's `command` REPLACES rather than merges,
    # and it replaces the entire value whatever shape that value has — so the
    # scalar this used to be,
    #
    #     command: "-c fsync=off"
    #
    # did not add `fsync=off` to kit's command. It deleted kit's command. Measured
    # on the merged config, not inferred:
    #
    #     $ docker compose -f kit/…/docker-compose.yml -f ./docker-compose.yml config
    #     …
    #       command:
    #         - -c
    #         - fsync=off
    #
    # Two things are gone, and the second is the dangerous one:
    #
    #   1. `postgres` — the entrypoint argument the image needs to start in
    #      server mode rather than printing usage and exiting.
    #   2. `-c max_connections=${KIT_POSTGRES_MAX_CONNECTIONS:-200}` — the
    #      connection budget kit raises precisely so that ONE cluster can carry
    #      the whole fleet. Losing it reverts the cluster to Postgres's default
    #      100, silently, and only for whichever service happens to override
    #      `command` at all.
    #
    # That second one is a fleet-shaped defect wearing a local costume. The
    # budget for nine services is (9 tenants x 10) + 8 = 98, which fits inside
    # 200 with room to spare and does NOT fit inside 100 alongside kit's
    # reserved slots. So the override did not merely lose an optimisation — it
    # removed the headroom that the shared-cluster plan depends on, and it did
    # so in the one file whose green health check says the cluster is healthy.
    #
    # So kit's arguments are repeated here verbatim rather than appended, and the
    # repetition is the cost of compose having no merge for this key. If kit's
    # command ever changes, this line is the thing that goes stale — which is why
    # it names kit's setting rather than a literal 200, and why the gate checks
    # that this service still declares a connection budget at all.
    command:
      - "postgres"
      - "-c"
      - "fsync=off"
      - "-c"
      - "max_connections=${KIT_POSTGRES_MAX_CONNECTIONS:-200}"

  billing:
    build:
      context: .
    image: cafaye/billing:dev
    # A literal, and NOT a `${KIT_*:default}` — this is billing's OWN port, not one
    # of kit's. kit's port block is a statement about the shared infrastructure, and
    # 3000 is what a Rails API defaults to and what billing's own documented port
    # is; moving it is a change to a published contract, not a compose edit.
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      PORT: "3000"
      # Over the compose network, by service name. The host mapping above is for the
      # developer and the host-side suite.
      #
      # The password is INTERPOLATED, and it used to be the literal `billing` to
      # match a `POSTGRES_PASSWORD: billing` this file no longer sets. Every role
      # `10-cluster.sh` creates takes the cluster's `POSTGRES_PASSWORD`, so that
      # role's password is now kit's `${KIT_POSTGRES_PASSWORD:-cafaye}` and the
      # pair in this URL would have been a credential no role holds. A cluster
      # password changed in `.env` cannot leave this file authenticating as a
      # password that no longer exists. (A password containing `@` or `/` will not
      # survive URL interpolation unescaped; that is the cost of a URL string, and
      # it is not worth a percent-encoder to keep a development default out of a
      # comment.)
      #
      # The role is `billing` and NOT the cluster's administrator: the init script
      # creates it `LOGIN NOSUPERUSER` and owns the `billing` database with it, and
      # that is the whole of billing's credential on this cluster. It is also the
      # credential that is refused at the door of every other database in it.
      #
      # The database name is a LITERAL rather than the `:-billing` above, and
      # deliberately so: the name here has to match the ROLE name, and the role
      # name is the first entry of a list. Interpolating the list would hand a
      # comma-separated string to a URL path.
      DATABASE_URL: postgresql://billing:${KIT_POSTGRES_PASSWORD:-cafaye}@postgres:5432/billing

      # ---------------------------------------------------------------------
      # OBSERVABILITY, ON BY DEFAULT
      #
      # One variable, and it is the only contract (core D16). Unset it and the
      # collector that ships with the stack is the default — that is the whole of
      # "a deployer gets traces without assembling them". Point it at any OTLP
      # endpoint and billing exports there instead.
      #
      # It is declared here, in the service's own file, rather than defaulted in the
      # Ruby code alone, so a reader of this file can see where telemetry goes
      # without reading the source. `Kit::Telemetry::DEFAULT_ENDPOINT` is the same
      # value, and `test/observability/telemetry_test.rb` holds the two to one.
      BILLING_OTEL_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_VERSION: "0.0.0-dev"

      # `tenant_id` goes on the RESOURCE, never on a measurement. Unset by default: a
      # single-tenant development stack has no tenant to name, and an empty one would
      # show up as a second service row in every collector's service list.
      # BILLING_TENANT_ID: ""
      #
      # `deployment.environment` is an ENUM in core's resource schema
      # (development/test/staging/production), so `local` is not one of the four.
      DEPLOYMENT_ENVIRONMENT: development

      # The processor's keys. billing REFUSES to boot without them (the webhook path
      # answers 503 and the API path answers 422 rather than inventing a processor),
      # so there is deliberately no development default: a value in version control
      # is a credential in version control, and `test_…` here is a shape, not a key.
      # STRIPE_API_KEY: "${STRIPE_API_KEY:?set STRIPE_API_KEY, or run: bin/rails console and mint a test key}"
      # STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:?set STRIPE_WEBHOOK_SECRET — see README.md}"

    # THE CRASH LAYER, and it is the reason a panic reaches an operator with no
    # per-language log SDK in the Gemfile.
    #
    # Every one of the six languages writes a fatal error to stderr; in a container
    # that is the log stream. Docker's `syslog` driver ships it over the compose
    # network to the collector's `syslog/crash` receiver, which makes a panic a log
    # record with a `service.name` on it and no per-language dependency at all.
    #
    # `syslog` rather than `filelog` on `/var/lib/docker/containers`, and that is a
    # portability decision with a history: the filelog form works on a Linux host and
    # does not work at all under Docker Desktop or OrbStack, where the daemon's
    # filesystem lives inside a VM the host cannot bind-mount without asking for a
    # shared directory. The syslog driver delivers the same bytes from the same place
    # on every platform.
    #
    # NO HOST PORT, and the receiver it talks to is not published either. A syslog
    # receiver on the host loopback is an unauthenticated log-injection point for
    # anything else on the machine.
    #
    # `tag` is the process identity the collector promotes to `service.name` when a
    # record has none — see `transform/cafaye_logs`. It has to match the service name
    # or a crash is filed against `unknown`.
    # NO LOG-DRIVER OVERRIDE. See the identical note in identity/docker-compose.yml
    # for the full argument; the short form is that `syslog` makes the DOCKER
    # DAEMON resolve `otel-collector`, in the host namespace, where container
    # names do not exist:
    #
    #   failed to initialize logging driver: dial tcp: lookup otel-collector:
    #   0.250.250.200:53: no such host
    #
    # The container never starts, so the crash layer is unreachable precisely
    # when it is needed. It does not degrade, it prevents.
    #
    # The panic still reaches an operator. Every language writes a fatal error to
    # stderr, `json-file` captures it, and `docker logs` shows it — on every host,
    # with no DNS involved.
    #
    # And the collector runs an `otlp` LOGS receiver on 4317/4318, so this
    # service's existing OTel SDK (opentelemetry-sdk is already a dependency)
    # can ship logs there over OTLP, resolved INSIDE the container network where
    # the embedded DNS answers. Same receiver, same bytes, and it does not depend
    # on the daemon's resolver.
    #
    # `tag: "billing"` had one job: the collector's `transform/cafaye_logs`
    # promotes it to `service.name` when a record carries none. OTLP log records
    # carry `service.name` from the SDK's resource attributes instead, so nothing
    # is lost on that axis either.

    # The database, and ONLY the database. Not the collector, for the reason at the
    # top of this file.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
