# Migration Job — runs bin/migrate before the Deployment starts.
# Hooked as a pre-install/pre-upgrade so the schema is ready before the
# new pod starts serving.
apiVersion: batch/v1
kind: Job
metadata:
  name: billing-migrate
  labels:
    app.kubernetes.io/name: billing
    app.kubernetes.io/instance: billing
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets }}
      containers:
        - name: migrate
          {{- if .Values.image.digest }}
          {{- if not (regexMatch `^sha256:[0-9a-f]{64}$` .Values.image.digest) }}
          {{- fail (printf "chart: image.digest is %q, not sha256:<64 hex>." .Values.image.digest) }}
          {{- end }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/rails/bin/migrate"]
          envFrom:
            # Boot-time environment (SECRET_KEY_BASE, etc.) comes from the
            # runtime secret; the owner secret is layered last so its
            # DATABASE_URL overrides the _app credential for migrations.
            - secretRef:
                name: {{ .Values.secretName | default "billing-secrets" }}
            {{- if and .Values.migrationSecretName (ne .Values.migrationSecretName .Values.secretName) }}
            - secretRef:
                name: {{ .Values.migrationSecretName }}
            {{- end }}
