# Migration Job — runs bin/migrate before the Deployment starts.
# Hooked as a pre-install/pre-upgrade so the schema is ready before the
# new pod starts serving.
apiVersion: batch/v1
kind: Job
metadata:
  name: billing-migrate
  labels:
    app.kubernetes.io/name: billing
    app.kubernetes.io/instance: billing
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/rails/bin/migrate"]
          envFrom:
            - secretRef:
                name: {{ .Values.secretName | default "billing-secrets" }}
