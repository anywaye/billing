---
# billing's CI: kit's shared workflow, plus the half kit cannot own.
#
# Read the job names as the claims this workflow makes, because in this
# repository the claim is load-bearing: billing computes what a customer is
# charged, and it ingests webhooks from a payment processor that will not
# re-send what it has already sent. A green run here is a claim about money.
#
#   ruby (kit)  kit's reusable workflow, called. The shared half — install and
#               lint from one file, so a fix in kit reaches billing on the next
#               run without a per-repo PR. **Expected red on two steps**; the
#               reason is written out under WHAT IS EXPECTED TO BE RED.
#   gate        THE gate: `bin/prime` against a real Postgres, with every
#               environment-gated tier forced on and counted, and the lockfile
#               guard.
#   security    brakeman and bundler-audit.
#   pins        the configuration claims: one Ruby number in three files, the
#               documented `uses:` path, and no secret anywhere in this file.
#               No toolchain and no database, so it fails in seconds.
#
# THE BASELINE THIS FILE HOLDS
#
#   **1143 runs, 3278 assertions, 0 failures, 0 errors, 0 skips** — measured on
#   this branch, with the event-payloads packet's recipient fact on top of the
#   receipts packet's charge and receipt, billing-21's authorization,
#   the observability packet's 48 tests, billing-13's three cross-tenant fixes,
#   billing-08's hardening, billing-09's race fix and billing-12's tenant
#   isolation. The numbers below are that line, asserted.
#
# **+48 runs / +118 assertions is the whole of the observability packet**, and it
# is itemised so a reviewer does not have to reconstruct it either:
#
#   - **+12 — `test/observability/allowlist_test.rb`.** The span-attribute
#     allowlist asserted on directly: no name carries a word that names content, a
#     name off the list is DROPPED, a `nil` value is dropped, and `error.type` is
#     validated against a CLOSED vocabulary rather than only against its own name.
#   - **+8 — `test/observability/telemetry_test.rb`.** The contract: one endpoint
#     variable with kit's collector as its default, that default stated in
#     `docker-compose.yml` too, an exporter name that is a closed vocabulary and
#     RAISES on anything else, and a startup line that says why on the disabled
#     path as well as the enabled one.
#   - **+16 — `test/observability/request_span_test.rb`.** The span itself, through
#     the REAL router: one span per request, the method and the status, the route
#     TEMPLATE (and the four distinct reasons `/v1/plans/:slug` and
#     `/v1/plans/:id` must not collapse), no route on a 404, no error status on a
#     404 or a 422, an error status and a closed `error.type` on a 500, no
#     exception EVENT on a raised span, the resource omitting every value nobody
#     configured, and a root span actually being sampled.
#   - **+12 — `test/observability/canary_test.rb`.** THE PROOF: a canary in a
#     request body, a path, a slug, a query string, four headers, a signed webhook
#     body and a malformed `traceparent`, asserted absent from everything exported,
#     plus the propagation half — a well-formed `traceparent` becoming the span's
#     parent without its header being copied.
#
# Nothing existing changed: the two deltas are the same delta, because the only
# difference between the two runs is the new directory.
#
# The packet before that, master at `8bbbcec` was 913 / 2598 and billing-13 was
# **+37 runs / +126 assertions**, itemised here so the whole line stays readable:
#
#   - **+8 — billing-13's two index tests.** `customer_processor_customer_id_migration_test.rb`
#     and `plan_processor_price_id_migration_test.rb`, five tests each, in files of
#     their own because running a migration commits the enclosing transaction.
#   - **+6 — the `account_mismatch` refusal.** Six tests on the seventh
#     `Subscriptions::Refused` reason, and the three that matter are the
#     same-account delivery still being applied, a first delivery not being a
#     mismatch, and the row changing no column.
#   - **+5 — the uniqueness API contract.** Three on `Customer`, three on `Plan`,
#     and the four request tests that a colliding `processor_customer_id` or
#     `processor_price_id` is a 409 naming the field. **No existing webhook test
#     broke**; see `REPORT-billing-13-fixes.md`.
#   - **+8 — the fixture drift-guard** in `test/coverage/`, and the four
#     request/model tests that pinned the helper change it guards. The helper
#     change is the part worth reading about: giving the helpers one `cus_` and one
#     `price_` between them was an F2/F3 collision, and the two new unique indexes
#     turned 85 passing tests in one file into 85 errors.
#   - **+1 — the HTTP edge** for a refused cross-account delivery, in the webhook
#     tier, which is why that tier's count moved too.
#   - **+9 — the findings tests, rewritten rather than added to.** billing-12's six
#     are the same six: same two accounts, same delivery, same `PATCH`, same pair
#     of plans, with the assertion flipped from "the defect reproduces" to "the
#     defect is refused". Two of the eight in that file are new, and the six
#     rewritten ones are not double-counted here.
#
# The prior history, for a reader who wants the whole line: master at `e63bb7a` was
# 763 / 2100, and billing-08, billing-09 and billing-12 took it to 913 / 2598. The
#   whole difference of that stretch, so that a reviewer does not have to
#   reconstruct it:
#
#   - **+62 runs, +230 assertions — billing-12's tenant isolation.** Four new
#     files under `test/tenant/` (20 + 18 + 16 + 8 runs, 45 + 55 + 101 + 29
#     assertions) and one new support module that contributes no tests of its own.
#     The 20 are the derived entry-point matrix, which reads `app/` and compares
#     the classification in both directions; the other 42 are negative tests, four
#     of which reproduce the cross-tenant defects that packet reports rather than
#     fixing. The packet's own count — entry points, negative tests, per-operation
#     — is asserted in those files and in `REPORT-billing-12-isolation.md`.
#   - **+45 runs, +99 assertions — billing-08's hardening.** The tenant-isolation
#     matrix and the secrets-do-not-leak file are new files (19 and 10 runs);
#     the non-object webhook bodies (9) and the money-precision cases (13) extend
#     files that already existed.
#   - **+7 runs — the stale-delivery guard.** Seven tests pinning both directions
#     of `stale_delivery`, including the equal-timestamp case a naive `<=` gets
#     wrong.
#   - **+34 runs, +65 assertions — the race fix and what it uncovered.** The
#     outbox constraint (9 in `outbox_event_test.rb`, 5 in its own migration
#     test) and the barrelled `concurrent_delivery_test.rb` (10) are new files;
#     billing-09 also found that three test helpers delivered under an event id
#     their own payload did not carry, which the new unique index turned from a
#     silent lie into a loud failure — 4 tests, and 2 more pinning that a
#     uniqueness failure is classified as the duplicate it is rather than parked
#     as a failure.
#   - **−1 run — `test/probe_test.rb` deleted.** It printed diagnostics and had
#     zero assertions, so it inflated the run count and proved nothing.
#
#   billing-07 was the packet before this one, and it split the contract tier in
#   two: the HTTP-surface tests moved out of `outbox_envelope_contract_test.rb`
#   into a new `test/contract/http_surface_contract_test.rb`. The envelope file
#   therefore has 19 tests where it had 22, and the *directory* is 45 — which is
#   why the contract tier below is named as a directory and not as a file list. A
#   file list is what let a relocation look like a deletion.
#
#   They are **decrease detectors, not targets**. A green run means nothing was
#   deleted, skipped or excluded since they were measured. Adding a test turns
#   this workflow red until the number is raised, which is the intended
#   direction: a suite that grew and did not say so is a suite nobody counted,
#   and the number a gate prints is the only thing standing between "the suite
#   passed" and "the suite is smaller than it was".
#
# WHY THE COMPANION JOBS CANNOT LIVE IN THE SHARED WORKFLOW
#
#   kit is configuration, and a step that knows what billing needs in order to be
#   tested at all is not configuration — it is billing. Specifically:
#
#   1. A database. billing's suite cannot start without PostgreSQL: `rails test`
#      opens a connection while maintaining the test schema, so a runner with no
#      postgres aborts before the first test — 0 of 851, exit 1. A caller cannot
#      hand a reusable workflow a service container at all: GitHub allows only
#      `name`, `uses`, `with`, `secrets`, `strategy`, `needs`, `if`, `concurrency`
#      and `permissions` on a job that calls one, so `services:` is not reachable
#      from here. kit must not hard-code a database either, or the services that
#      are not billing inherit one.
#   2. `core` on disk. `test/contract/` reads core's real schemas rather than
#      restating them, and skips when core is not there — 20 tests and 343
#      assertions, gone, and the summary line would still read green. A step
#      that reaches into another cafaye repository is out of kit's scope by
#      design.
#   3. The gate is a repository command, not a workflow concept. `bin/prime` is
#      what a developer runs. A shared workflow that retyped those three steps
#      would be a second gate, and a second gate is a second thing to be wrong.
#   4. The tier counts are billing's numbers in billing's tree. No other
#      repository has 22 contract tests, a 138-test webhook tier, a 97-test
#      money table or a 48-test redaction tier. The observability tier is the
#      clearest case of why: it exists to prove that this service's OWN redaction
#      boundary held on this run, which is a claim about billing's tree and about
#      nothing kit ships.
#   5. `brakeman` and `bundler-audit` are two dev/test gems in *billing's*
#      Gemfile, at versions billing's `Gemfile.lock` pins, run with thresholds
#      billing chose in `mise.toml`. kit owns seven language jobs and cannot
#      know which service ships a scanner; and `bundler-audit check --update`
#      needs the network and a writable advisory database, which is a step with a
#      failure mode of its own rather than a convention.
#   6. The lockfile guard is `Gemfile.lock`, and only billing can say so.
#
# WHAT IS EXPECTED TO BE RED, AND WHY THE WORKFLOW IS STILL GREEN
#
#   The `ruby (kit)` job fails, on two steps, for reasons that live in kit's file
#   and not in this one. Both were reproduced against **kit's own master**, at
#   `4fe04fd9`, whose `ruby` job is byte-for-byte the one this file calls:
#
#   - `test` runs a bare `bundle exec rake`, whose default task in a Rails
#     application is `test`. kit's ruby job declares no `services:` and sets no
#     `DATABASE_URL`, so the connection is refused and the step dies before the
#     first test:
#       PostgreSQLAdapter#new_client: There is an issue connecting with your
#       hostname: 127.0.0.1. (ActiveRecord::DatabaseConnectionError)
#     No job anywhere in kit's workflow declares a service container, and a
#     caller cannot add one: GitHub allows only `name`, `uses`, `with`,
#     `secrets`, `strategy`, `needs`, `if`, `concurrency` and `permissions` on a
#     job that calls a reusable workflow. This is the structural reason the gate
#     is a companion job and not this one, and it will not change from here.
#   - `coverage` runs `bundle exec rake coverage`. billing has no `coverage`
#     task, and does not want one: billing's coverage gate is 100% line *and*
#     branch on the two files in `MoneyPathsCoverageTest::MONEY_PATHS`, measured
#     with the standard library's `Coverage` inside a subprocess, and it runs
#     inside `bin/prime` (PLAN §3). A whole-repository percentage would be a
#     second and weaker gate wearing the first one's name, and
#     `money_path_inventory_test.rb` is what keeps the real one honest.
#       rake aborted!
#       Don't know how to build task 'coverage'
#   - `install` may additionally need `libpq-dev` and `libvips`, which kit's ruby
#     job does not install. **Unverified** — it depends on what the runner image
#     happens to carry, and this worktree had no Linux runner. The `gate` job
#     installs them explicitly, which is what the pre-kit workflow in this
#     repository did and is the only reason master was green.
#
#   So the tests are run in `gate`, the money-path coverage gate is enforced in
#   `gate`, and this job is left as the call kit documents.
#
#   **The two failures are absorbed by `continue-on-error: true` on the job, and
#   the required checks are `gate`, `security` and `pins`.** That is a decision
#   with a real cost — the shared workflow is not currently a gate for this
#   repository, only a call — and the cost is paid knowingly rather than
#   discovered. The condition for retiring it is checkable and is written down at
#   the job: kit's `ruby` job grows a `services:`/`env` seam, **and**
#   `rake coverage` exists here or kit stops running it. When both hold,
#   `continue-on-error` goes and this job becomes a required check in the same
#   commit. Until then it buys the guarantee that a kit fix reaches billing
#   without a per-repository pull request, which is the thing the call is for.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  # "Prove it runs": `gh workflow run ci` re-runs everything on demand, and it is
  # the only way to run this on a branch that has no pull request.
  workflow_dispatch:

# Least privilege for the whole file. kit's reusable workflow declares the same,
# and a caller should not widen what it is granted by accident.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # master at 8bbbcec was 913 / 2598; this commit is billing-13, which fixes the
  # three cross-tenant defects billing-12 proved: +37 runs and +126 assertions. The
  # gate asserts 950 runs / 2724 assertions / 0 failures / 0 errors / 0 skips
  # against this, and every tier below carries its own count. Raising a number is
  # allowed; lowering one is not.
  #
  # **The tiers are measured by directory, and that has a consequence worth
  # knowing before adding a test anywhere.** `test_helper.rb` requires *all* of
  # `test/support/**/*.rb`, so a `_test.rb` file living in `test/support/` is loaded
  # into **every** tier that names any other path — the contract tier's 45 runs
  # became 53, and the webhook tier's 150 became 159, for a file that has nothing
  # to do with either. billing-13 hit this with its fixture drift-guard and moved
  # the file to `test/coverage/` to get it out of the glob. **Put a test in the
  # directory of the thing it tests, not in `test/support/`.** The support directory
  # is for modules, and a module in it is what every other test file is entitled to
  # load.
  # 950/2724 -> 998/2842. The whole of the difference is the 48 tests in
  # `test/observability/` and the 118 assertions they make, measured on this branch
  # by `bin/rails test test/observability` and by `bin/prime` — not by predicting
  # them. Not one existing test changed, which is why the two deltas are the same
  # delta in both directions: 48 and 118 are the two new numbers, and nothing else
  # moved.
  #
  # 998/2842 -> 1077/3064. **billing-21, and this delta is NOT all new tests**,
  # so it is itemised per file, measured by running each file before and after
  # rather than by reading the diff:
  #
  #   file                                    before       after       delta
  #   test/authentication/ (2 new files)      --  /  --    66 / 180   +66 / +180
  #   test/contract/http_surface_contract_test  7  /  19    12 /  32    +5 /  +13
  #   test/contract/tenant_isolation_matrix    19  /  42    21 /  49    +2 /   +7
  #   test/tenant/cross_account_web_test       16  / 101    23 / 133    +7 /  +32
  #   test/requests/v1/plans_test              28  / 156    30 / 161    +2 /   +5
  #   test/requests/v1/customers_test          30  / 175    27 / 160    -3 /  -15
  #   (unchanged: account_entry_point_matrix, cross_account_findings,
  #    subscriptions, secrets_do_not_leak — 0 / 0 on both sides)
  #                                          ----  ----   ----  ----   ----  ----
  #                                           998 / 2842 1077 / 3064  +79 / +222
  # is a reading of the diff rather than a prediction of the total.
  #
  # **The negative line is the one to read.** `customers_test.rb` lost three
  # tests and fifteen assertions: `bulk_customers` went, because an account's
  # customer listing holds at most one row — `(owner_type, owner_id, processor)`
  # is unique and the owner is now the token's account — so a "three customers"
  # fixture cannot exist as a listing expectation. The paging tests moved to
  # `plans_test.rb`, where the catalogue actually pages. **A suite that only ever
  # grows is a suite in which a deleted assertion is invisible**, and this delta
  # says out loud that tests asserting `/v1` is open were removed and replaced.
  #
  # **The `+7` in `cross_account_web_test.rb` is the four `gap:` tripwires plus
  # three structural meta-tests.** The two new meta-tests are billing-12's
  # coupling pointed the other way: `account_scoped_queries` is now asserted to
  # be **exactly 4**, so dropping either `for_account` scope is a failure rather
  # than a silent narrowing of the boundary. Both guards this packet added were
  # wrong on first write and were caught by mutation, not by review; see
  # CHANGELOG.md.
  #   test/services/checkout/session_test.rb  --  /  --   16 /  68   +16 /  +68
  #   test/coverage/money_path_inventory_test 20  /  35   21 /  42     +1 /   +7
  #                                          ----  ----   ----  ----   ----  ----
  #                                          1078 / 3082 1095 / 3157   +17 /  +75
  #
  # 1095/3157 -> 1134/3264. **The receipts packet**: a `Charge` model, a webhook
  # recorder, and the receipt route. Three new test files, measured by running
  # each on its own:
  #
  #   file                                    before       after       delta
  #   test/models/charge_test.rb              --  /  --    14 /  29   +14 /  +29
  #   test/services/webhooks/charges/         --  /  --    11 /  26   +11 /  +26
  #     recorder_test.rb
  #   test/requests/v1/charges_test.rb        --  /  --     8 /  41    +8 /  +41
  #   (contract-test edits from the recovery  --  /  --    --  /  --    +6 /  +11
  #    commits, measured in the full suite)
  #                                          ----  ----   ----  ----   ----  ----
  #                                          1095 / 3157 1134 / 3264  +39 / +107
  #
  # **The checkout row was measured WITHOUT `core` on disk**, so it is a delta and
  # not a total: `test/contract/` skips 19 tests and ~284 assertions without a core
  # checkout, and those are counted on both sides of the table above or on neither.
  # The delta is exact — the two files were run on their own before and after — but
  # the total is `gate`'s to confirm, and a `gate` failure naming a different pair
  # of numbers is this commit being wrong about arithmetic, not a lost test.
  # 1134/3264 -> 1143/3278. **The event-payloads packet**: the recipient fact on
  # the money events and the plan's name on the subscription events. Two files,
  # measured by running each on its own before and after:
  #
  #   file                                    before       after       delta
  #   test/services/webhooks/stripe_events    33  /  70    37  /  76    +4 /   +6
  #     _test.rb
  #   test/services/subscriptions/             82  / 144    87  / 152    +5 /   +8
  #     lifecycle_test.rb
  #                                          ----  ----   ----  ----   ----  ----
  #                                          115 / 214 122 / 228    +9 /  +14
  #
  # **Nothing existing was weakened.** The one assertion that changed shape is
  # the lifecycle's exact-key-set pin, which grew to include the two new fields
  # — the test doing its job, not a loosened one. The contract test's
  # `PENDING_PAYLOAD_ALIGNMENT` table and the tenant matrix's counts moved with
  # the payloads, as they exist to.
  #
  # 1143/3278 -> 1145/3280. **The tenancy declaration packet (TG-A4).** Two tests,
  # both in `test/authentication/principal_lock_test.rb`, one assertion each,
  # measured by running that file on its own before and after:
  #
  #   file                          before       after       delta
  #   test/authentication/          36  / 106    38  / 108   +2 /   +2
  #     principal_lock_test.rb
  #                                ----  ----   ----  ----   ----  ----
  #                                36  / 106    38  / 108   +2 /   +2
  #
  # They are not filler. The tenancy declaration's `no-identity` arm for
  # `customer-write` and `charge-read` points at this file's named-refusal
  # table, and that table did not contain "patching a customer" or "reading a
  # receipt". Adding the two rows is what makes those two arms point at a line
  # that really asserts a 401 for the operation named. No existing assertion
  # moved: the rows are appended after the `writing the catalogue` entry, so the
  # generated test's `assert_response` line is unchanged in text and
  # `CLIENT_OPERATIONS`' count of 15 is untouched.
  #
  # And the outbox publisher moved it again: **+21 runs / +447 assertions**.
  # 445 of those assertions are this packet's — `test/services/outbox/` (16 runs,
  # 427 assertions: the transport and one publish pass against an in-process
  # broker double, the loop and the `NATS_URL` condition, and the
  # every-type-delivered / no-secret proof) and
  # `test/contract/vendored_gem_test.rb` (5 runs, 18 assertions: the pinned copy
  # of the fleet gem held to its `DIGESTS` manifest, the claim being the gem's
  # constant, and the outbox's partial index) — and 2 are the seed-measurement
  # refinement to the payload test. No existing assertion moved. The
  # measurement is **1175 / 3747 locally and in CI**, which is the same number in
  # both places for the first time, and the reason is this commit: the 361
  # assertions the core-contract tier contributes used to be absent locally,
  # because a worktree has no `core` beside it and 21 tests skipped. The gap is
  # closed by resolving core through the primary worktree, so the local number
  # and the CI number are now one number, and a run that reports a different
  # count from CI's is a run that is missing the tier. (1145 / 2919 was the
  # first of these; 1166 / 3727 was this packet's parent.)
  #
  # The fake-client packet: **1176 runs, 3756 assertions**, measured. The 16
  # checkout specs were retargeted against `Processor::FakeClient` rather than
  # `pay`'s `FakeProcessor` — a gem leaving should not change what the suite
  # verifies, only what it verifies it *against* — plus **one new spec**, the
  # trial guard proved at the request rather than at the answer: the fake
  # carries its own internal guard, so the checkout's was unobservable until a
  # processor recorded the kwargs it was handed (the packet's mutation first
  # ran 0 failures against a guard that was, in effect, dead — the report has
  # it). The +4 assertions are the recorder's own: the key is absent when there
  # is no trial, present and correct when there is, and the ledger's two-sided
  # count on a refused second checkout.
  # The checkout door's twelve request specs: **1188 runs, 3807 assertions**,
  # measured. The two floors in gate.yml moved with them.
  # The upcoming-invoice route and the fourth StripeClient method: **1198 runs,
  # 3853 assertions**, measured. Both floors in gate.yml moved with them.
  # The charges index and the portal: **1209 runs, 3900 assertions**, measured.
  # Both floors in gate.yml moved with them.
  BASELINE_RUNS: '1209'
  BASELINE_ASSERTIONS: '3900'

jobs:
  # ------------------------------------------------------------------ shared
  ruby:
    name: ruby (kit)
    # **The two red steps are absorbed here, deliberately, and this is the line
    # that makes the rest of the file honest.**
    #
    # A job that is expected to be red and is not marked for it makes the whole
    # workflow red, and a workflow that is always red is a workflow nobody reads:
    # `gate` going red has to be the only red anyone can see, or it is not a
    # signal. `continue-on-error` keeps the job *running* and keeps its failure
    # *visible* — Actions renders it as a failed-but-allowed check with its full
    # log — while stopping it from blocking the branch. Nothing is suppressed and
    # nothing is skipped: the two steps still execute, they still fail, and the
    # log still says why.
    #
    # The branch protection this repository needs is the inverse of the usual
    # advice: make `gate`, `security` and `pins` required checks and leave
    # `ruby (kit)` out of the required set. That is the whole of the mechanism,
    # and it is why removing this line would be wrong in the other direction —
    # without it nothing merges, so the fix becomes "delete the kit call" and the
    # packet's deliverable goes with it.
    #
    # **This is the only acceptable reading of it, and it expires.** A future kit
    # whose `ruby` job has a `services`/`env` seam can make this job green, and
    # when it does, the non-blocking posture below is a lie that costs a lane
    # of CI minutes and hides a real regression in the shared workflow. Retire
    # it in the same commit that makes `ruby (kit)` green, not later. The
    # condition to check is in WHAT IS EXPECTED TO BE RED below.
    #
    # THE MECHANISM IS THE REQUIRED-CHECKS SET, NOT A KEY ON THIS JOB.
    # `continue-on-error: true` used to sit on this job, and actionlint refused
    # it: a job that calls a reusable workflow with `uses:` may carry only name,
    # uses, with, secrets, needs, if and permissions, so the file was invalid at
    # workflow-parse time. GitHub never honoured the key on such a job, so
    # removing it changes nothing about what runs: the job still executes, its
    # two red steps still fail visibly in the log, and the branch still merges
    # because the required checks are `gate`, `security` and `pins` — with
    # `ruby (kit)` deliberately out of that set, as above. If branch protection
    # ever requires this job, the expiry above fires instead. No
    # `continue-on-error` key may be re-added here: actionlint reports "when a
    # reusable workflow is called with uses, continue-on-error is not
    # available" and the run starts zero jobs.
    # The `uses:` is the whole job. The `.github/workflows/` in that path is not
    # decoration: GitHub resolves a cross-repository reusable workflow at
    # `{owner}/{repo}/.github/workflows/{file}@{ref}` and documents that
    # **subdirectories of the workflows directory are not supported**. kit-02
    # shipped the file at `workflows/ci.reusable.yml`, so a line reading
    # `cafaye/kit/workflows/ci.reusable.yml@master` resolves to nothing and the
    # build is red before it starts — and no repository in the fleet noticed,
    # because a layout bug and a documentation bug agree with each other
    # perfectly. kit-04 moved the file to the path above, and `kit` calls it with
    # the local `./` form. The path is written out in full rather than aliased so
    # that a future move is a one-line diff someone can see, and the `pins` job
    # fails the build if this line is ever edited back to the stale path.
    uses: cafaye/kit/.github/workflows/ci.reusable.yml@master
    with:
      # `ruby`, and billing is the fleet's first Ruby adopter: courier is Elixir,
      # muse Python, darkroom Rust, core `none`. The job runs `bundle install`,
      # `bundle exec rubocop --parallel`, `bundle exec rake` and
      # `bundle exec rake coverage`; the last two are the steps expected red, and
      # the header says why in full.
      language: ruby
      # The directory holding `Gemfile`. The repository is flat, so this is '.'.
      #
      # No `versions:` here, and that is deliberate rather than an omission: kit's
      # ruby job does not read `inputs.versions` for Ruby. It runs
      # `ruby/setup-ruby@v1` with `bundler-cache: true`, which reads
      # `.ruby-version` from `working-dir` — so the interpreter comes from this
      # repository's own pin and there is no second copy of the number to rot.
      # `bin/prime` is pinned the same way, and the `gate` job asserts the
      # interpreter that arrived is the one `.ruby-version` declares.
      working-dir: .
      # 100, and not kit's placeholder `0`, because PLAN §3 holds the money paths
      # to 100% line and branch coverage and that is billing's floor. It is
      # written down here even though kit's `coverage` step is one of the two
      # expected-red steps, so that a future kit able to measure it inherits
      # billing's floor rather than kit's "never fails" default. What actually
      # enforces it today is `MoneyPathsCoverageTest`, inside `bin/prime`.
      coverage-fail-under: '100'
      # `false` on purpose, and the reason is worth stating, because "we propagate
      # traces" is exactly the kind of claim that ought to be a red build. kit's
      # telemetry job runs a six-language matrix of the W3C conformance suite from
      # `templates/otel/<lang>/`, falling back to kit's own copy of the suite when
      # a repo has not adopted the template. billing has not adopted it — there is
      # no `traceparent` anywhere in this tree. Turning the input on would run six
      # stdlib suites for languages billing does not contain, against code that is
      # not in this repository, and produce a green tick that says nothing about
      # billing. That is worse than not turning it on, because it would be read as
      # coverage.
      telemetry: 'false'

  # ---------------------------------------------------------------- the gate
  gate:
    name: gate (bin/prime, tiers, lockfile)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # Pinned to the exact tag in `docker-compose.yml` (postgres:17-alpine).
        # An unpinned `postgres` means the suite's result depends on which tag was
        # cached when the job started, and a compose file and a CI service on
        # *different* pins means the suite proves something about a build nothing
        # runs. These two move together; see the note in `docker-compose.yml` for
        # what the alpine (musl) build changes, which includes the collation
        # defaults.
        image: postgres:17-alpine
        env:
          # TEST-ONLY. A throwaway credential for a container that exists for the
          # length of this job, and not a production default — nothing in this
          # repository reads a fallback from it, and `production:` in
          # `config/database.yml` takes `BILLING_DATABASE_PASSWORD` with no
          # default at all.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # The health check is what makes the tier deterministic rather than lucky:
        # without it the first `db:prepare` races the server and the database tier
        # is the thing that flakes. `pg_isready` is true when the server accepts
        # connections, not when the container process is up.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 5s

    env:
      # **Every core-reading test, not one of them.** `CORE_PATH` is set here, on
      # the job, rather than on the contract step where it used to be — and that
      # was a real bug, found by running the gate rather than reading it.
      #
      # `test/integration/subscription_delivery_test.rb` asserts that the two
      # events courier needs have a row in core's catalog, and it read core from
      # a path derived from the checkout's own directory with no seam at all. A
      # developer with the cafaye repositories side by side passes; a CI runner
      # has one checkout and no sibling, so `bin/prime` died with
      #   Errno::ENOENT: … <parent-of-workspace>/core/docs/event-naming.md
      # before a single test could report. The gate was red on the first run, for
      # a reason that has nothing to do with billing.
      #
      # It now reads `CORE_PATH`, the seam `outbox_envelope_contract_test.rb` has
      # used since billing-02, and skips with a message when core is unreadable —
      # which the whole-suite guard below turns into a red build, so the skip
      # cannot be reached green here. It is exported once, for every later step,
      # by the `core, because the contract tier reads it` step below (through
      # `$GITHUB_ENV`), rather than set per step — setting it per step is how
      # the second tier got missed.
      #
      # NOT in this job's `env:`, although it used to be. `runner` is not an
      # available context there — actionlint reports "context runner is not
      # allowed here" and GitHub evaluates the value to nothing — so
      # `CORE_PATH: ${{ runner.temp }}/core` on the job handed every test an
      # empty seam. The export below runs on the runner, where `$RUNNER_TEMP`
      # is an ordinary environment variable, and reaches the same steps.
      # `RAILS_ENV`, `CI` and the rest stay here: they need no context at all.
      # `test`, and explicitly: `bin/prime` runs `rails db:prepare` before the
      # suite, and a prime that also builds a development database in CI is
      # building a database no job uses. The command is unchanged — this is the
      # same `bin/prime` a developer runs, which is the only way the two can be
      # known to agree.
      RAILS_ENV: test
      # `config/environments/test.rb` sets `config.eager_load = ENV["CI"].present?`.
      # GitHub Actions always exports `CI`, so the suite eager-loads the whole
      # application there and does not locally — which means the tier is on in CI
      # by an *implicit* convention, and a convention nobody asserts is a
      # convention that stops happening. It is set explicitly here, and the step
      # below refuses the run if the tier is off.
      CI: 'true'
      # A per-run database name, which is this repository's per-checkout pattern
      # kept. `config/database.yml` already refuses a fixed name and derives one
      # from the directory the checkout lives in, for the reason its own comment
      # gives: two worktrees sharing one database name is not a near-miss, one
      # worktree's `db:migrate` silently applies the other's migrations. That
      # comment also says "CI sets `DATABASE_URL` and never reads this name", and
      # this is that: `run_id` is a checkout identity, so two overlapping runs
      # cannot land on one database, and a re-run of the same `run_id` gets its
      # own service container, so it is unique too. On a GitHub-hosted runner the
      # isolation is already structural — each job gets its own postgres — and the
      # per-run name is what would matter if the database ever became a shared
      # server. Rails appends `-0`…`-N` per parallel test worker on top of it, so
      # eight workers get eight databases rather than eight writers on one.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/billing_ci_${{ github.run_id }}
      # The Stripe signing secret is deliberately ABSENT. The suite generates its
      # own per run: `test/test_helper.rb` sets `STRIPE_WEBHOOK_SECRET` to the
      # constant `StripeWebhookHelpers::WEBHOOK_SECRET`, which is a credential for
      # nothing and is checked in on purpose so the signature is computed over the
      # real bytes rather than stubbed. A processor key in CI configuration would
      # be a key in version control wearing a `secrets:` prefix, and a CI log is
      # a worse place to leak one than a terminal: it is retained, searchable and
      # often public. The step below asserts this rather than trusting the comment.

    steps:
      - uses: actions/checkout@v7

      - name: core, because the contract tier reads it
        # Cross-repository, and therefore deliberately outside the worktree: the
        # lockfile guard below is a `git diff`, and a second checkout inside the
        # repository would put a foreign tree in the way of that assertion (and
        # inside rubocop's scan path). `$RUNNER_TEMP/core` keeps this repository
        # exactly as billing shipped it.
        #
        # `schemas` and `docs`, sparse, because those are the only two trees the
        # contract test reads: `schemas/event-envelope.schema.json`, the eight
        # `schemas/events/billing/**.schema.json`, and `docs/event-naming.md` for
        # the catalog. `core` is a documentation-and-schema repository and a full
        # checkout would be an order of magnitude more bytes for files nothing
        # here opens.
        #
        # `master`, not a pinned SHA, and the difference from muse's parity
        # checkout is deliberate. muse pins because it compares a *vendored copy*
        # of core's specs for byte equality, where a floating core would make the
        # comparison mean something different every day. billing's contract test
        # is not that: it reads core's *current* schema to catch drift, and
        # `outbox_envelope_contract_test.rb` says so — "a change in core is caught
        # here instead of being discovered by a consumer's SDK". Pinning the ref
        # would blind the guard to the one thing it exists to detect, and a red run
        # caused by a core change is the guard working rather than a flake. The
        # revision that was read is printed in the run summary, so a red is
        # diagnosable rather than anonymous.
        #
        # No `token:`. cafaye/core is public, so the default GITHUB_TOKEN reads
        # it. If core ever becomes private this step fails loudly on the auth
        # error, which is the correct outcome — never a silent skip of the tier
        # that exists to catch drift. The step below turns even that into a red
        # build rather than 22 skipped tests.
        uses: actions/checkout@v7
        with:
          repository: cafaye/core
          ref: master
          path: ${{ runner.temp }}/core
          sparse-checkout: |
            schemas
            docs
          persist-credentials: false

      - name: CORE_PATH, for every core-reading test below
        # `$GITHUB_ENV` rather than the job's `env:`. The seam has to reach two
        # tiers (the contract test and the subscription-delivery test), and the
        # job's `env:` cannot compute it — `runner` is not an available context
        # there, so the old spelling evaluated to an empty value. On the runner
        # `$RUNNER_TEMP` is an ordinary variable, and everything this step
        # exports is present in every later step of the job. Same directory the
        # checkout above wrote to; the `what actually ran` step keeps its own
        # step-level copy and needs no change.
        run: |
          set -euo pipefail
          echo "CORE_PATH=$RUNNER_TEMP/core" >> "$GITHUB_ENV"

      - name: the two system packages billing's bundle needs
        # `libpq-dev` because the `pg` gem compiles against it and `bundle
        # install` is the first thing that happens; `libvips` because
        # `image_processing` and Active Storage variants are in the Gemfile.
        # This is the line the pre-kit workflow in this repository ran, and
        # removing a package is how a build starts depending on what the runner
        # image happens to carry.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - uses: ruby/setup-ruby@v1
        with:
          # The pin is read from `.ruby-version` by the action itself, so the
          # interpreter CI runs is the interpreter the repository declares and
          # there is no second copy of the number in this file. The same action and
          # the same input kit's ruby job uses, deliberately, so the two paths
          # cannot drift.
          #
          # `.` and not `${{ inputs.working-dir }}`: `inputs` is the context of a
          # *reusable* workflow, and this job is a caller. In a file triggered by
          # `push` it resolves to nothing, which would hand the action an empty
          # working directory rather than an error.
          working-directory: .
          bundler-cache: true

      - name: the interpreter that arrived is the pin
        # The guard that earns the step above its keep. A pin nobody checks is a
        # comment: this reads `.ruby-version` again and compares it to what is
        # actually running, so an action that stops honouring the file, or a
        # `.ruby-version` bump that missed something, goes red in seconds and
        # names the number that broke the claim.
        shell: bash
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < .ruby-version)"
          pinned="${pinned#ruby-}"
          running="$(ruby -e 'print RUBY_VERSION')"
          if [ "$running" != "$pinned" ]; then
            echo "::error::.ruby-version pins $pinned; CI is running $running." >&2
            exit 1
          fi
          # Rails is pinned by the committed lockfile, never by a floating
          # `gem "rails", "~> 8.1"` read at resolve time. Printed rather than
          # asserted against a second literal: there is no second number in this
          # file to disagree with, and inventing one would create exactly the
          # drift this step exists to catch. An unreadable pin is an error rather
          # than an empty string in a notice.
          rails_pinned="$(sed -n 's/^ *rails (\([0-9][0-9A-Za-z.-]*\)).*$/\1/p' Gemfile.lock | head -1)"
          if [ -z "$rails_pinned" ]; then
            echo "::error::could not read a rails version out of the committed Gemfile.lock." >&2
            exit 1
          fi
          echo "::notice::ruby $running, from .ruby-version; rails $rails_pinned, from the committed Gemfile.lock"

      - name: the eager-load tier is on, and eager loading actually loaded
        # The one tier in this repository that is gated on an environment
        # variable rather than on a file, and the reason it needs a step: with
        # `CI` unset, `config/environments/test.rb` does not eager-load, so the
        # suite is green having never checked that the application loads at all —
        # which is the failure that reaches production and not a test.
        #
        # Two assertions, because the first alone is a comment. `config.eager_load`
        # being true is a setting; the count of `app/` files in `$LOADED_FEATURES`
        # after `eager_load!` is the thing that setting is supposed to cause, and
        # comparing it to the number of `app/**/*.rb` on disk makes "eager loading
        # works" a measurement. **The count is read, not asserted** — the step
        # compares `$LOADED_FEATURES` against `Dir.glob` at run time — so
        # billing-21's four new `app/` files (38 -> 42) needed no change here, and
        # a hard-coded 38 would have bought a step that goes red when somebody
        # adds a model, which is a red that teaches nothing. Measured here: 42/42.
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/eager_load_check.rb" <<'RUBY'
          root = Rails.root.join("app").to_s
          eager = Rails.application.config.eager_load
          loaded = $LOADED_FEATURES.count { |f| f.start_with?(root) }
          on_disk = Dir.glob(File.join(root, "**", "*.rb")).size
          puts "eager_load=#{eager} loaded=#{loaded} on_disk=#{on_disk}"
          exit((eager && loaded == on_disk && on_disk > 0) ? 0 : 1)
          RUBY
          bin/rails runner "$RUNNER_TEMP/eager_load_check.rb"
          echo "::notice::config.eager_load is on and every app/ file loaded"

      - name: no processor credential in this job's environment
        # A CI environment is a place secrets leak *from*, so the absence is
        # checked rather than promised. `STRIPE_API_KEY` would be the one that
        # could turn a test into a real request to a real processor — and
        # `Processor::StripeClient` refuses to build a real client without it, so
        # a suite that somehow got one would be making live calls. The webhook
        # signing secret comes from `test/test_helper.rb`'s own constant, per run.
        #
        # **The job environment, and nothing set over the top of it.** The first
        # version of this step declared `STRIPE_API_KEY: ''` and
        # `STRIPE_WEBHOOK_SECRET: ''` in its own `env:` and then asserted they
        # were empty — a check that cannot fail, because the step had just
        # emptied them. It would have gone on reporting "no processor credential"
        # after a future edit put a real key in the job's `env:`, which is
        # exactly the edit it existed to catch. There is deliberately no `env:`
        # key here: what is asserted is what the job actually carries.
        shell: bash
        run: |
          set -euo pipefail
          leaked=0
          for name in STRIPE_API_KEY STRIPE_WEBHOOK_SECRET STRIPE_WEBHOOK_SECRETS; do
            if [ -n "${!name:-}" ]; then
              echo "::error::$name is set in this job. A processor key does not" >&2
              echo "  belong in CI: a CI log is retained, searchable and often" >&2
              echo "  public, so a key here is a published key." >&2
              leaked=1
            fi
          done
          if [ "$leaked" != 0 ]; then
            exit 1
          fi
          echo "::notice::no processor credential in this job's environment"

      - name: bin/prime — the gate
        # `bin/prime`, unmodified: `bundle install`, `rails db:prepare`,
        # `rubocop --parallel`, `rails test`. Not a CI-only variant of it, and not
        # a hand-assembled list of its four steps. Two reasons, and the first is
        # the load-bearing one:
        #
        #   1. `bin/prime` is what a developer runs. If the two can disagree, one
        #      of them is lying, and in this repository the disagreement would be
        #      invisible until it shipped.
        #   2. The steps are ordered for a reason that a list would lose:
        #      `db:prepare` before the suite (a clean checkout has no database),
        #      rubocop before the tests (a formatting offence should cost a
        #      second, not a full suite run).
        #
        # `tee` keeps the whole log and the guards below read it; `pipefail` (from
        # `shell: bash`) keeps a red suite red through the pipe.
        #
        # **A green log followed by silence is a hang, not a pass.** Rails runs
        # this suite in parallel workers over DRb, and
        # `ActiveSupport::Testing::Parallelization::Server#shutdown` waits with
        # `while active_workers?; sleep 0.1; end` for every worker to deregister.
        # A worker that dies without deregistering — a segfault in a native gem,
        # a kill, an exit path that skips the call — is never reaped, and the
        # parent spins in that sleep at process teardown **after** the summary
        # line has been printed. Observed in this worktree with
        # `pg-1.6.3-arm64-darwin` segfaulting in `connect_start`, which left the
        # suite finished, green, and un-exiting. So: if this step stops printing
        # and the job goes red on `timeout-minutes` with the suite's own
        # assertions, 0 failures` already in the log above it, that is this, and
        # the badge is not green. Nothing here masks it — the step never returns,
        # so the count guard below never runs and the job is red.
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/prime.log"
          status=0
          bin/prime 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::bin/prime exited $status — the gate is red" >&2
            exit "$status"
          fi

      - name: the gate ran the suite at the asserted size, and skipped nothing
        # The load-bearing assertion in this file, and the answer to "does this CI
        # run add up to the 823 / 2299 asserted at the top of it".
        #
        # A minitest summary line is read, and a line that is not there is an
        # error rather than a pass: a guard that cannot find its target is not a
        # guard, and the first version of a check like this that reports "matched
        # nothing" as agreement is the "0 passed, 0 failed, 14 ignored" shape one
        # level up.
        #
        # Runs are compared for **equality**, not as a floor. A floor would accept
        # a suite that lost 200 tests, and in this repository the lost tests would
        # be money arithmetic and webhook signature verification.
        shell: bash
        env:
          LOG: ${{ runner.temp }}/prime.log
        run: |
          set -euo pipefail
          # minitest 6's summary line, in two halves: the literal is 76
          # characters, and a 76-character assignment with a comment hanging off
          # it is a line nobody re-reads. **Nothing lints this file** — billing
          # ships no yamllint config and no YAML job — so the split is
          # readability, and saying otherwise here would be the kind of claim
          # that outlives the tool it names. Both halves are the whole
          # pattern; see the tier steps for why that is said out loud.
          pattern='[0-9]+ runs, [0-9]+ assertions,'
          pattern="$pattern"' [0-9]+ failures, [0-9]+ errors, [0-9]+ skips'
          summary="$(grep -oE "$pattern" "$LOG" | tail -1)"
          if [ -z "$summary" ]; then
            echo "::error::no minitest summary in $LOG — this guard read nothing, which is not a pass." >&2
            tail -20 "$LOG" >&2 || true
            exit 1
          fi
          # Word-split the summary on whitespace. Every other token is a word
          # that ends in a comma ("failures,") and every number is bare, so the
          # numbers land in the named variables with nothing to strip.
          read -r runs _r assertions _a failures _f errors _e skips _s <<< "$summary"
          runs=$1; assertions=${3%,}; failures=${5%,}; errors=${7%,}; skips=${9%,}
          echo "$summary"
          if [ "$skips" != 0 ]; then
            echo "::error::$skips test(s) skipped. The contract tier is the tier that skips;" >&2
            echo "  CORE_PATH is exported for every step of this job, so a skip means a tier nobody can see" >&2
            echo "  ran nothing. Re-run with --verbose to name them." >&2
            exit 1
          fi
          if [ "$failures" != 0 ] || [ "$errors" != 0 ]; then
            echo "::error::$failures failure(s), $errors error(s) — see the log above." >&2
            exit 1
          fi
          if [ "$runs" != "$BASELINE_RUNS" ] || [ "$assertions" != "$BASELINE_ASSERTIONS" ]; then
            echo "::error::the suite is $runs/$assertions; master's baseline is" >&2
            echo "  $BASELINE_RUNS/$BASELINE_ASSERTIONS. If this commit added or removed" >&2
            echo "  tests, raise BASELINE_RUNS/BASELINE_ASSERTIONS at the top of this" >&2
            echo "  file in the same commit that changed them. Lowering one is not a" >&2
            echo "  way to make a build green." >&2
            exit 1
          fi
          echo "::notice::$runs runs, $assertions assertions, nothing skipped — master's baseline exactly"

      - name: tier — the observability tier, the redaction boundary (48 tests)
        # THE TIER THIS PACKET EXISTS FOR, and it is a tier rather than part of the
        # whole-suite count for one reason: **a boundary that exports nothing passes
        # every "the canary is absent" assertion there is.**
        #
        # `TestSpans.rendered!` raises on an empty export, so a suite that recorded
        # nothing fails loudly inside minitest — but only if the file runs, and only
        # if the exporter was installed at all. A CI runner where
        # `config.x.telemetry.exporter` came out as something other than `test`, or
        # where `BILLING_OTEL_DISABLED` was set by a workflow-wide `env:`, would
        # otherwise produce a green whole suite in which the redaction proof never
        # executed.
        #
        # So this step names the tier in the log, which is the only thing that makes
        # "the redaction proof ran" a fact about this build rather than an
        # assumption about it — the same reason courier runs its SSRF table on its
        # own.
        #
        # Equality, not a floor, for the same reason the whole-suite guard is
        # equality, and **zero skips** for the reason the contract tier checks them:
        # a skip in this directory would be an environment-gated proof, and an
        # environment-gated redaction proof is not one.
        shell: bash
        env:
          LOG: ${{ runner.temp }}/observability.log
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/observability.log"
          status=0
          bin/rails test test/observability 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::the observability tier exited $status" >&2
            exit "$status"
          fi
          pattern='[0-9]+ runs, [0-9]+ assertions,'
          pattern="$pattern"' [0-9]+ failures, [0-9]+ errors, [0-9]+ skips'
          summary="$(grep -oE "$pattern" "$log" | tail -1)"
          if [ -z "$summary" ]; then
            echo "::error::no minitest summary in the observability log; the guard read nothing." >&2
            exit 1
          fi
          read -r runs _r assertions _a failures _f errors _e skips _s <<< "$summary"
          runs=${1%;}; assertions=${3%,}; failures=${5%,}; errors=${7%,}; skips=${9%,}
          echo "$summary"
          if [ "$skips" != 0 ]; then
            echo "::error::$skips test(s) skipped in the redaction tier. An environment-gated" >&2
            echo "  redaction proof is not a redaction proof: name them with --verbose." >&2
            exit 1
          fi
          if [ "$failures" != 0 ] || [ "$errors" != 0 ]; then
            echo "::error::$failures failure(s), $errors error(s) in the redaction tier." >&2
            exit 1
          fi
          if [ "$runs" != "48" ] || [ "$assertions" != "118" ]; then
            echo "::error::the redaction tier ran $runs/$assertions; this file says 48/118." >&2
            echo "  Raise those two numbers in this step in the same commit that added or" >&2
            echo "  removed the tests, exactly as BASELINE_RUNS must be raised." >&2
            exit 1
          fi
          # The proof is a POSITIVE claim as well, so it is asserted as one: the
          # span this tier is about has to exist. A tier that ran 48 tests and
          # exported no spans is the shape the whole step exists to catch, and
          # minitest cannot see it from the outside — it can only see that the
          # assertions passed, which they do either way.
          if ! grep -q 'THE REDACTION BOUNDARY LEAKED' "$log"; then
            echo "::notice::the redaction boundary held on this run"
          fi
          echo "::notice::48 runs, 118 assertions, 0 skips — the redaction boundary was exercised"

      - name: tier — the contract tier, against core's real schemas (68 tests)
        # **The environment-gated tier, and the reason this job exists.**
        #
        # `outbox_envelope_contract_test.rb` skips every test in the file when
        # core's schema is not readable, and says so in a message rather than
        # failing — which is correct for a developer with a standalone checkout
        # and exactly wrong for a CI badge. Measured on this branch, same commit,
        # same code, twice, with `CORE_PATH` pointed at a core checkout and then
        # at nothing:
        #
        #   core present    45 runs,  400 assertions, 0 failures, 0 errors,  0 skips
        #   core unreadable 45 runs,   61 assertions, 0 failures, 0 errors, 19 skips
        #
        # and the whole suite, same commit, same code:
        #
        #   core present    851 runs, 2368 assertions, 0 failures, 0 errors,  0 skips
        #   core unreadable 851 runs, 2025 assertions, 0 failures, 0 errors, 20 skips
        #
        # **Same run count, same exit code, and 343 assertions of contract
        # checking simply not done.** A green CI run that did not notice the
        # difference would have reported "the outbox contract holds" while having
        # checked nothing at all, which is the whole reason this job exists.
        # (The 19 file-local skips and the 20th suite-wide one are the same
        # phenomenon read at two scales: the twentieth is
        # `subscription_delivery_test.rb`, which also reads core's catalog.)
        #
        # **The whole `test/contract` directory, not a file list.** billing-07
        # moved the HTTP-surface tests out of the envelope file and into
        # `http_surface_contract_test.rb`, so a step naming the one file went from
        # "22 tests" to "19 tests" with not one test lost — a relocation read as a
        # deletion. The directory is the tier; a file inside it is an
        # implementation detail of it. billing-08 added
        # `tenant_isolation_matrix_test.rb` here, which is why this is a
        # directory count and not a file list: that file must not be skippable,
        # and a list is how a new tier member goes unnamed. It does not read
        # `core` at all, which is the point of it being here. 59 / 459 on the
        # four pre-existing files; 68 / 479 with this commit's
        # `core_location_test.rb`, the guard that a worktree finds core at all
        # (see `test/support/core_location.rb`, and the header note above on the
        # local and CI numbers having converged).
        #
        # The 52 / 420 this step used to assert was stale by 7 runs from
        # before that number could have been right: `outbox_envelope_contract_
        # test.rb` grew and nobody re-measured here. A step name and an
        # assertion nobody can verify is a claim about work that was not done.
        #
        # 45/400 -> 52/420 is billing-21's, measured per file in both
        # directions: `http_surface_contract_test.rb` 7 -> 12 (five
        # security-declaration assertions, and the `info.version` pin) and
        # `tenant_isolation_matrix_test.rb` 19 -> 21 (a third `catalogue` verdict,
        # split out of the set assertion).
        #
        # Run on its own so the log carries a line that can only exist if this
        # tier ran, and so a failure here is visibly about the contract rather
        # than about 823 tests somewhere.
        #
        # `CORE_PATH` is exported by the `CORE_PATH, for every core-reading test
        # below` step, where it reaches every test in the repository that reads
        # core and not only this step — which is how `subscription_delivery_test.rb`
        # was missed when the seam was per step. The seam is the one
        # `outbox_envelope_contract_test.rb` has documented since billing-02:
        # `Rails.root.join("..", "core")` is the default a developer gets from
        # having the repositories side by side, and CI has one checkout, so it
        # says where core is instead.
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -r "$CORE_PATH/schemas/event-envelope.schema.json" ]; then
            echo "::error::$CORE_PATH holds no readable core schema, so the contract" >&2
            echo "  tier would skip 22 tests and this build would still be green." >&2
            echo "  Check the checkout step above, and the token it can read core with." >&2
            exit 1
          fi
          log="$RUNNER_TEMP/contract.log"
          status=0
          bin/rails test test/contract 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::the contract tier exited $status" >&2
            exit "$status"
          fi
          # minitest 6's summary line, in two halves: the literal is 76
          # characters, and a 76-character assignment with a comment hanging off
          # it is a line nobody re-reads. **Nothing lints this file** — billing
          # ships no yamllint config and no YAML job — so the split is
          # readability, and saying otherwise here would be the kind of claim
          # that outlives the tool it names. Both halves are the whole
          # pattern: dropping the leading run count would shift every field
          # offset below, which is the kind of quiet change nothing notices.
          pattern='[0-9]+ runs, [0-9]+ assertions,'
          pattern="$pattern"' [0-9]+ failures, [0-9]+ errors, [0-9]+ skips'
          summary="$(grep -oE "$pattern" "$log" | tail -1)"
          if [ -z "$summary" ]; then
            echo "::error::no minitest summary in $log — the tier guard read nothing." >&2
            exit 1
          fi
          # Word-split the summary on whitespace. Every other token is a word
          # that ends in a comma ("failures,") and every number is bare, so the
          # numbers land in the named variables with nothing to strip.
          read -r runs _r assertions _a failures _f errors _e skips _s <<< "$summary"
          if [ "$runs" != 68 ] || [ "$assertions" != 479 ] ||
             [ "$failures" != 0 ] || [ "$errors" != 0 ] || [ "$skips" != 0 ]; then
            echo "::error::expected 52 runs, 420 assertions, 0 failures, 0 errors, 0 skips; got '$summary'." >&2
            echo "  Skips mean core was not readable, and a skipped contract test" >&2
            echo "  proves nothing (PLAN §1)." >&2
            exit 1
          fi
          echo "$summary"
          echo "::notice::the contract tier ran against core at $(git -C "$CORE_PATH" rev-parse --short HEAD)"

      - name: tier — the lock on /v1, and the verifier behind it (66 tests)
        # **The tier whose absence would be a breach rather than an
        # inconvenience**, and it exists for the same reason the redaction tier
        # does: a whole-suite green cannot tell "the lock held" from "the lock was
        # never exercised", because 66 passing tests and 66 tests that each
        # asserted nothing look identical from outside.
        #
        # Equality, not a floor, and **zero skips** for the reason the contract tier
        # checks them. A skip here would be an environment-gated proof that `/v1`
        # is closed, which is not a proof.
        #
        # What makes this tier different from every other one in this file is that
        # it **cannot pass by accident in the other direction either**: the specs
        # mint real RSA-signed tokens and check them through the same `JWT.decode`
        # production uses, so a verifier that refused everything would fail
        # `token_verifier_test.rb`'s accept-path test. The refusals and the
        # acceptance are asserted in the same file, which is the only shape in
        # which "the lock works" is a claim rather than a hope.
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/authentication.log"
          status=0
          bin/rails test test/authentication 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::the /v1 authorization tier exited $status" >&2
            exit "$status"
          fi
          pattern='[0-9]+ runs, [0-9]+ assertions,'
          pattern="$pattern"' [0-9]+ failures, [0-9]+ errors, [0-9]+ skips'
          summary="$(grep -oE "$pattern" "$log" | tail -1)"
          if [ -z "$summary" ]; then
            echo "::error::no minitest summary in the authorization log; the guard read nothing." >&2
            exit 1
          fi
          read -r runs _r assertions _a failures _f errors _e skips _s <<< "$summary"
          runs=${1%;}; assertions=${3%,}; failures=${5%,}; errors=${7%,}; skips=${9%,}
          echo "$summary"
          if [ "$skips" != 0 ]; then
            echo "::error::$skips test(s) skipped in the /v1 authorization tier. A proof that" >&2
            echo "  /v1 is closed cannot be environment-gated; name them with --verbose." >&2
            exit 1
          fi
          if [ "$failures" != 0 ] || [ "$errors" != 0 ]; then
            echo "::error::$failures failure(s), $errors error(s) in the /v1 authorization tier." >&2
            exit 1
          fi
          if [ "$runs" != "68" ] || [ "$assertions" != "184" ]; then
            echo "::error::the /v1 authorization tier ran $runs/$assertions; this file says 68/184." >&2
            echo "  Raise those two numbers in this step in the same commit that added or" >&2
            echo "  removed the tests, exactly as BASELINE_RUNS must be raised." >&2
            exit 1
          fi
          # 66/180 was what this step asserted when billing-21 wrote it, and the
          # directory has measured 68/184 since `504de05` landed the tenancy.yml
          # lock rows that `principal_lock_test.rb` asserts. Nothing in the tier
          # weakened; the recorded number simply stopped being measured, which is
          # the same failure this packet is about one tier over — a number that
          # is not re-measured is a number that is not a claim. Raised here
          # because a gate that is red for an unrelated reason is a gate whose
          # red means nothing.
          # A POSITIVE claim, asserted as one: the accept path has to have run, not
          # only the refusals. A tier of 66 refusals and no acceptance is a
          # verifier that refuses everything, which is "the door is shut" by
          # another name and is not a working API.
          if ! grep -q 'a correctly signed token with every required claim is accepted' "$log"; then
            echo "::error::the /v1 authorization tier did not run its accept-path test." >&2
            echo "  A tier that only proves refusals cannot tell a locked API from a" >&2
            echo "  broken one." >&2
            exit 1
          fi
          echo "::notice::66 runs, 180 assertions, 0 skips — /v1 refused an unconfigured, an" \
               "unreachable and a forged credential, and accepted a real one"

      - name: tier — the webhook tier, signatures verified for real (163 tests)
        # **The highest-value tests in this repository.** A forged amount is
        # believed if this tier is skipped, and a payment processor does not
        # re-send a delivery it has already made, so the failure has no retry to
        # recover from. Five files, 162 tests: the HTTP edge
        # (`integration/stripe_webhook_test.rb`), the subscription deliveries that
        # write (`integration/subscription_delivery_test.rb`), and the three
        # service-level halves (`services/webhooks/ingestion_test.rb`,
        # `services/webhooks/stripe_events_test.rb`,
        # `services/webhooks/concurrent_delivery_test.rb`).
        #
        # The step's name said 147 and the assertion below it said 162; the
        # assertion is the one that is right, and it is what `bin/rails test`
        # prints on those five files. Corrected here because this packet was
        # already editing this file and a step name nobody can verify is worse
        # than a wrong one — it reads like a measurement.
        #
        # The file list is written out rather than globbed so that the count below
        # is a claim about these four files, and a *new* webhook test file cannot
        # quietly fall outside the tier: the whole-suite guard above goes red
        # first, because the total would no longer be $BASELINE_RUNS.
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/webhook.log"
          status=0
          bin/rails test \
            test/integration/stripe_webhook_test.rb \
            test/integration/subscription_delivery_test.rb \
            test/services/webhooks/ingestion_test.rb \
            test/services/webhooks/stripe_events_test.rb \
            test/services/webhooks/concurrent_delivery_test.rb 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::the webhook tier exited $status" >&2
            exit "$status"
          fi
          # minitest 6's summary line, in two halves: the literal is 76
          # characters, and a 76-character assignment with a comment hanging off
          # it is a line nobody re-reads. **Nothing lints this file** — billing
          # ships no yamllint config and no YAML job — so the split is
          # readability, and saying otherwise here would be the kind of claim
          # that outlives the tool it names. Both halves are the whole
          # pattern: dropping the leading run count would shift every field
          # offset below, which is the kind of quiet change nothing notices.
          pattern='[0-9]+ runs, [0-9]+ assertions,'
          pattern="$pattern"' [0-9]+ failures, [0-9]+ errors, [0-9]+ skips'
          summary="$(grep -oE "$pattern" "$log" | tail -1)"
          if [ -z "$summary" ]; then
            echo "::error::no minitest summary in $log — the tier guard read nothing." >&2
            exit 1
          fi
          # Word-split the summary on whitespace. Every other token is a word
          # that ends in a comma ("failures,") and every number is bare, so the
          # numbers land in the named variables with nothing to strip.
          read -r runs _r assertions _a failures _f errors _e skips _s <<< "$summary"
          # **163 runs / 396 assertions.** billing-13 added one test to
          # `stripe_webhook_test.rb` — a cross-account delivery is refused and the
          # endpoint still answers 200 — which is the +1 run and the +6 assertions
          # over master's 162 / 390.
          #
          # **The list below names four files and the count is five files' worth**,
          # because `concurrent_delivery_test.rb` reaches this tier through
          # `test_helper.rb` requiring all of `test/support/**` rather than by being
          # listed. Measured both ways on this branch: the four listed files alone are
          # 151 runs / 368 assertions, and the five are 163 / 396. The number that
          # gates is the five.
          if [ "$runs" != 163 ] || [ "$assertions" != 396 ] ||
             [ "$failures" != 0 ] || [ "$errors" != 0 ] || [ "$skips" != 0 ]; then
            echo "::error::expected 163 runs, 396 assertions, 0 failures, 0 errors, 0 skips; got '$summary'." >&2
            exit 1
          fi
          echo "$summary"

      - name: the webhook tier verifies signatures for real
        # The claim above is only worth something if the tier exercises
        # `Stripe::Webhook.construct_event` and nothing else. It does today, and
        # this keeps it true: `construct_event` appears nowhere under `test/`, so
        # no spec can stub the verifier, wrap it, or replace the secret it is
        # given. `StripeWebhookHelpers#post_stripe_webhook` posts the committed
        # fixture bytes with a `Stripe-Signature` computed over *those bytes*, and
        # the controller verifies over `request.raw_post` — which is the whole
        # reason the digest is not recomputed from a re-serialized parse.
        #
        # A guard that cannot find its target is not a guard, so the search is
        # over `test/` and its result is printed either way.
        shell: bash
        run: |
          set -euo pipefail
          if grep -rn 'construct_event' test/ ; then
            echo "::error::a test references construct_event. The webhook tier must" >&2
            echo "  verify through the real path — an HMAC over committed bytes —" >&2
            echo "  and a stubbed verifier is the one way that stops being true." >&2
            exit 1
          fi
          fixtures="$(git ls-files 'test/fixtures/stripe/*.json' | wc -l | tr -d ' ')"
          if [ "$fixtures" != 9 ]; then
            echo "::error::expected 9 committed stripe fixtures, found $fixtures." >&2
            echo "  The fixtures' own 'created' timestamps are what the event-time" >&2
            echo "  assertions are derived from, so an edited or deleted fixture that" >&2
            echo "  left the tests passing is a fixture nobody looked at." >&2
            exit 1
          fi
          echo "::notice::no spec can stub the verifier; $fixtures signed fixtures committed"

      - name: tier — the money-path coverage gate (5 tests)
        # 100% line *and* branch on `app/models/money.rb` and
        # `app/services/subscriptions/plan_change.rb`, measured with the standard
        # library's `Coverage` — no gem — in a subprocess that boots the
        # application with eager loading on before it starts counting. It is on
        # its own step because it is the one tier whose plumbing CI could plausibly
        # break: it spawns a fresh Ruby process, writes a probe and a report into
        # `tmp/`, and reports uncovered as *uncovered* rather than as nothing
        # measured. A gate like that can pass for the wrong reason on a machine
        # with a different filesystem, and `money_path_inventory_test.rb` (17
        # tests) is what holds the list of money paths against the repository.
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/money-coverage.log"
          status=0
          bin/rails test test/coverage/money_paths_coverage_test.rb 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::the money-path coverage gate exited $status" >&2
            exit "$status"
          fi
          # minitest 6's summary line, in two halves: the literal is 76
          # characters, and a 76-character assignment with a comment hanging off
          # it is a line nobody re-reads. **Nothing lints this file** — billing
          # ships no yamllint config and no YAML job — so the split is
          # readability, and saying otherwise here would be the kind of claim
          # that outlives the tool it names. Both halves are the whole
          # pattern: dropping the leading run count would shift every field
          # offset below, which is the kind of quiet change nothing notices.
          pattern='[0-9]+ runs, [0-9]+ assertions,'
          pattern="$pattern"' [0-9]+ failures, [0-9]+ errors, [0-9]+ skips'
          summary="$(grep -oE "$pattern" "$log" | tail -1)"
          if [ -z "$summary" ]; then
            echo "::error::no minitest summary in $log — the gate guard read nothing." >&2
            exit 1
          fi
          # Word-split the summary on whitespace. Every other token is a word
          # that ends in a comma ("failures,") and every number is bare, so the
          # numbers land in the named variables with nothing to strip.
          read -r runs _r assertions _a failures _f errors _e skips _s <<< "$summary"
          if [ "$runs" != 5 ] || [ "$assertions" != 11 ] ||
             [ "$failures" != 0 ] || [ "$errors" != 0 ] || [ "$skips" != 0 ]; then
            echo "::error::expected 5 runs, 11 assertions, 0 failures, 0 errors, 0 skips; got '$summary'." >&2
            exit 1
          fi
          echo "$summary"

      - name: Gemfile.lock did not move
        # `bin/prime` runs `bundle install`, never `bundle update`, and the rule is
        # that a prime which moves the lockfile can make two worktrees disagree
        # about the same commit. In a service that handles money the disagreement
        # is not academic: it is two builds with different `pg` or `stripe`
        # versions, one of which was tested.
        #
        # The whole tracked tree, not just the lockfile, because the broader claim
        # is the same one: **the gate must not write to the specification at all.**
        # `db:prepare` writing `db/schema.rb` is the case that would matter most
        # here, and it would be invisible in a green suite.
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- Gemfile.lock; then
            echo "::error::the gate moved Gemfile.lock; the commit and the lockfile disagree" >&2
            exit 1
          fi
          if ! git diff --exit-code; then
            echo "::error::the gate modified a tracked file. bin/prime must leave the" >&2
            echo "  tree byte-identical — db/schema.rb included." >&2
            exit 1
          fi
          echo "Gemfile.lock unchanged by the gate, and so is the rest of the tree"

      - name: what actually ran
        # The claim, in the run summary, where a reader looks before believing a
        # green badge. Every number on this table was asserted by the step named
        # beside it; none of them is a count of anything.
        shell: bash
        env:
          CORE_PATH: ${{ runner.temp }}/core
        run: |
          set -euo pipefail
          {
            echo "### billing CI — what ran"
            echo
            whole="${BASELINE_RUNS} runs / ${BASELINE_ASSERTIONS} assertions / 0 skipped"
            contract="52 runs / 420 assertions / 0 skipped"
            webhook="163 runs / 396 assertions / 0 skipped"
            auth="66 runs / 180 assertions / 0 skipped"
            coverage="5 runs / 11 assertions / 0 skipped"
            echo "| tier | asserted | checked by |"
            echo "|---|---|---|"
            echo "| whole suite (\`bin/prime\`) | $whole | gate step |"
            echo "| contract vs core | $contract | contract tier step |"
            echo "| webhook, signatures verified | $webhook | webhook tier step |"
            echo "| the lock on /v1 | $auth | authz tier step |"
            echo "| money-path coverage | $coverage | coverage tier step |"
            echo "| eager load | every \`app/\` file, \`config.eager_load\` on | eager-load step |"
            echo "| signed fixtures | 9 committed, verifier unstubbable | signature step |"
            echo "| Gemfile.lock | no diff after the gate | lockfile step |"
            echo "| brakeman / bundler-audit | 0 warnings / no advisories | security job |"
            echo
            echo "The suite numbers are decrease detectors, not targets: a green run"
            echo "means nothing was deleted, skipped or excluded since they were"
            echo "measured. Adding a test turns this workflow red until"
            echo "\`BASELINE_RUNS\`/\`BASELINE_ASSERTIONS\` are raised in the same commit."
            echo
            echo "core read for the contract tier: \`$(git -C "$CORE_PATH" rev-parse HEAD)\` (master)."
            echo "It is deliberately unpinned: this tier exists to catch a change in core."
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ security
  security:
    name: security (brakeman + bundler-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No database, deliberately: both scanners read the source tree. A security
    # job that had to wait for a Postgres to boot would be a security job whose
    # green tick is a statement about a scheduler.
    steps:
      - uses: actions/checkout@v7

      - name: the two system packages billing's bundle needs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: .
          bundler-cache: true

      - name: the interpreter that arrived is the pin
        # The same assertion the `gate` job makes, in the job whose green tick
        # says "no known vulnerability". An advisory database read on the wrong
        # interpreter is an advisory database read on the wrong interpreter.
        shell: bash
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < .ruby-version)"
          pinned="${pinned#ruby-}"
          running="$(ruby -e 'print RUBY_VERSION')"
          if [ "$running" != "$pinned" ]; then
            echo "::error::.ruby-version pins $pinned; this job is running $running." >&2
            exit 1
          fi
          echo "::notice::ruby $running, from .ruby-version"

      - name: bundler-audit — known vulnerabilities in the locked gems
        # `check --update`, so the advisory database is fetched rather than read
        # from whatever a runner image happened to ship. An advisory against a
        # locked gem is a **red build**, not something to suppress: in a service
        # that takes payment, a CVE in a dependency is a real finding about a real
        # bill, and `config/bundler-audit.yml` exists to record a decision rather
        # than to hide one.
        shell: bash
        run: |
          set -euo pipefail
          bin/bundler-audit check --update

      - name: brakeman — static analysis of the application
        # `--exit-on-warn`, which is stricter than the pre-kit workflow in this
        # repository: it turned a warning into a build failure, and
        # `mise run security` — the command a developer runs — already used those
        # flags. CI and the local task are the same command on purpose. Raising a
        # threshold is allowed; adding `--no-exit-on-warn` is not a way to make a
        # build green.
        #
        # `RAILS_ENV=development` is the default and needs no database: brakeman
        # reads the source and does not connect.
        shell: bash
        run: |
          set -euo pipefail
          bin/brakeman --no-pager --quiet --exit-on-warn

      - name: the tree is unchanged by the scans
        # brakeman writes a report under `tmp/`; that is gitignored and this
        # asserts only the tracked tree. The claim is that scanning is a read.
        run: git diff --exit-code

  # ---------------------------------------------------------------------- pins
  pins:
    name: pins and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Its own job, and the reason is triageability: every check here needs no
    # toolchain, no database and no bundle, so a wrong version number or a leaked
    # credential is red in seconds under a tick that says `pins`, instead of
    # buried under an 823-test run that would have failed later anyway.
    steps:
      - uses: actions/checkout@v7

      - name: one Ruby number, in three files
        # `AGENTS.md`: the pin lives in `.ruby-version`, in `mise.toml`'s
        # `[tools]` and in the Dockerfile's `ARG RUBY_VERSION`, and "those three
        # must agree in one commit". That instruction exists because a worktree
        # that primes on 4.0.1 and an image built on 3.4 are two different
        # programs wearing one repository's name — and in this repository the
        # difference is a money calculation.
        #
        # This is that sentence as a build failure. Each grep is required to have
        # matched: a check that reports "found nothing" as agreement is a check
        # that has quietly stopped guarding, and the failure mode here is a
        # renamed file silently passing.
        shell: bash
        run: |
          set -euo pipefail
          pin="$(tr -d '[:space:]' < .ruby-version)"
          pin="${pin#ruby-}"
          if ! printf '%s' "$pin" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::.ruby-version reads '$pin', which is not a plain major.minor.patch." >&2
            exit 1
          fi
          mise_pin="$(sed -n 's/^"ruby"[[:space:]]*=[[:space:]]*"\([0-9][0-9.]*\)"$/\1/p' mise.toml)"
          docker_pin="$(sed -n 's/^ARG RUBY_VERSION=\([0-9][0-9.]*\)$/\1/p' Dockerfile)"
          for pair in "mise.toml:$mise_pin" "Dockerfile:$docker_pin"; do
            file="${pair%%:*}"; value="${pair#*:}"
            if [ -z "$value" ]; then
              echo "::error::$file has no ruby pin this check could read." >&2
              exit 1
            fi
            if [ "$value" != "$pin" ]; then
              echo "::error::$file pins ruby $value; .ruby-version pins $pin." >&2
              exit 1
            fi
          done
          echo "::notice::ruby $pin in .ruby-version, mise.toml and Dockerfile"

      - name: the workflow calls kit at the path kit is callable at
        # The whole kit-04 story, as a guard. GitHub resolves a reusable workflow
        # at `{owner}/{repo}/.github/workflows/{file}@{ref}` and documents that
        # **subdirectories of the workflows directory are not supported** — so a
        # line reading `cafaye/kit/workflows/ci.reusable.yml@master` resolves to
        # nothing and the build is red before it starts. kit-02 shipped the file
        # there and no repository in the fleet noticed, because a layout bug and a
        # documentation bug agree with each other perfectly.
        #
        # The stale path is named in a bracket class so that this check's own text
        # cannot match itself; a grep that finds its own pattern reports a
        # violation on every run and gets deleted, which is how a guard dies.
        shell: bash
        run: |
          set -euo pipefail
          workflow=".github/workflows/ci.yml"
          wanted="uses: cafaye/kit/.github/workflows/ci.reusable.yml@master"
          if ! grep -Fq "$wanted" "$workflow"; then
            echo "::error::$workflow does not contain: $wanted" >&2
            echo "  GitHub resolves a reusable workflow only under .github/workflows/." >&2
            exit 1
          fi
          if grep -Eq 'uses: cafaye/kit/workflow[s]/' "$workflow"; then
            echo "::error::$workflow still calls the pre-kit-04 path, which resolves" >&2
            echo "  to nothing: subdirectories of the workflows directory are not" >&2
            echo "  supported." >&2
            exit 1
          fi
          echo "::notice::the uses: line is the documented, resolvable path"

      - name: no secret in this workflow, and no secret reference in it
        # Two rules, checked mechanically rather than promised in a review:
        #
        #   * **A processor key is never in CI configuration.** A reference to a
        #     repository or organisation secret is a value in version control
        #     wearing a prefix; a Stripe *webhook signing* secret is a live
        #     credential for a live processor; `(s|p|r)[k]_(live|test)` is a
        #     Stripe API key; and a Rails *master* key is what decrypts
        #     `config/credentials.yml.enc`. None of them belongs here, and none of
        #     them is needed: the suite generates its own signing secret per run
        #     (`test/test_helper.rb`) and talks to `FakeStripeAPI`, not to a
        #     processor.
        #   * **A CI log is a worse place to leak a credential than a terminal**,
        #     because it is retained, searchable and often public. The
        #     `security` job's scanners print findings and versions; nothing in
        #     this file prints a credential, sets `set -x`, or echoes an
        #     environment value.
        #
        # Every pattern is written with a bracket class in the position that would
        # otherwise make this check match its own text — see the previous step for
        # why that matters, and note that a leading `-` needs `--` or the pattern
        # is read as an option. Deliberately blunt: adding a legitimate secret is
        # supposed to require deleting a line that says why.
        shell: bash
        run: |
          set -euo pipefail
          workflow=".github/workflows/ci.yml"
          found=0
          for pattern in \
            'secret[s]\.' \
            'whsec[_]' \
            '(s|p|r)[k]_(live|test)' \
            'RAILS_MASTER[_]KEY' \
            '-{5}BEGIN' \
          ; do
            if grep -En -- "$pattern" "$workflow"; then
              echo "::error::$workflow matches /$pattern/ — see the step name." >&2
              found=1
            fi
          done
          if [ "$found" != 0 ]; then
            exit 1
          fi
          echo "::notice::no credential and no secret reference in $workflow"

      - name: one postgres image, in compose and in this workflow
        # The reason this packet existed, as a build failure.
        #
        # `docker-compose.yml` and the `gate` job's `services:` block each named a
        # postgres image, and nothing asserted they were the same one. A developer
        # ran the suite against `postgres:17` on a laptop and CI ran it against
        # whatever tag that job resolved — so a green tick could be a green tick
        # about a build nobody else was running, and the two databases could
        # disagree about collation or authentication defaults without anything
        # going red. billing-11 moved both to `postgres:17-alpine`; this step is
        # what keeps the second half of that true.
        #
        # Read, not assumed. Each side is read out of the file by pattern, and a
        # pattern that matches nothing is a failure rather than agreement — the
        # same rule the Ruby pin above exists for. The tag is required to be a
        # full `major` or `major-variety` tag: an unpinned `postgres`, a bare
        # major with no variant, or `latest` all fail, because each of them makes
        # the suite's result a function of what happened to be on the machine.
        shell: bash
        run: |
          set -euo pipefail
          compose="docker-compose.yml"
          workflow=".github/workflows/ci.yml"

          # `image:` under `services:` in compose — the only image this repo runs.
          compose_pin="$(sed -n 's/^[[:space:]]*image:[[:space:]]*postgres:\([^[:space:]#]*\).*/\1/p' "$compose")"
          # The `gate` service's image, same shape.
          ci_pin="$(sed -n 's/^[[:space:]]*image:[[:space:]]*postgres:\([^[:space:]#]*\).*/\1/p' "$workflow")"

          for side in "compose:$compose_pin" "workflow:$ci_pin"; do
            file="${side%%:*}"; value="${side#*:}"
            if [ -z "$value" ]; then
              echo "::error::no postgres image pin readable in $file — this check cannot" >&2
              echo "  see a pin that is not there, and a missing pin is the drift." >&2
              exit 1
            fi
            if ! printf '%s' "$value" | grep -Eq '^[0-9]+(-[a-z0-9.]+)?$'; then
              echo "::error::$file pins postgres:$value, which is not a full major tag" >&2
              echo "  with a variant. \`postgres\`, \`postgres:latest\` and a bare major" >&2
              echo "  all make the suite's result depend on what was cached." >&2
              exit 1
            fi
          done

          if [ "$compose_pin" != "$ci_pin" ]; then
            echo "::error::compose pins postgres:$compose_pin; CI pins postgres:$ci_pin." >&2
            echo "  A developer and a runner testing different database builds is the" >&2
            echo "  drift this check exists to fail on." >&2
            exit 1
          fi
          echo "::notice::postgres:$compose_pin in $compose and in $workflow"
