default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

<%
  checkout = Rails.root.basename.to_s
  default_name = checkout.sub(/\Abilling-?/, "").tr("-", "_")
  default_name = "billing" if default_name.empty?
  database_name = ENV["BILLING_DATABASE_NAME"].to_s.strip
  database_name = default_name if database_name.empty?
%>

development:
  <<: *default
  database: <%= database_name %>_development







test:
  <<: *default
  database: <%= database_name %>_test

production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
